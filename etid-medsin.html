de 30 semanas de edad gestacional por biometría fetal, el líquido amniótico en cantidad normal y la placenta de implantación posterior, previa oclusiva total, con dos lagos venosos subamnióticos por encima del orificio cervical interno. ¿Cuál es la complicación más probable?","opts":["Sangrado de la segunda mitad del embarazo","Acretismo placentario","Coagulación intravascular diseminada","Apoplejía uteroplacentaria"],"ans":[0],"fix":0},{"id":415,"page":158,"q":"El manejo y tratamiento óptimo de las complicaciones durante el embarazo depende fundamentalmente de:","opts":["La edad fetal.","El tipo de complicación.","El tamaño del útero.","La altura del fondo uterino."],"ans":[0],"fix":0},{"id":416,"page":158,"q":"¿Qué analgésico produce espasmo del esfínter de Oddi, en la pancreatitis aguda?","opts":["Morfina.","Pentazocina.","Meperidina.","Buprenorfina."],"ans":[0],"fix":0},{"id":417,"page":158,"q":"Una mujer que no ha menstruado hasta los 13 años sin el desarrollo de caracteres sexuales secundarios o hasta los 15 años con el desarrollo de caracteres sexuales secundarios, se considera que presenta:","opts":["Amenorrea primaria.","Amenorrea secundaria.","Oligomenorrea.","Hipomenorrea."],"ans":[0],"fix":0},{"id":418,"page":158,"q":"Un recién nacido pretérmino de 900 g. presenta ictericia severa por eritroblastocis fetal. Se acompaña de hepatomegalia y esplenomegalia. Se encuentra pálido. Sus niveles séricos de bilirrubina superan los 25 mg/dl. Se considera que este neonato está en riesgo de encefalopatía bilirrubínica o ictericia nuclear. Seleccione el tipo de bilirrubina que se encuentra elevada:","opts":["Indirecta.","Directa.","Conjugada.","Más directa que indirecta."],"ans":[0],"fix":0},{"id":419,"page":159,"q":"Un paciente de 4 años, 16 kg., presenta desde hace 3 horas diarreas muco- sanguinolentas no muy abundantes, fiebre y cólicos abdominales. Su estado de hidratación es adecuado. En heces presenta 78% de PMN y eritrocitos +++. No hay parásitos. En sangre: 13.890 leucocitos/µl, con 82% de neutrófilos. ¿Cuál es el diagnóstico más probable?","opts":["Disentería por Shigella.","Diarrea por Escherichia coli enterotoxigénico.","Diarrea por Cólera.","Diarrea por Escherichia coli entero patógeno."],"ans":[0],"fix":0},{"id":420,"page":159,"q":"Una mujer de 32 años acude a la consulta por ausencia de ciclos menstruales desde hace 3 meses. Refiere que hace 6 meses tuvo un aborto espontáneo de 8 semanas de gestación manejado con legrado uterino instrumental; después de este acontecimiento, sus menstruaciones fueron regulares cada 28 días, con flujo escaso, y desde hace 3 meses no ha tenido sangrado menstrual. Se ha realizado pruebas caseras de embarazo en orina con resultados negativos. Sus antecedentes personales incluyen un hipotiroidismo diagnosticado hace 10 años y toma levotiroxina 75 ug/día, TSH de reciente control en 2.5mUI/L. Antecedentes gineco obstétricos: ciclos menstruales c/28 días x 5 días, flujo normal, no dismenorrea. Gestas 2 Abortos 2. Al examen físico Peso 50kg Talla 155cm IMC 20,8; sin signos de androgenización, Tiroides 0A, examen mamario normal, sin galactorrea. Examen genital normal. En la evaluación bioquímica: prueba de progesterona negativa y prueba de estrógenos-progesterona negativa. FSH 6muI/L, Estradiol 45pg/ml ¿Cuál es el origen de esta amenorrea secundaria?","opts":["Uterina","Hipotalámica","Hipofisiaria","Ovárica"],"ans":[0],"fix":0},{"id":421,"page":160,"q":"Gestante de 37 semanas con labor de parto, dilatación de 4 cm y membranas íntegras. Cabeza fetal en primer plano. En el registro gráfico eléctrico se objetiva FCF basal antes de la contracción de 140 lpm y después del descenso de la contracción cae a 95 lpm y luego se recupera lentamente. El pH fetal del cuero cabelludo es 7.25, la bradicardia no es persistente por más de 3 contracciones seguidas. ¿Qué variación de la FCF se produjo según el registro gráfico eléctrico?","opts":["DIP II.","DIP I.","DIP III < 40 seg.","DIP III > 40 seg."],"ans":[0],"fix":0},{"id":422,"page":160,"q":"¿Qué signos predicen una parálisis respiratoria inminente en el síndrome de Guillain Barré?","opts":["Paresia facial y dificultad a la deglución.","Debilidad bilateral y flácida de las extremidades.","Oftalmoparesia y arreflexia de extremidades.","Neuropatía axonal sensitivomotora aguda."],"ans":[0],"fix":0},{"id":423,"page":160,"q":"El uso de los bloqueadores beta cardioselectivos en el tratamiento de hipertensión arterial están contraindicados en caso de:","opts":["Bloqueo auriculoventricular de segundo o tercer grado.","Infarto agudo de miocardio con estabilidad hemodinámica.","Taquicardia sinusal.","Taquiarritmias ventriculares."],"ans":[0],"fix":0},{"id":424,"page":161,"q":"Hombre de 72 años, acude a consulta externa llevado por familiares que refieren: desde hace 2 años, presenta olvidos de hechos recientes, conductas inapropiadas, agresividad, celotípia hacia la esposa, dificultades en la concentración, pérdida de la capacidad de realizar operaciones aritméticas básicas, administrarse medicamentos, bañarse, vestirse. Estas manifestaciones han empeorado en forma insidiosa. Paciente sin queja subjetiva. Antecedentes psicosociales negativos. Examen físico: TA: 110/70 mmHg, FC: 65 lpm, FR: 18 rpm. Examen neurológico: en las funciones cognitivas superiores se evidencia dificultades en la memoria de trabajo y en la memoria procedimental; memoria remota y declarativa sin alteración. Ánimo sin alteración. Pensamiento alterado con ideación delirante de robo. Insomnio de mantenimiento. Juicio ausente. ¿Cuál es el fármaco más útil para este paciente?","opts":["Risperidona.","Rivastigmina.","Memantina.","Sertralina."],"ans":[0],"fix":0},{"id":425,"page":161,"q":"En relación al uso de antibióticos en la pancreatitis aguda, escoja la respuesta correcta sobre su indicación:","opts":["Ante la demostración de infección o complicaciones sépticas.","En pacientes con diabetes mellitus tipo II en uso de insulina.","Desde el comienzo del cuadro para prevenir la infección pancreática.","En las pancreatitis graves aunque no se demuestre infección o necrosis."],"ans":[0],"fix":0},{"id":426,"page":161,"q":"El grupo sanguíneo que es conocido por ser capaz de donarle eritrocitos a personas de su mismo grupo y de cualquiera de los demás, es:","opts":["Grupo O, Factor Rh negativo.","Grupo O, Factor Rh positivo.","Grupo AB, Factor Rh positivo.","Grupo AB, Factor Rh negativo."],"ans":[0],"fix":0},{"id":427,"page":162,"q":"En relación con la fisiopatología del shock séptico, seleccione el enunciado correcto:","opts":["Es una forma de shock distributivo, donde hay hipovolemia absoluta al inicio que luego se perpetúa por vasodilatación periférica que conduce a hipotensión refractaria, con índice cardíaco normal o elevado.","Es una forma de shock cardiogénico, donde hay hipervolemia al inicio, con trasudación al espacio extracelular, edemas y vasoconstricción arterial periférica que mantiene la presión hasta fases avanzadas del shock.","Es una forma de shock cardiogénico, donde hay hipovolemia relativa refractaria que genera radicales libres y alcalemia, conduciendo a disfunción ventricular izquierda con edema pulmonar y caída del gasto cardíaco.","Es una forma de shock distributivo, donde hay hipervolemia inicial, que conduce a sobrecarga pulmonar con posterior fallo ventricular derecho, caída del gasto cardíaco, lactacidemia y, finalmente, fallo multiorgánico."],"ans":[0],"fix":0},{"id":428,"page":162,"q":"Un paciente de 40 años refiere dolor en el ojo izquierdo desde hace aproximadamente 6 semanas. Indica, como causa aparente el haberse rozado el ojo con la rama de un árbol. Desde entonces, se levanta frecuentemente con dolor en ese ojo que va cediendo a lo largo del día. ¿Cuál es la causa más probable del dolor?","opts":["Erosión corneal recidivante.","Hemorragia del cuerpo vítreo.","Aumento de la presión intraocular.","Conjuntivitis infecciosa."],"ans":[0],"fix":0},{"id":429,"page":162,"q":"Señale la patología que ocasiona anemia megaloblástica:","opts":["Gastrectomía total.","Síndrome de Mallory-Weiss.","Tumor esofágico.","Hernia del hiato."],"ans":[0],"fix":0},{"id":430,"page":163,"q":"Mujer de 61 años es hospitalizada para realizar una colecistectomía laparoscópica programada por colelitiasis sintomática desde hace 6 meses. Al examen físico presenta: TA: 110/80 mmHg, FC:80/min, FR: 18/min. Temperatura 36°C. La exploración abdominal es normal. Durante la cirugía, existe dificultad a la disección y se produce una lesión accidental con las pinzas en la región posterior del orificio omental (Hiato de Wislow), e inmediatamente el campo quirúrgico se llena de un gran volumen de sangre. ¿Qué estructura vascular es la que se lesionó con mayor probabilidad?","opts":["Vena cava inferior.","Aorta abdominal.","Vena porta.","Arteria renal derecha."],"ans":[0],"fix":0},{"id":431,"page":163,"q":"Hombre de 56 años, acude a consulta externa por control de diabetes mellitus tipo 2. Antecedentes: DM Tipo 2 hace 5 años. Al examen físico: TA: 150/90 mmHg, FC: 84 lpm, FR: 18 rpm; T: 36.5 C. IMC: 33 kg/m2. Consciente y orientado en las tres esferas. Cardiopulmonar: normal. Abdomen: suave, depresible, ruidos hidroaéreos conservados, no doloroso a la palpación, no masas palpables. Circunferencia abdominal: 105 cm. A la analítica presenta: Glucemia en ayunas: 180 mg/dL. HbA1c: 9%. HDL: 30 mg/mL. Triglicéridos: 200 mg/mL. ¿Cuál es el diagnóstico más probable?","opts":["Síndrome metabólico.","Dislipidemia: hipertrigliceridemia.","Hipertensión arterial grado 1.","Obesidad clase 1."],"ans":[0],"fix":0},{"id":432,"page":164,"q":"Paciente pediátrico con fiebre, faringitis, al examen físico: palidez alrededor de la boca, lengua de aspecto aframbuesado; cara que aparenta quemadura solar leve, la erupción papular eritematosa se observa alrededor del cuello que se extiende por el tronco y las extremidades, más intensa a lo largo del pliegue del codo, axilas e ingles; se observa descamación en sábana de los márgenes libres de las uñas, de palmas y plantas. ¿Cuál es el diagnóstico?","opts":["Escarlatina.","Faringoamigdalitis aguda.","Impétigo.","Erisipela."],"ans":[0],"fix":0},{"id":433,"page":164,"q":"Paciente de 5 años con antecedente de epilepsia, toma ácido valproico desde los 2 años, sin crisis desde hace 6 meses por lo que madre suspende la medicación. Acude a emergencia por presentar convulsión tónico clónico generalizada de 10 minutos de duración, llega en estado postictal y presenta un nuevo episodio de iguales características. Colocan primera dosis de diazepam vía rectal y convulsión no cede. ¿Cuál es la conducta a seguir?","opts":["Iniciar protocolo para manejo de status epiléptico.","Colocar sonda nasogástrica y administrar ácido valproico a dosis adecuadas.","Solicitar inmediatamente los niveles de ácido valproico.","Transferir inmediatemente a la Unidad de Cuidados Intensivos."],"ans":[0],"fix":0},{"id":434,"page":164,"q":"Adolescente que presenta hipotensión, hipertermia, depresión del reflejo nauseoso y coma, ¿Qué fármaco en sobredosis ingirió?","opts":["Benzodiazepinas.","Fenciclidina.","Opiáceos.","Anfetaminas."],"ans":[0],"fix":0},{"id":435,"page":165,"q":"Señale el examen de laboratorio (marcador de gravedad) de Pancreatitis Aguda durante las primeras 24 horas de hospitalización.","opts":["BUN > 22 mg/100mL.","Leucocitos < 6000 células/uL.","Hematocrito < 44 %.","Creatinina sérica <1 mg %."],"ans":[0],"fix":0},{"id":436,"page":165,"q":"Hombre de 42 años, economista de profesión, desempleado desde hace dos años. En las últimas semanas ha estado muy triste y con problemas para dormir. Es encontrado en el suelo por su familia, sin abrir los ojos y sin moverse, junto al paciente hay un frasco con pastillas. En emergencia, TA de 90/60 mmHg, Fc de 48 por minuto, T 35.9 ° C, FR 10 por minuto, superficial. Piel y mucosas secas. No hay signos externos de trauma craneal. Glasgow de 5/15 M: 3 V: 1 O:1. Mirada primaria central, con pupilas de 1 mm de diámetro, reactivas a la luz; reflejos oculocefálicos y oculovestibulares presentes. Flacidez y arreflexia generalizada en los miembros, respuesta de flexión anormal bilateral con estímulos nociceptivos. Respuesta plantar bilateral indiferente. No signos meníngeos. ¿Por cuál de las siguientes sustancias es la intoxicación más probable en este paciente?","opts":["Barbitúricos.","Fluoxetina.","Anfetaminas.","Carbamazepina."],"ans":[0],"fix":0},{"id":437,"page":166,"q":"Mujer de 21 años acude a urgencias con labor de parto. Niega antecedentes médicos de importancia. Gestas 2 Parto 1 Aborto 0. Embarazo actual de 39 semanas por fecha de última menstruación. Al examen físico presenta signos vitales normales. Abdomen: suave, depresible, no doloroso. Fondo uterino acorde a edad gestacional. Feto único. Cefálico. Frecuencia cardíaca fetal: 156 latidos por minuto. Tacto vaginal: Dilatado 8 cm, borrado 90 %. Actividad uterina 1 en 10 minutos repetida en 1 hora. Se decide prescribir el medicamento de primera línea para regular la actividad uterina y conducir el parto. ¿Cuál es el efecto adverso más frecuente del fármaco indicado?","opts":["Hipertonía uterina.","Intoxicación hídrica.","Desprendimiento placentario.","Hemorragia postparto."],"ans":[0],"fix":0},{"id":438,"page":166,"q":"Paciente femenina de 23 años acude con cuadro de diarrea de 3 meses de evolución, semi líquidas, pastosas, en número de 3 a 4 diarias, posprandiales. No refiere alza térmica, ni náusea o vómito. Se acompaña de distensión abdominal y meteorismo. Además, refiere pérdida de peso de aproximadamente 4 Kg en últimos 6 meses. No refiere antecedentes de importancia personales ni familiares. Al examen físico, la paciente se encuentra hemodinámicamente estable, IMC: 18. Conjuntivas pálidas, mucosas orales semihúmedas. Cardiopulmonar: normal. Abdomen: levemente distendido, suave, depresible, no doloroso a la palpación, ruidos presentes. Se evidencian edema de miembros inferiores +/+++. Examen neurológico normal. Se realizan exámenes de laboratorio con evidencia de anemia, hipoalbuminemia y Sudan III positivo en heces. Tomando en cuenta la clínica de la paciente. ¿Cuál sería su sospecha diagnóstica?","opts":["Enfermedad celíaca.","Intolerancia a la lactosa.","Sobrecrecimiento bacteriano.","Giardiasis."],"ans":[0],"fix":0},{"id":439,"page":167,"q":"Usted atiende a un paciente de 17 años que acude por presentar tos persistente. Refiere que ha presentado accesos de tos y rinorrea desde su infancia, atribuidos a rinitis alérgica por un pariente médico. Sin embargo, los accesos se han vuelto más frecuentes e intensos en los últimos años y se acompañan de esputo verdoso. Como antecedentes clínicos refiere múltiples episodios de sinusitis, en promedio uno o dos al año, y tres hospitalizaciones por neumonía en los últimos dos años. Como hallazgo relevante refiere también deposiciones pastosas, frecuentes y de mal olor desde que era niño, que empeoran con el consumo de lácteos o grasas. Los hallazgos relevantes del examen físico incluyen talla y peso bajos, notable congestión nasofaríngea y disminución del murmullo vesicular bilateral a la auscultación. ¿Cuál de las siguientes pruebas sería la más apropiada para confirmar el diagnóstico en este paciente?","opts":["Concentración de cloruro en el sudor","Radiografía AP y lateral de tórax","PCR de hisopado nasofaríngeo","Broncoscopía con toma de muestras"],"ans":[0],"fix":0},{"id":440,"page":167,"q":"Paciente femenina de 5 años, con disuria, polaquiuria y dolor suprapúbico. Presenta también hematuria visible en ropa interior. ¿Cuál es el diagnóstico clínico?","opts":["Cistitis.","Pielonefritis.","Bacteriuria asintomática.","Cólico renal."],"ans":[0],"fix":0},{"id":441,"page":168,"q":"Paciente masculino de 45 años, se realiza endoscopia alta como parte de un chequeo ejecutivo. Refiere leve malestar a nivel de epigastrio, con sensación de llenura y distensión abdominal postprandial. Su hábito evacuatorio no ha cambiado, niega pérdida de peso. Dentro de sus antecedentes personales: apendicectomía a los 12 años. Antecedentes familiares: abuela materna tuvo cáncer de útero a los 56 años. Al examen físico, sus signos vitales están estables. Cardiopulmonar: normal. Abdomen: blando, depresible, levemente doloroso a la palpación en epigastrio, ruidos normales. Se aprecia timpanismo generalizado, no visceromegalias. Resto del examen físico es normal. En la endoscopia, se encuentra una gastropatía eritematosa de antro, resto del examen es normal. Se recibe el resultado de la biopsia que indica: gastritis crónica con atrofia leve y metaplasia intestinal incompleta, Helicobacter pylori positivo. ¿Cuál sería su recomendación?","opts":["Tratar el Helicobacter y repetir la endoscopia en 1 año.","Tratar Helicobacter y repetir la endoscopia en 8 semanas.","Tratar el Helicobacter y no repetir endoscopia.","No tratar el Helicobacter y no repetir endoscopia."],"ans":[0],"fix":0},{"id":442,"page":168,"q":"Identifique un factor psicológico de suicidio.","opts":["Neuroticismo.","Ansiedad.","Trastorno de personalidad.","Trastorno afectivo."],"ans":[0],"fix":0},{"id":443,"page":169,"q":"Una mujer de 30 años, embarazada de 6 semanas 5 días por fecha de la última menstruación, acude a la emergencia del hospital con dolor pélvico tipo cólico de gran intensidad y sangrado vaginal abundante con coágulos. Sin antecedentes personales de importancia. Antecedentes obstétricos: Gestas 2 Aborto 1. Al examen físico: TA 90 /60 mmHg. FC 100 latidos / min, hemodinámicamente estable. Abdomen suave, depresible, no doloroso a la palpación. En la región genital; al examen especular: sangrado vaginal abundante con coágulos a través de orificio cervical externo. Al tacto vaginal: útero en anteversoflexión 1.3 x, consistencia blanda, cérvix central, blando, orificio cervical dilatado 1 cm, anexos no palpables. ¿Cuál de los siguientes es el diagnóstico más probable?","opts":["Aborto inminente.","Amenaza de aborto.","Aborto completo.","Aborto incompleto."],"ans":[0],"fix":0},{"id":444,"page":169,"q":"Paciente femenina de 53 años acude por presentar dolor abdominal en epigastrio de 24 horas de evolución, que se acompaña de náusea y vómito por varias ocasiones, el último con sangre fresca en poca cantidad. Como antecedentes refiere tener artritis reumatoidea, para lo que toma AINEs a libre demanda cuando se exacerba el dolor. No refiere cirugías previas. Niega consumo de tabaco, alcohol, drogas, viajes recientes o transfusiones. Al examen físico TA: 115/75 mmHg, frecuencia cardíaca: 93 x min, frecuencia respiratoria: 12 x minuto, T: 36.6ºC, sat O2: 94%. Conjuntivas pálidas, mucosas orales semi húmedas. Cardiopulmonar: normal. Abdomen: blando, depresible, doloroso a la palpación en epigastrio, ruidos presentes. Resto del examen físico es normal. Se realizan exámenes de laboratorio: leucocitos 5600 c x mm3, hematocrito 27%, hemoglobina 9.3 mg/dL, plaquetas 280.000 x 109/L, creatinina 0.9 mg /dL. ¿Cuál sería su conducta?","opts":["Estabilizar a la paciente y luego hacer endoscopia.","Realiza endoscopia inmediata.","Indicar tratamiento con omeprazol vía oral y manejo domiciliario.","Transfundir 2 paquetes globulares antes de endoscopia."],"ans":[0],"fix":0},{"id":445,"page":170,"q":"Ante la sospecha clínico-epidemiológica de leishmaniasis cutánea en el Ecuador, seleccione la asociación adecuada entre prueba diagnóstica- resultado, que le indica con mayor certeza que se trata de esta enfermedad en fase activa:","opts":["Biopsia cutánea – presencia de amastigotes.","PCR – detección de DNA del parásito.","Intradermorreacción de Montenegro – induración de 5 mm.","ELISA – detección de antígeno rk39."],"ans":[0],"fix":0},{"id":446,"page":170,"q":"Hombre de 35 años acude a consulta por presentar desde hace 2 días ojos rojos e irritados, sin otros síntomas acompañantes. Antecedentes: conjuntivitis bacteriana aguda en 4 ocasiones. A la exploración física presenta: TA: 110/80 mmHg; FC: 80 lpm; FR: 17 rpm; T: 36 °C. Exploración ocular: hiperemia discreta de ambos bordes palpebrales, con escasa secreción mucosa entre las pestañas y poca descamación de la raíz de éstas, con apariencia de caspa. Resto de la exploración normal. ¿Cuál es la complicación más probable que presenta el paciente?","opts":["Blefaroconjuntivitis.","Conjuntivitis atópica.","Conjuntivitis irritativa.","Pingüeculitis."],"ans":[0],"fix":0},{"id":447,"page":170,"q":"Señale el examen de primera elección para el diagnóstico de Bacteriuria asintomática en mujeres embarazadas:","opts":["Urocultivo.","General de orina.","Tirillas reactivas.","Sedimento de orina."],"ans":[0],"fix":0},{"id":448,"page":171,"q":"Mujer de 55 años, con antecedentes de litiasis biliar. Acude a emergencias por dolor periumbilical constante e irradiado a la espalda, náuseas y vómitos que no alivian el dolor. La analítica muestra leucocitosis y elevación de amilasa y lipasa. La tomografía computarizada abdominal muestra inflamación de la grasa peripancreática. ¿Cuál es la conducta terapéutica inicial en este paciente?","opts":["Administración intensiva de líquidos intravenosos.","Administración intravenosa de analgésicos anti inflamatorios.","Realizar colecistectomía de intervalo.","Administración intravenosa de antibióticos profilácticos."],"ans":[0],"fix":0},{"id":449,"page":171,"q":"Paciente masculino de 36 años, sin antecedentes de interés. Refiere dolor periumbilical difuso de 4 horas, anorexia y fiebre sin otros síntomas acompañantes. A la exploración se objetiva rebote en fosa ilíaca derecha. La analítica muestra leucocitosis y neutrofilia. ¿Qué estudio de imagen es más específico para el diagnóstico?","opts":["Tomografía abdominal helicoidal con presencia de mesoapéndice engrosado.","Ecografía abdominal con apéndice comprimible menor de 5 mm de diámetro.","Ecografía abdominal que visualiza fecalitos y es patognomónico del cuadro.","Tomografía abdominal con contraste por vía rectal para mejorar los resultados."],"ans":[0],"fix":0},{"id":450,"page":1 e":173,"q":"Una paciente mujer de 28 años acude a consulta para hacerse un chequeo general. Durante el interrogatorio, la paciente indica que tiene una hermana de 26 años a la que diagnosticaron hace pocos meses de cáncer de endometrio y al realizarse los chequeos preoperatorios, se evidenció la presencia de una masa en colon, para lo que se realiza una colonoscopia y se confirma un adenocarcinoma de colon. Además, refiere que tiene 2 tías maternas con cáncer de mama y su abuela materna fallece con cáncer de colon. Está asustada por lo que le sucedió a su hermana y quiere consejo médico. ¿Cuál sería su consejo?","opts":["Estudio genético MLH1/MSH2","Solicitar Antígeno Carcino Embrionario","Estudio de gen APC","Solicitar Ca-125"],"ans":[0],"fix":0},{"id":456,"page":173,"q":"Un niño de 8 años presenta crisis convulsivas. ¿Cuál de los siguientes es un criterio para diagnosticar estatus epiléptico?","opts":["Duración mayor a 30 minutos.","Crisis tónico-clónico generalizadas.","Ausencia de fiebre durante la crisis.","Examen neurológico postictal anormal."],"ans":[0],"fix":0},{"id":457,"page":174,"q":"La ecografía con infusión de solución salina como método diagnóstico. ¿En qué caso esta contraindicado su uso?","opts":["Infección pélvica.","Pólipos endometriales.","Leiomiomas submucosos.","Diabetes."],"ans":[0],"fix":0},{"id":458,"page":174,"q":"Una mujer de 38 años acude a consulta médica por cuadro de 6 horas de evolución de dolor de moderada intensidad (EVA 6/10) localizado en pierna derecha. Además, ha notado hinchazón y enrojecimiento en la misma pierna. Refiere haber realizado viaje de 10 horas de duración en autobús. Sus antecedentes personales incluyen aborto espontáneo por dos ocasiones, la etiología de los mismos fue síndrome antifosfolipídico; actualmente sin tratamiento. Toma anticonceptivos orales como método de planificación familiar. Al examen físico FC: 85/min, FR: 21/min, TA: 100 /65 mmHg, temperatura: 37.3 °C. La pierna derecha se encuentra con edema, la piel está enrojecida, caliente; hay incremento de dolor en la pantorrilla al realizar dorsiflexión del pie. Pulso pedio presente. El hemograma muestra leucocitos de 10500 /mm3 con 66 % de segmentados neutrófilos. La química sanguínea muestra glucosa de 120 mg/dl, creatinina 1.2 mg/dl, dímero D 700 µg/L. De acuerdo a su sospecha diagnóstica, la conducta terapéutica más adecuada sería:","opts":["Heparina de bajo peso molecular, subcutánea.","Terapia trombolítica con estreptoquinasa.","Warfarina por vía oral.","Clopidogrel por vía oral."],"ans":[0],"fix":0},{"id":459,"page":174,"q":"Con respecto a la urticaria en pacientes pediátricos es correcto que:","opts":["El habón característico es una roncha elevada, pruriginosa y eritematosa que palidece a la presión.","La urticaria puede ser causada por varios factores, siendo lo más común los estímulos físicos.","En la urticaria crónica las lesiones duran más de dos días a la semana durante 3 semanas.","En la urticaria aguda las lesiones suelen durar más de 24 horas, con tendencia a confluir."],"ans":[0],"fix":0},{"id":460,"page":175,"q":"Paciente de 38 años, multípara y miomectomizada hace 2 años. Está embarazada de 29 semanas, ha realizados todos los controles prenatales, es llevada a emergencias por metrorragia aislada de sangre roja brillante en moderada cantidad de origen materno. No dolor ni fiebre. En la ecografía se visualiza la placenta adyacente al margen del orificio cervical interno pero sin sobrepasarlo. El cuadro clínico corresponde a:","opts":["Placenta previa no oclusiva marginal.","Placenta previa no oclusiva de inserción baja.","Placenta previa oclusiva.","Hemorragia reagudizada post miomectomía."],"ans":[0],"fix":0},{"id":461,"page":175,"q":"Un recién nacido de 32 semanas de edad gestacional, sin antecedentes prenatales de importancia, nace por parto céfalo vaginal luego de amniorrexis instrumental. Presenta desde el nacimiento quejido, aleteo nasal, retracciones y cianosis. En el examen físico se encuentra una frecuencia respiratoria de 80 rpm (respiraciones por minuto), crepitantes bilaterales y mala entrada de aire. La Radiografía de tórax revela un volumen pulmonar disminuido, infiltrado retículo granular bilateral. ¿Cuál de los siguientes factores hubiese mejorado el pronóstico?","opts":["Aplicar corticoides prenatales.","Paciente de sexo masculino.","Realizar cesárea electiva.","Prescribir prostaglandina E2."],"ans":[0],"fix":0},{"id":462,"page":176,"q":"Gabriela de 20 años, embarazada de 32 semanas acude por presentar contracciones uterinas 3 en 10 minutos desde hace 3 horas. Se aprecia dilatación de 2 cm y borramiento del 30 %, con membranas íntegras. A las 30 semanas presentó actividad uterina por lo que recibió tratamiento tocolítico con nifedipina y 2 dosis de Betametasona 12 mg IM. Utilizando la siguiente lista de tratamientos, escoja el esquema terapéutico más adecuado en este caso: 1. Nifedipina 10 mg PO cada 20 minutos por 3 dosis y luego cada 6 horas. 2. Indometacina 100 mg vía rectal cada 8 horas. 3. Betametasona 12 mg intramuscular cada 12 horas (2 dosis) 4. Ampicilina 2 g IV cada 6 horas.","opts":["1","1, 3","2, 3","1, 3, 4"],"ans":[0],"fix":1},{"id":463,"page":176,"q":"¿Cuál de las siguientes localizaciones de la enfermedad tuberculosa está indicado el tratamiento coadyuvante con glucocorticoides para mejorar la supervivencia de los individuos mayores de 14 años?","opts":["Meningitis tuberculosa.","Tuberculosis pulmonar.","Tuberculosis genitourinaria.","Tuberculosis ósea."],"ans":[0],"fix":0},{"id":464,"page":176,"q":"Los siguientes son criterios que se aplican en la detección de riesgo cardiovascular. EXCEPTO:","opts":["Tratamiento con Interferón.","Edad.","Elevación del Colesterol HDL.","Presencia de Diabetes."],"ans":[0],"fix":0},{"id":465,"page":177,"q":"En los pacientes con diabetes mellitus tipo 2 (DM2), se recomienda la siguiente distribución de los tipos de grasa dietaria considerando el total de calorías diarias:","opts":["Ácidos grasos saturados menor del 7 %.","Ácidos grasos trans mayor del 10 %.","Ácidos grasos mono insaturados menor de 1 %.","Ácidos grasos poli insaturados mayor de 10 %."],"ans":[0],"fix":0},{"id":466,"page":177,"q":"Paciente de 28 años, con embarazo de 36 semanas, acude a la emergencia hospitalaria por cefalea intensa de 3 horas de evolución. El familiar refiere que la paciente hace 1 hora presentó convulsiones generalizadas por 1 ocasión. A la exploración física: TA: 170/110 mmHg, frecuencia respiratoria 16 por minuto, T: 36.7 °C, frecuencia cardiaca 88 por minuto. Glasgow 14/15, frecuencia cardiaca fetal de 128 latidos por minuto. Exámenes complementarios: determinación de proteínas en orina con tira reactiva y su resultado es positivo +++. Plaquetas 200 000/uL, TGO: 30 UI/L, TGP: 33 UI/L, creatinina sérica 0.8 mg/dL, LDH: 340 UI/L. ¿Cuál es el diagnóstico más probable?","opts":["Eclampsia.","Preeclampsia sin signos de gravedad.","Preeclampsia con signos de gravedad.","Hipertensión gestacional."],"ans":[0],"fix":0},{"id":467,"page":178,"q":"Paciente mujer de 68 años acude por dolor abdominal, más nausea, niega coluria y acolia, a la exploración física: dolor en hipocondrio derecho Murphy positivo, se realiza ecografía abdominal que reporta vesícula con paredes de 6 mm, con lito, vía biliar 5 mm, cabeza del páncreas de 2.2cm, leucocitosis 12.3 × 103/L con desviación a la izquierda y conservación del resto de las series. La bioquímica puso de manifiesto una; Bilirrubinas totales de 0.8 mg/dl, AST 24 U/L; ALT 26 U/L, amilasa 60U/L, y lipasa 80 U/L. ¿Cuál es el diagnóstico?","opts":["Colecistitis aguda.","Colelitiasis.","Colédocolitiasis.","Pancreatitis."],"ans":[0],"fix":0},{"id":468,"page":178,"q":"Un hombre de 25 años, acude a su consulta por presentar desde hace 1 semana dolor pélvico ocasional de tipo cólico de leve intensidad, que se acompaña de ardor al orinar y escalofríos, el dolor se irradia hacia testículo izquierdo y región inguinal del mismo lado, empeora durante la deposición. Como antecedente el paciente tiene múltiples parejas sexuales. Al examen físico se encuentra una temperatura de 38 °C, TA: 120 /75 mmHg, FC: 98/min, FR: 18/min. Consciente, orientado, inquieto por el dolor, tórax y abdomen normales, presencia de ganglio palpable doloroso en región inguinal, testículo izquierdo doloroso a la palpación. En los exámenes de laboratorio hay leucocitosis marcada, el resto de exámenes son normales. Se realiza una biopsia con aguja fina que muestra un prominente infiltrado leucocitario con numerosos neutrófilos, en el cultivo de secreciones hay presencia de cocos gram-negativos. ¿Cuál de los siguientes organismos es la causa más probable de esta infección?","opts":["Neisseria gonorrhoeae.","Escherichia coli.","Pseudomona sp.","Treponema palidum."],"ans":[0],"fix":0},{"id":469,"page":179,"q":"Un hombre de 75 años llega al servicio de emergencia por un dolor abdominal intenso en hemi abdomen inferior de 20 horas de evolución; hace 4 horas dolor incrementa en intensidad y se acompaña de deposiciones vinosas. No ha presentado vómito. Sus antecedentes personales incluyen fibrilación auricular hace 5 años, toma warfarina sódica 50 mg/día; refiere que en ocasiones olvida tomar la medicación. Hipertensión arterial hace 10 años toma enalapril 20 mg al día. Al examen físico FC: 98/min, FR: 23/min, TA: 130/85mmHg, temperatura: 36.2 °C. Paciente agitado, muy álgico. El abdomen es muy doloroso a la palpación de forma generalizada, sin resistencia muscular, ni signos de irritación peritoneal. El hemograma muestra 13.000 / mm3 con 80 % de segmentados neutrófilos. La química sanguínea muestra glucosa 89 mg/dl, creatinina 1.5 mg/dl, INR 1.1 ¿Cuál es el diagnóstico más probable?","opts":["Isquemia mesentérica aguda.","Diverticulitis.","Vólvulo de sigma.","Colitis infecciosa."],"ans":[0],"fix":0},{"id":470,"page":179,"q":"Hombre de 63 años, economista, residente en Quito, diestro de lateralidad. Hipertenso recibe irbesartan 300 mg al día. Hace 3 días presenta por primera vez malestar general, alza térmica no cuantificada, dolor abdominal y náusea. Hace 24 horas refiere cefalea fronto temporal izquierda, alcanza EVA 8/10, las hijas notan que el paciente por momentos tiene dificultad para comprender preguntas. En el trayecto al hospital presenta por primera vez una crisis focal motora derecha de dos minutos de duración. En emergencia la TA es de 145/95 mmHg, temperatura bucal de 38.8 °C, Fc 96 LPM, saturación de O2 (aire ambiente) 94%. El paciente está alerta, con un lenguaje fluente, comprende comandos simples y no comprende secuencia de órdenes verbales, hay dificultad para nombrar objetos y repetir frases. El fondo de ojo presenta edema papilar y el resto de pares craneales son normales. No hay déficit motor ni signos meníngeos. La biometría hemática muestra leucocitos 12.430mm3; 52% linfocitos. Proteína C reactiva de 7.3 mg/L. ¿Cuál es el diagnóstico más probable en este paciente?","opts":["Encefalitis herpética","Absceso cerebral","Meningitis bacteriana aguda","Meningitis tuberculosa"],"ans":[0],"fix":0},{"id":471,"page":180,"q":"¿Cuál es el esquema correcto y el posible efecto adverso del sulfato de magnesio en el manejo de la eclampsia?","opts":["Sulfato de magnesio: impregnación 6 gr en 20 minutos + mantenimiento 2 gr por hora y depresión del sistema nervioso central.","Sulfato de magnesio: impregnación 6 gr en 20 minutos + mantenimiento 1 gr por hora y síndrome de Stevens Johnson.","Sulfato de magnesio: impregnación 8 gr en 20 minutos + mantenimiento 3 gr por hora y aplasia eritrocítica.","Sulfato de magnesio: impregnación 2 gr en 20 minutos + mantenimiento 3 gr por hora y bradicardia sinusal."],"ans":[0],"fix":0},{"id":472,"page":180,"q":"Mujer de 73 años, acude al centro de salud por disminución de la agudeza visual y dolor ocular izquierdo lancinante muy intenso, visión de halos de colores alrededor de las luces y ojo rojo izquierdo desde hace 12 horas. Además, presenta cefalea frontal intensa y vó ola, es producida por un Robivirus de la familia Togaviridae y solamente requiere tratamiento sintomático del paciente."],"ans":[0],"fix":0},{"id":513,"page":195,"q":"Lactante de 9 meses llevado a urgencias por presentar movimientos clónicos en brazo y pierna derecha de 40 minutos de duración. Se encuentra inconsciente y tiene temperatura de 38.2 °C. A continuación se presentan algunas opciones de tratamiento para este caso. ¿Cuál es el medicamento de primera elección?","opts":["Diazepam IV.","Fenobarbital IV.","Levetiracetam IV.","Difenilhidantoína IV."],"ans":[0],"fix":0},{"id":514,"page":195,"q":"Recién nacido a término por parto céfalo-vaginal, sin complicaciones neonatales inmediatas. Peso= 2 200 g, Talla= 49 cm, PC= 35cm. El examen físico es normal. Si tiene un entorno favorable. ¿Cuál es el diagnóstico neonatal y su pronóstico?","opts":["Tiene retardo de crecimiento intrauterino asimétrico, por tanto, podría tener un crecimiento compensador y alcanzar una talla y un peso normales.","Tiene retardo de crecimiento intrauterino simétrico, por tanto, podría tener un crecimiento compensador y alcanzar una talla y un peso normales.","Tiene retardo de crecimiento intrauterino simétrico, por tanto, su crecimiento en talla y peso estarán siempre por debajo de lo normal.","Tiene retardo de crecimiento intrauterino asimétrico, por tanto, su crecimiento en talla y peso estarán siempre por debajo de lo normal."],"ans":[0],"fix":0},{"id":515,"page":196,"q":"Un varón de 23 años acude a consulta aquejando fiebre y dolor articular junto con hinchazón, desde hace una semana. El dolor y edema articular comenzó en sus rodillas. En los últimos tres días la molestia cesó en las rodillas y se instaló en su codo derecho y muñeca izquierda. Esto le ha impedido realizar sus actividades cotidianas. Un médico le prescribió diclofenaco, lo cual le alivió temporalmente el dolor articular. Adicionalmente, ha tenido fiebre y sudoración. Niega dolor faríngeo o fiebre en las semanas anteriores. Únicamente recuerda haber cursado con un episodio similar, 8 años antes. En aquel tiempo no fue evaluado por ningún médico. El cuadro clínico remitió espontáneamente. Actualmente no se acompaña de disnea o dolor torácico. Al examen se ve en regulares condiciones. Temperatura: 38,5 °C, TA: 120/70 mmHg, FC: 90 x min, FR: 20 x min. ¿Cuál es el examen complementario que apoyaría su sospecha diagnóstica de un síndrome inflamatorio post infeccioso?","opts":["ASTO","Velocidad de sedimentación","Estudio de líquido articular","Hemocultivo (set)"],"ans":[0],"fix":0},{"id":516,"page":196,"q":"En relación con la nefrotoxicidad producida por fármacos. ¿Cuál es el enunciado correcto?","opts":["Los aminoglucósidos son antibióticos con alto potencial nefrotóxico, el cual ocurre sobre todo en adultos mayores y esto se asocia a necrosis tubular aguda.","La nefrotoxicidad por AINE’s es frecuente y se debe en la mayoría de casos a hipersensibilidad; pero en un escaso grupo es funcional, debido a alteraciones hemodinámicas intrarrenales.","Los betalactámicos, a pesar de su amplio uso, son fármacos con gran potencial nefrotóxico, siendo la cefuroxima la más peligrosa porque puede producir necrosis tubular aguda.","La nefrotoxicidad por fármacos antirretrovirales es muy frecuente, siendo el tenofovir el medicamento de este grupo con el que más casos se han reportado de insuficiencia renal aguda moderada."],"ans":[0],"fix":0},{"id":517,"page":197,"q":"Una mujer de 44 años padece cefaleas episódicas de media hora de duración, asociadas a sudoración profusa, palpitaciones y sentimientos de aprehensión, en los últimos tres meses. Ha perdido peso (unas 15 libras) a pesar de que su apetito se mantiene normal. Manifiesta que no tiene razones para estresarse. Lleva una vida tranquila. Por lo general maneja bien sus preocupaciones. Niega insomnio. Solamente toma ibuprofeno para el dolor, aunque normalmente ceden espontáneamente. Mantiene sus menstruaciones. No refiere sensaciones de calor o enrojecimiento facial. Durante un episodio se realiza el examen físico, el cual muestra: TA: 150/100 mmHg (acostada), 130/80 mmHg (en pie), FC (acostada): 112 lpm y sentada: 136 lpm. Auscultación cardíaca: latido rítmico, sin soplos; abdomen: no visceromegalias ni soplos. Examen neurológico: normal. ¿Cuál sería el diagnóstico más probable en el caso descrito?","opts":["Feocromocitoma","Hiperaldosteronismo","Tumor de fosa posterior","Estenosis de la arteria renal"],"ans":[0],"fix":0},{"id":518,"page":197,"q":"Un hombre de 51 años, sin antecedentes patológicos personales, sin historial de tabaquismo, bebedor social, sin ingestión de medicamentos, es derivado a hematología debido al hallazgo incidental de un hematocrito elevado. Se había realizado un examen a causa de una herida que accidentalmente se produjo mientras realizaba un trabajo de reparación en casa. Los resultados mostraban: Hto. 59 %, Hb: 20 g/dl, Leucocitos: 15.400 x mm3 con una fórmula diferencial normal, plaquetas: 445.000 x mm3. Al examen físico su TA: 145/85 mm Hg, FC: 85 x min, FR: 18 x min, SatO2: 95 % al aire ambiente. Se identifica una esplenomegalia grado II. La última vez que fue evaluado por un médico fue hace unos 3 años; por aquel entonces no recuerda que sus resultados de laboratorio fueran anormales. ¿Cuál sería el siguiente mejor paso en el trabajo diagnóstico de este paciente?","opts":["Medición de la masa eritrocitaria.","Gasometría arterial.","Medición de eritropoyetina.","Pruebas de función pulmonar."],"ans":[0],"fix":0},{"id":519,"page":198,"q":"Mujer de 20 años acude a consulta externa por lesión cutánea, posterior a estancia en clima tropical. El área de estancia es predominante para triatominos como triatoma dimidiata. No refiere antecedentes médicos de importancia. Al examen físico: tensión arterial 120/80 mmHg, frecuencia cardíaca 80 latidos por minuto, frecuencia respiratoria 14 por minuto. Temperatura 38.2 °C. Ojo derecho: Signo de Romaña (edema unilateral bipalpebral e indoloro del ojo). Abdomen: RHA presentes, blando, depresible, no doloroso a la palpación. Hepatoesplenomegalia. Resto de la exploración normal. ¿Cuál es el diagnóstico que presenta la paciente?","opts":["Enfermedad de Chagas.","Leishmaniosis.","Dengue.","Fiebre amarilla."],"ans":[0],"fix":0},{"id":520,"page":198,"q":"¿Cuál constituye una prueba de bienestar fetal?","opts":["Perfil biofísico del tercer trimestre.","Maniobras de Leopold en el tercer trimestre.","Biopsia de vellosidades coriales del primer trimestre.","Amniocentesis del primer trimestre."],"ans":[0],"fix":0},{"id":521,"page":198,"q":"Una niña de 5 años, ha sido diagnosticada de desnutrición aguda severa. De acuerdo con la AEIPI, ¿Cómo esperaría encontrar su peso?","opts":["Por debajo de -3 desviaciones estándar.","Por debajo de -1 desviaciones estándar.","Por debajo de -2 desviaciones estándar.","Por debajo de -4 desviaciones estándar."],"ans":[0],"fix":0},{"id":522,"page":199,"q":"Identifique una causa de sangrado digestivo alto por hipertensión portal.","opts":["Varices gastroesofágicos.","Mallory Weiss.","Malformaciones arteriovenosas.","Úlcera péptica."],"ans":[0],"fix":0},{"id":523,"page":199,"q":"Mujer de 15 años, que acude en compañía de un familiar, quien refiere que la paciente presenta de forma brusca caída de la cabeza sobre el pecho y en ocasiones caída al suelo de forma súbita. ¿Cuál es el tipo de convulsión que presenta la paciente?","opts":["Atónica.","De ausencia.","Crisis focal motora.","Mioclónica."],"ans":[0],"fix":0},{"id":524,"page":199,"q":"¿Qué medicamento se utiliza en la cistitis como alternativa a la nitrofurantoína después de las 37 semanas de gestación?","opts":["Cefalexina.","Ampicilina.","Sulfametoxazol /trimetoprima.","Amoxicilina/ácido clavulánico."],"ans":[0],"fix":0},{"id":525,"page":200,"q":"Paciente de 55 años acude a la consulta por presentar disuria, dolor lumbar y fiebre de aproximadamente de 8 días de evolución. Signos vitales: TA: 130/90 mmHg, FC: 90 LPM, FR: 18 RPM, T: 39 °C. En la ecografía se encontraron los siguientes hallazgos: aumento de tamaño de la próstata, asimetría de los lóbulos prostáticos, incremento del diámetro de los plexos venosos periprostáticos, nódulos hiperecogénicos en la próstata externa, evidencia de litiasis intraprostática, presencia de halos hipoecoicos periuretrales o calcificaciones entre la zona transicional y la cápsula. Basados en la clínica y la ecografía. ¿Cuál es el probable diagnóstico?","opts":["Prostatitis aguda.","Hiperplasia prostática benigna.","Cáncer de próstata.","Absceso prostático."],"ans":[0],"fix":0},{"id":526,"page":200,"q":"Se presenta el caso de un paciente de 38 años que acude por insomnio de conciliación, tristeza generalizada, anhedonia y abulia de tres meses de evolución. Durante la anamnesis se identifican también importantes preocupaciones sobre el futuro, ligera agitación psicomotriz, impulsividad e irritabilidad. El paciente no tiene antecedentes patológicos de importancia, pero refiere cuatro episodios similares en el pasado, ninguno de los cuales recibió atención médica. ¿Cuál sería el tipo de depresión mayor más probable en este caso?","opts":["Ansiosa.","Melancólica.","Catatonía.","Estacional."],"ans":[0],"fix":0},{"id":527,"page":201,"q":"Gestante de 28 años primigesta, acude al control prenatal a las 10 semanas de gestación. Refiere ausencia de síntomas de embarazo desde hace una semana. Niega dolor pélvico o sangrado genital. Al examen físico presenta: TA de 120/70 mmHg; FC 85/minuto; T 36 °C, el abdomen es suave depresible, no doloroso a la palpación, la altura del fondo uterino no es palpable. Al examen especular no se evidencia sangrado genital. Al tacto vaginal el eje uterino está en anteverso flexión, consistencia reblandecida, un tamaño aproximado de 1.2x, no doloroso a la movilización; el cérvix es posterior de consistencia dura, con el orificio cervical externo cerrado; los anexos no son palpables. ¿Cuál es el diagnóstico inicial más probable?","opts":["Aborto diferido","Amenaza de aborto","Aborto habitual","Aborto completo"],"ans":[0],"fix":0},{"id":528,"page":201,"q":"Un niño de 6 meses es llevado para valoración por pediatría a causa de deformidades en sus costillas. Ha sido alimentado con leche materna de forma exclusiva. Sus antecedentes personales incluyen dos cuadros de neumonía, que se resolvieron con antibióticos orales. Además le comentan que tiene peso y talla baja. Al examen físico: FC: 110/min, FR: 35/min, temperatura: 36,5 °C. Al palpar los huesos del cráneo se siente un ablandamiento en el occipucio y sobre los huesos parietales, ensanchamiento de las uniones costocondrales, que se siente como las cuentas de un rosario a la palpación. Deformaciones en valgo de las piernas. ¿El incremento de qué sustancia en la dieta del paciente, mejoraría sus síntomas?","opts":["Colecalciferol","Hierro","Niacina","Ácido ascórbico"],"ans":[0],"fix":0},{"id":529,"page":202,"q":"Mujer de 35 años acude a consulta externa por infertilidad. Gestas 0. Partos 0. Abortos 0. Amenorrea de 8 semanas. Vida sexual activa con pareja estable. Refiere episodios de galactorrea esporádicos. Niega ingesta de medicación actual. Examen físico: signos vitales normales. Mamas bilateral: salida espontánea de leche. Laboratorio: Prolactina 150 µg/L. Resonancia nuclear magnética de silla turca: Lesión 2 mm compatible con microadenoma. ¿Cuál es el tratamiento inicial de elección para esta paciente?","opts":["Agonistas dopaminérgicos.","Fenotiazínicos.","Butirofenonas.","Cirugía."],"ans":[0],"fix":0},{"id":530,"page":202,"q":"Seleccione las principales complicaciones del aborto terapéutico, que a pesar de ser poco frecuentes deben informarse a las mujeres: 1. Ruptura uterina. 2. Esterilidad. 3. Hemorragia severa. 4. Choque séptico. 5. Perforación uterina.","opts":["1, 3, 5","2, 4, 5","1, 2, 4","2, 3, 4"],"ans":[0],"fix":1},{"id":531,"page":203,"q":"Paciente de 58 años, hospitalizado desde hace 5 días por quemaduras extensas. Presenta desde hace 2 días dolor e hipersensibilidad en el cuadrante superior derecho, fiebre y leucocitosis. ¿Cuál es la prueba diagnóstica de elección para colecistitis alitiásica?","opts":["Tomografía computarizada abdominal.","Resonancia magnética abdominal.","Colangiopancreatografía por resonancia.","Gammagrafía hepatobiliar (HIDA)."],"ans":[0],"fix":0},{"id":532,"page":203,"q":"Una mujer de 28 años, casada, 2 hijos; presenta infección de vías urinarias (IVU), dado que las IVU son producidas frecuentemente por Escherchia coli, el médico que la atiende decide administrar cefuroxima 500 mg cada 12 horas durante 10 días. ¿Qué tipo de cefalosporina usa el médico?","opts":["De segunda generación, útil principalmente para gérmenes gramnegativos y algunos grampositivos.","De primera generación, útil especialmente para gérmenes grampositivos y algunos gramnegativos.","De tercera generación, útil especialmente para gérmenes gramnegativos y muy poco para grampositivos.","De cuarta generación, útil principalmente para gérmenes gramnegativos y algunos grampositivos."],"ans":[0],"fix":0},{"id":533,"page":203,"q":"¿Qué solución de hidratación parenteral evita la apoptosis en el tejido pulmonar y hepática después de la reanimación cardiopulmonar?","opts":["Lactato ringer.","Solución salina al 0.9 %","Solución salina al 0.45 %","Glucosa al 5 % en solución salina."],"ans":[0],"fix":0},{"id":534,"page":204,"q":"¿Cuál es la lesión torácica potencialmente fatal durante la revisión secundaria?","opts":["Lesión cardíaca cerrada.","Neumotórax a tensión.","Neumotórax abierto.","Taponamiento cardíaco."],"ans":[0],"fix":0},{"id":535,"page":204,"q":"Niño de 4 años es llevado a consulta por presentar fiebre de 38 °C desde hace 2 días acompañada de rinorrea y tos. Al examen físico tenemos paciente febril con astenia pero que responde a estímulos; en la boca se observan unas manchas pequeñas de color rojo con una base de coloración azul grisáceo; también rash maculopapular que a la digitopresión desaparece en la cara; el resto del examen es normal. Madre refiere que tiene en casa una hija de 10 meses de edad y que luego de una reacción adversa a la vacuna de la influenza, ella y su esposo decidieron no administrar vacunas a sus hijos. ¿Cuál vacuna debe ser administrada a la hermana de 10 meses inmediatamente?","opts":["Vacuna de sarampión.","Vacuna de la varicela.","Vacuna de influenza.","Vacuna para rubeola."],"ans":[0],"fix":0},{"id":536,"page":204,"q":"Adulto de 20 años acude por presentar anorexia, más náusea y vómito en una ocasión, en el examen físico presenta hipersensibilidad en el cuadrante inferior derecho, y en laboratorio una leucocitosis de 14.000. ¿Cuál es el valor según la escala de Alvarado?","opts":["6.","5.","7.","8."],"ans":[0],"fix":1},{"id":537,"page":205,"q":"Paciente femenina de 6 años que consulta por prurito anal y ardor al orinar. Al examen físico se evidencia eritema vulvar y perianal, así como secreción amarillenta. ¿Cuál es el diagnóstico más probable?","opts":["Vulvovaginitis por Enterobius vermicularis.","Abuso sexual.","Vulvovaginitis por Candida albicans.","Infección de vías urinarias."],"ans":[0],"fix":0},{"id":538,"page":205,"q":"Un neonato masculino es valorado en sala de partos a pocos minutos de su nacimiento por presentar taquipnea y cianosis. Es producto de un parto vaginal espontáneo a las 38 semanas de edad gestacional. No presenta antecedentes prenatales de importancia. Al examen físico FC: 145/min, FR: 62/min. Evidente cianosis. El ecocardiograma presenta que la aorta nace del ventrículo derecho y la arteria pulmonar del ventrículo izquierdo. ¿Qué espera encontrar en la auscultación cardíaca del paciente?","opts":["Soplo holosistólico áspero que es más fuerte en el borde esternal inferior izquierdo.","Soplo sistólico más fuerte debajo de la escápula izquierda.","Soplo continuo de maquinaria en el borde esternal superior izquierdo.","Chasquido mesosistólico."],"ans":[0],"fix":0},{"id":539,"page":205,"q":"Paciente de 15 años con depresión, acompañado de disminución del apetito, aumento del sueño, deseo de suicidarse, pensamiento pesimista, evita el contacto social. Además del tratamiento farmacológico. ¿Qué terapia es más recomendable?","opts":["Terapia cognitiva – conductual.","Fisioterapia.","Psicoterapia.","Psicoterapias psicodinámicas breves."],"ans":[0],"fix":0},{"id":540,"page":206,"q":"Paciente femenina que presenta en la primera consulta, fiebre de 38 °C, dolor abdominal bajo, se acompaña de disuria, polaquiuria y dispareunia. Al examen físico se encuentra: secreción vaginal amarillenta abundante. Al examen especular se evidencia cérvix eritematoso que sangra fácilmente a la manipulación, no se encontraron adenomegalias inguinales, vesículas o úlceras genitales. ¿Cuál es el tratamiento en este caso?","opts":["Ciprofloxacina 500 mg (DU) + Azitromicina 1g (DU).","Ceftriaxona 250 mg IM (DU) + Aciclovir 200 mg 5 /día (5 a 7 días).","P Benzatina 2 400 000 UI (IM) DU + Gentamicina 160 mg IM c/6 h (7días).","Azitromicina 1g (DU) + eritromicina 500 mg c/6h (15-21 días)."],"ans":[0],"fix":0},{"id":541,"page":206,"q":"Paciente femenina de 23 años, residente en zona subtropical, acude a consulta por presentar fiebre continua desde hace 7 días, con astenia, mialgias y artralgias, malestar general y dolor abdominal difuso de moderada intensidad. Además, refiere cefalea que es intensa, en región frontal. No refiere antecedentes de importancia. Al examen físico, TA: 120/75 mmHg, frecuencia cardíaca: 86 x min, frecuencia respiratoria: 14 x min, T:38.6ºC, sat O2: 93%. A nivel de piel, se evidencia la presencia de rash eritematoso generalizado. Conjuntivas eritematosas, escleras normales. Mucosas orales semi húmedas y orofaringe eritematosa. Cardiopulmonar: no se revelan datos patológicos. Abdomen: blando, levemente doloroso a la palpación de forma difusa, se evidencia hepatomegalia dolorosa a la percusión, sin esplenomegalia. Se realizan exámenes de laboratorio: leucocitos 12.000 /uL, neutrófilos 78%, plaquetas 120.000 x ml, hematocrito 45%, creatinina 1.3 mg/dL, sodio 142 mEq/L, potasio 3.1 mEq/L, AST 84 UI/L, ALT 93 UI/L. Se descarta dengue, chikungunya, paludismo y malaria. Usted tiene la sospecha clínica de leptospirosis. ¿Qué tratamiento iniciaría en base a su sospecha diagnóstica?","opts":["Doxiciclina.","Gentamicina.","Trimetoprim-sulfametoxazol.","Ciprofloxacina."],"ans":[0],"fix":0},{"id":542,"page":207,"q":"Paciente de 30 años, gestante de 36 semanas, con diagnóstico de sepsis por corioamnionitis, se le administra líquidos intravenosos adecuados de acuerdo a su peso, pero persiste presión arterial en valores de 80 /40 mmHg, en este caso. ¿Qué es lo más recomendado?","opts":["Administrar vasopresores.","Administrar nuevo bolo de cristaloides.","Administrar paquetes globulares.","Administrar coloides alternando con cristaloides."],"ans":[0],"fix":0},{"id":543,"page":207,"q":"¿Cuál es la hormona que se libera en la hipófisis posterior?","opts":["Oxitocina.","Foliculoestimulante.","Luteinizante.","Tirotrópica."],"ans":[0],"fix":0},{"id":544,"page":207,"q":"Un niño de 3 años es llevado por su madre a consulta de pediatría a causa de una masa en el cuello que la tiene desde el nacimiento. No refiere antecedentes prenatales ni natales de importancia. Al examen físico: FC:78/min, FR:24/min, temperatura: 36,3 °C. En el cuello presenta una tumoración localizada en la región anterior del tercio superior del músculo esternocleidomastoideo, no se modifica con la deglución. El tumor es asintomático, indoloro y blando. ¿Cuál de los siguientes es el diagnóstico más probable?","opts":["Quiste de hendidura branquial","Rotura del músculo esternocleidomastoideo","Inflamación de los ganglios linfáticos","Quiste tirogloso"],"ans":[0],"fix":0},{"id":545,"page":208,"q":"En una paciente en la que se sospecha malignidad en el endometrio, se debe sacar una muestra para su análisis. Todas las siguientes son indicaciones para este tipo de procedimiento. EXCEPTO:","opts":["Presencia uencia cardiaca de 110 latidos por minuto, la respiración es pobre e irregular, nota cierta flexión de extremidades, gesticula, el cuerpo está rosado y las extremidades azules. ¿Cuál es el índice de Apgar en la valoración inicial?","opts":["6.","5.","3.","4."],"ans":[0],"fix":1},{"id":555,"page":212,"q":"Un paciente de 22 años, presentó faringoamigdalitis estreptocócica hace 3 semanas. Desde hace 10 días tiene fiebre alta, decaimiento, malestar general, irritabilidad, movimientos involuntarios, alteraciones del carácter, odinofagia y disfagia. Refiere también dolor e hinchazón en diversas articulaciones. Actualmente presenta congestión amigdalina, con exudado purulento y petequias en paladar; adenopatías submaxilares y latero-cervicales marcadas y dolorosas a la palpación; fiebre alta y en ciertas partes, exantema escarlatiniforme. Presenta leucocitosis y niveles de PCR 4 veces por encima de lo normal. ¿Cuál de las siguientes alternativas permite establecer el diagnóstico de fiebre reumática?","opts":["Poliartritis, fiebre y leucocitosis.","Poliartritis, es suficiente para establecer el diagnóstico.","Leucocitosis, aumento de PCR y fiebre.","Leucocitosis, irritabilidad y movimientos involuntarios."],"ans":[0],"fix":0},{"id":556,"page":212,"q":"Paciente masculino de 15 años evaluado en urgencias por politraumatismo debido a un accidente de tránsito. Niega antecedentes médicos de importancia. Accidente se da como acompañante sin uso de cinturón de seguridad. Examen físico: Tensión arterial 90/60 mmHg, ortostatismo positivo, frecuencia cardíaca 140 latidos por minuto, se estima una pérdida de sangre del 40 %. frecuencia respiratoria 35 por minuto, SAT O 2 aire ambiente 82 %. Paciente en coma. Abdomen: suave, depresible, doloroso en marco colónico. Ruidos hidroaéreos disminuidos. Laboratorio: Hemoglobina 9 g /dL. Hematocrito 27 %. Leucocitos 5.5 k/µL. Plaquetas: 250 k/µL. Tiempo de protrombina 12. INR: 1. ¿Cuál es el siguiente paso de manejo para este paciente?","opts": r la noche por 14 días.","Miconazol crema al 4%, aplicar 5 g (un aplicador lleno) de la crema profundamente en la vagina y en la vulva por la noche por tres días."],"ans":[0],"fix":0},{"id":577,"page":221,"q":"Una joven de 17 años acude a la consulta acompaña de su madre por que le han notado los ojos amarillos desde hace 2 días en las mañanas antes de que salga al colegio. La paciente no refiere astenia, alza térmica, ni dolor abdominal. Como antecedentes personales, fue apendicectomizada a los 8 años. Al examen físico, signos vitales estables, IMC 21. Conjuntivas rosadas, leve ictericia escleral. Cardiopulmonar: normal. Abdomen: blando, depresible, no doloroso a la palpación, longitud del hígado es de 11 cm en línea medio clavicular derecha, calculado con percusión. No hay evidencia de signos de hepatopatía crónica, ni edemas. El examen neurológico es normal. ¿Qué esperaría encontrar en el perfil hepático?","opts":["Incremento de la bilirrubina indirecta","Transaminasas muy elevadas","Incremento de pruebas de colestasis: fosfatasa alcalina y gama glutamil transpeptidasa","Hipoalbuminemia y prolongación del TP"],"ans":[0],"fix":0},{"id":578,"page":221,"q":"Mujer de 24 años acude a consulta prenatal de rutina por un embarazo de 5 semanas. Al momento no refiere síntomas de relevancia. Sus antecedentes gineco-obstétricos incluyen: Gestas 4; Partos 0; Abortos 3. En el embarazo previo se documentó una pérdida de un producto a la semana 10 con un peso fetal menor a 350 gramos. Al examen físico se evidencia tensión arterial 120/80 mmHg, frecuencia cardíaca 74 latidos por minuto, frecuencia respiratoria 16 por minuto. Abdomen: suave, depresible, no doloroso. Fondo uterino: no identificable. Se solicita medición cuantitativa de Beta HCG con el siguiente resultado: 1500 mIU/ml. Eco de semana 5 revela embarazo anembrionado, sin otros hallazgos. ¿Cuál es el antecedente más probable que causaría aborto en esta paciente?","opts":["Anomalías cromosómicas parentales.","Síndrome de anticuerpos antifosfolípidos.","Sinequias uterinas.","Leiomiomas uterinos."],"ans":[0],"fix":0},{"id":579,"page":222,"q":"De los siguientes cuadros clínicos, seleccione el que corresponde con un caso de encefalopatía por déficit de tiamina:","opts":["Hombre de 29 años que tras ruptura amorosa hace un mes comienza a beber diariamente. Presenta diminución progresiva del estado de conciencia, nistagmo y ataxia.","Mujer de 62 años con gastritis crónica, que presenta disminución de la memoria, alteraciones del estado de ánimo, ataxia sensitiva y parestesias en las manos y pies.","Mujer de 35 años con enfermedad de Crohn que comienza a presentar ataxia, pérdida de sensibilidad vibratoria y posicional, hiporreflexia osteotendinosa y nistagmo.","Hombre de 45 años que tras completar tratamiento antituberculoso estándar de 6 meses, comienza con debilidad muscular, ataxia sensitiva y engrosamiento cutáneo."],"ans":[0],"fix":0},{"id":580,"page":222,"q":"Hombre de 58 años, acude a consulta por dolor intermitente en cuadrante superior derecho de abdomen, disnea de esfuerzo NYHA 3 y edema de miembros inferiores, de 3 meses de evolución. Antecedentes: Infarto miocárdico de cara anterior extenso. Examen físico: TA: 100/60 mmHg, FC: 84 lpm, FR: 20 rpm. Cuello: ingurgitación yugular. Tórax: murmullo vesicular conservado, estertores crepitantes en bases pulmonares. Abdomen: depresible, se palpa hepatomegalia dolorosa 2cm por debajo de reborde costal derecho, onda ascítica positiva. Extremidades: edemas pretibiales duros no dejan fóvea xx/xxx. En complementarios se evidencia: ALT 112 U/L, AST 78 U/L, FA 150 U/L, GGT 90 U/L. Ecografía doppler portal informa elevación del gradiente de presión venosa hepática en 9 mmHg. ¿Cuál de los siguientes es la causa más probable de hipertensión portal en el paciente?","opts":["Hígado cardíaco.","Trombosis de la vena porta.","Síndrome de Budd- Chiari.","Cirrosis hepática."],"ans":[0],"fix":0},{"id":581,"page":223,"q":"Hombre de 38 años, acude a consulta de control de patología crónica, indica ha incrementado de peso. Antecedentes de Hipertensión arterial en tratamiento con Enalapril 10 mg BID, Diabetes mellitus tipo 2 en tratamiento con Metformina 500 mg BID. Examen físico: TA: 130/80 mmHg, FC: 79 lpm, FR: 18 rpm, Peso: 86 Kg, Talla: 168 m, IMC: 30,49. Cardiopulmonar sin alteraciones. Abdomen: perímetro abdominal 97 cm, depresible no doloroso. En complementarios: Glicemia en ayunas 110 mg/dl, Colesterol 190 mg/dl, Triglicéridos 120 mg/dl, HDL 48 mg/dl, LDL 142 mg /dl. ¿Cuál de los siguientes es el tratamiento más adecuado a iniciar en el paciente?","opts":["Pérdida de peso.","Estatinas.","Fibratos.","Hipoglicemiantes orales."],"ans":[0],"fix":0},{"id":582,"page":223,"q":"Seleccione los índices de mal pronóstico en el pánico: 1. Persistencias de los síntomas faciales. 2. Depresión comórbida. 3. Severidad de los síntomas basales. 4. Síntomas al iniciar el tratamiento. 5. Inhibición conductual.","opts":["2, 3, 5","1, 2, 3","3, 4, 5","1, 3, 4"],"ans":[0],"fix":1},{"id":583,"page":224,"q":"Mujer de 39 años, enfermera en jornada laboral nocturna con gastritis crónica desde hace 2 años en tratamiento con ranitidina 3 veces por semana y dismenorrea ocasional desde hace 6 meses, sin otros antecedentes de interés. Estando en su trabajo colocando la medicación a un paciente presenta intensas palpitaciones, sensación de ahogo, mareo y sudoración que duran 20 minutos. No dolor torácico. Niega consumo de drogas. El sueño reparador es de 4 horas al día y dentro de 5 días le llegará la menstruación. Hace 1 año presentó episodio similar leve durante un sepelio. AGO: G2 P2 A0 HV2. En emergencias, presenta TA: 114/81, FC: 122 lpm, SatO2: 96 %. T 36.2 °C, FR: 15 rpm. Glasgow 15/15, glucemia capilar 118 mg/dl, sudorosa. ACP: normal. NRL sin focalidad. ECG con taquicardia sinusal a 116 lpm, sin alteraciones de la repolarización. Enzimas cardíacas normales. Rx tórax: ICT normal, no infiltrados agudos ni lesiones pleurales. ¿Cuál es el tratamiento inicial para esta paciente?","opts":["Alprazolam 0.5 mg por vía sublingual.","Oxígeno en gafas nasales a 3 litros por minuto.","Clopidogrel 300 mg vía oral en dosis de carga.","Ácido acetilsalicílico 300 mg vía oral sin cubierta entérica."],"ans":[0],"fix":0},{"id":584,"page":224,"q":"Sobre las posibles causas de insuficiencia renal aguda, seleccione el enunciado correcto:","opts":["Una relación BUN:Creatinina Sérica > 20:1 sugiere etiología prerrenal.","Una excreción fraccional de urea < 35 % sugiere etiología intrarrenal.","Una creatinina disminuida y BUN elevado sugiere etiología posrrenal.","La ecografía es de elección para diferenciar causa prerrenal de intrarrenal."],"ans":[0],"fix":0},{"id":585,"page":224,"q":"Un paciente presenta un derrame pleural con contenido predominantemente linfocitario, ADA positiva y cultivo de Lowenstein-Jensen negativo. Entre los siguientes diagnósticos. ¿Cuál es el más probable?","opts":["Mesotelioma.","Lupus Eritematoso.","Tuberculosis.","Sarcoidosis."],"ans":[0],"fix":0},{"id":586,"page":225,"q":"Neonato presenta ictericia. Se realiza determinación de bilirrubinas y existe una hiperbilirrubinemia con base en la directa o conjugada, en este caso. ¿Qué patología sería la más frecuente?","opts":["Atresia de vías biliares.","Incompatibilidad ABO.","Incompatibilidad Rh.","Ictericia por lactancia materna."],"ans":[0],"fix":0},{"id":587,"page":225,"q":"Un adolescente de 16 años es evaluado por un rash cutáneo. Hace dos semanas experimentó un cuadro respiratorio alto, caracterizado por leve dolor faríngeo, sin fiebre, tos u otros síntomas. Posteriormente apareció una placa eritematosa, seca y pruriginosa en su dorso torácico, de forma anular, de unos 3 cm. Aparecieron otras lesiones eritematosas sobre la piel de sus hombros, de pequeño tamaño, durante la última semana. Estas lesiones se han extendido al tronco. No se asocia a ningún otro síntoma. Acepta que tiene actividad sexual con su novia. Se protegen con condones. Niega viajes o exposiciones ambientales o picaduras de insectos. Al examen físico se aprecia placas eritemato papulares descamativas. Las lesiones tienen palidez central. No hay otros hallazgos significativos. Se le realizó una prueba rápida de reagina plasmática (RPR), la cual resultó negativa. ¿Cuál es el diagnóstico más probable en este adolescente?","opts":["Pitiriasis rosada","Psoriasis guttata","Enfermedad de Lyme","Sífilis secundaria"],"ans":[0],"fix":0},{"id":588,"page":225,"q":"De los movimientos rítmicos y repetitivos del cuerpo en la infancia, señale el que se presenta en el Autismo:","opts":["Estereotipias.","Compulsiones.","Mioclonías.","Corea."],"ans":[0],"fix":0},{"id":589,"page":226,"q":"Una mujer de 34 años presenta desde hace 5 horas: náusea, vómito de contenido gástrico por 3 ocasiones, junto con malestar general y 1 deposición diarreica líquida, sin moco, ni sangre. Refiere haber comido un sánduche de atún, 4 horas antes del inicio de su cuadro. La paciente recibió gentamicina hace 10 días por una infección de vías urinarias. Al llegar a la emergencia, sus signos vitales son TA 100/55, frecuencia cardíaca: 103 x minuto, Sat O2: 94%, FR: 23 x minuto, T: 37.4 °C. Mucosa orales semi húmedas, conjuntivas rosadas. Cardiopulmonar: normal. Abdomen: blando, depresible, doloroso a la palpación en mesogastrio, RHA aumentados. Se realizan exámenes de laboratorio: leucocitos 5600 x 10 9/L, neutrófilos 68%, Hematocrito 45%, creatinina 2 mg/dL, Na sérico 134 mEq, K sérico 5 mEq, BUN 20 mg/dL. En el examen elemental y microscópico de orina se encuentra la presencia de cilindros granulares pardos. ¿Cuál sería su sospecha diagnóstica?","opts":["Necrosis tubular aguda por toxicidad.","Hiperazoemia prerrenal","Rabdomiólisis","Hiperazoemia post renal"],"ans":[0],"fix":0},{"id":590,"page":226,"q":"Una paciente de 5 años ingresa con diagnóstico de desnutrición grave de origen primario. Seleccione la complicación que está asociada a mortalidad en las primeras horas de ingreso:","opts":["Hipotermia e Hipoglicemia.","Anemia y deshidratación.","Insuficiencia cardiaca y renal.","Insuficiencia hepática y sepsis."],"ans":[0],"fix":0},{"id":591,"page":227,"q":"Un paciente de 54 años se encuentra hospitalizado luego de haber sido operado de emergencia por una fractura compuesta de fémur posterior a un accidente de motocicleta. El paciente se encuentra en su primer día posquirúrgico cuando se queja súbitamente de disnea, mareo y sensación de opresión en el pecho con angustia notable. Sus signos vitales son: T: 37.5°C; TA: 110/70 mmHg; FC: 103 /min; FR: 28 /min; O2: 82% al aire ambiente. El examen físico revela petequias en cara, ligera ingurgitación yugular y disminución del murmullo vesicular bilateral. El residente solicita una prueba rápida de dímero D, la cual es negativa. ¿Cuál sería el diagnóstico más probable en este caso?","opts":["Embolia pulmonar grasa","Ataque de pánico","Infarto agudo de miocardio","Shock hipovolémico"],"ans":[0],"fix":0},{"id":592,"page":227,"q":"Paciente de 35 años diabética tipo 1 que presenta leucorrea blanca grumosa sin mal olor, prurito e irritación vulvar. Al examen físico se objetiva eritema vulvar, edema con excoriaciones y pH vaginal normal. ¿Cuál es el diagnóstico?","opts":["Vaginitis micótica.","Vaginosis bacteriana.","Herpes genital.","Linfogranuloma venéreo."],"ans":[0],"fix":0},{"id":593,"page":228,"q":"Una mujer de 68 años, diestra, con antecedentes de fibrilación auricular no valvular sin tratamiento anticoagulante, es encontrada a las siete de la mañana acostada en la cama con hemiparesia izquierda. En emergencia tiene un Glasgow de 8/15 (M 4 V 2 O2), la TA es de 145/100 mm Hg, hay una fibrilación auricular con respuesta ventricular media de 90. Las pupilas son isocóricas de 2 mm de diámetro, reactivas a la luz. Hay una heminegligencia visual izquierda y una hemiplejía fláccida izquierda facio braquio crural con respuesta extensora plantar izquierda. La glucosa es de 82 mg/dL, el sodio de 133 mmol/L. La TAC simple de cerebro muestra un infarto agudo del territorio superficial y profundo de la arteria cerebral media derecha. ¿Hacia qué lado debe estar desviada conjugadamente la mirada en la paciente?","opts":["Hacia la derecha.","Hacia abajo.","La mirada permanece central.","Hacia la izquierda."],"ans":[0],"fix":0},{"id":594,"page":228,"q":"Mujer de 15 años, es llevada a la emergencia hospitalaria por intento autolítico. Familiares refieren que la paciente ingirió hace 24 horas el medicamento de un familiar que lo utiliza para tratar el dolor. Antecedentes: desde hace 1 año en tratamiento por depresión. Al examen físico presenta: Glasgow 15/15, paciente alerta y con escleras ictéricas. Índice de masa corporal: 20 Kg/m2, tensión arterial: 120/80 mmHg, frecuencia cardíaca: 80 latidos por minuto, frecuencia respiratoria: 14 por minuto. Sat O2 aire ambiente 94 %. Abdomen: RHA presentes, no doloroso, no organomegalias. No se objetiva signos de hemorragia activa. Resto de la exploración normal. Laboratorio: Hemoglobina: 14 g/dL, hematocrito: 42 %, leucocitos: 6500 /mm3, plaquetas: 220.000 K/µL, creatinina 1 mg/dL, ALT: 1100 UI/L, AST: 1050 UI /L, bilirrubina total 3.5 mg/dL y tiempo de protrombina prolongado. ¿Cuál es el fármaco más probable que ocasiona el cuadro descrito?","opts":["Acetaminofeno.","Tramadol.","Metamizol.","Ibuprofeno."],"ans":[0],"fix":0},{"id":595,"page":229,"q":"En relación con el tratamiento de la infección con VIH existen algunos esquemas y consideraciones según comorbilidades preexistentes. Atendiendo a la guía del MSP, seleccione la afirmación correcta:","opts":["El efavirenz se desaconseja si hay enfermedades neuropsiquiátricas coexistentes, siendo el esquema recomendado tenofovir + FTC + atazanavir.","En casos de enfermedad renal concomitante se evitará el uso de emtricitabina por lo que el esquema apropiado es abacavir/lamivudina + efavirenz.","El tratamiento debe tener al menos 3 fármacos antirretrovirales, siendo el esquema inicial de elección en Ecuador zidovudina/lamivudina + atazanavir.","Cuando hay anemia moderada o severa, habrá que evitar el uso de tenofovir, por lo que el esquema inicial cambia a abacavir/lamivudina + efavirenz."],"ans":[0],"fix":0},{"id":596,"page":229,"q":"¿Qué microorganismo de la flora vaginal normal utiliza el glucógeno como sustrato básico?","opts":["Bacilos de Döderlein.","Trichomona Vaginalis.","Candida Albicans.","Escherichia Coli."],"ans":[0],"fix":0},{"id":597,"page":229,"q":"Paciente femenino de 1 año con características normales del peso para la edad. En la gráfica de crecimiento peso/edad, de acuerdo con el sexo, se observa una tendencia ascendente de la relación longitud/edad. Aplicando los criterios de evaluación AIEPI de la talla en niños menores de 1 año. ¿Qué clasificación de la tendencia de crecimiento le corresponde a esta niña?","opts":["Tendencia de crecimiento apropiada.","Tendencia de crecimiento inapropiada.","Talla muy alta.","No tiene talla baja."],"ans":[0],"fix":0},{"id":598,"page":230,"q":"Un niño de 16 meses y 10 kg de peso, presenta diarreas. Está irritable, tiene los ojos hundidos, las mucosas orales secas, pide insistentemente agua, presenta signo de pligue en abdomen. ¿Cuál es la mejor opción para su tratamiento?","opts":["Suero oral 750 ml y Zinc 20 mg QD x 14 días.","Suero oral 950 ml y Zinc 10 mg QD x 14 días.","Suero oral 550 ml y Zinc 20 mg QD x 14 días.","Suero oral 350 ml y Zinc 10 mg QD x 14 días."],"ans":[0],"fix":0},{"id":599,"page":230,"q":"Seleccione la opción que define adecuadamente el signo de Galeazzi para evaluar la posibilidad de Displasia Congénita de Cadera (DCC) en un neonato:","opts":["Flexionar las piernas, inspeccionar los pliegues glúteos y del muslo. La asimetría, se produce por acortamiento relativo del fémur.","Estabilizar la cadera, aplicar aducción por presión suave hacia abajo, palpar la luxación cuando la cabeza sale del acetábulo.","Estabilizar la pelvis y sujetar la pierna. Aplicar abducción y presión ico: TA: 110/80 mmHg; FC: 85/min; Peso 60 kg; Talla 1.56 m; examen físico por aparatos y sistemas dentro de parámetros normales. Ecografía obstétrica transvaginal: saco gestacional intrauterino, único, redondeado, anecoico, con adecuada reacción decidual; en su interior polo embrionario de 4 mm que corresponde a una edad gestacional de 6 semanas; frecuencia cardíaca embrionaria 160/min. ¿Cuál de las siguientes acciones es la más adecuada para realizar en este momento?","opts":["Coombs indirecto.","Coombs directo","Inmunoglobuina anti D","ADN libre fetal en sangre materna."],"ans":[0],"fix":0},{"id":603,"page":232,"q":"¿Cuál es el tratamiento agudo (inmediato) en una paciente con metrorragia disfuncional?","opts":["Estrógenos conjugados.","Acido tranexámico.","Ibuprofeno.","Betametasona."],"ans":[0],"fix":0},{"id":604,"page":232,"q":"En un paciente con insuficiencia mitral grave. ¿Qué tratamiento es el más apropiado?","opts":["Diuréticos, IECAS, betabloqueantes y digoxina.","Penicilina G benzatínica intramuscular, Diuréticos, IECAS y betabloqueantes.","Nifedipina de acción prolongada, Diuréticos, betabloqueantes y digoxina.","Diuréticos, anuloplastia, IECAS y betabloqueantes."],"ans":[0],"fix":0},{"id":605,"page":232,"q":"Una niña de 4 meses de edad sin antecedentes de importancia, es traída por su madre a la emergencia debido a que el día de hoy presenta convulsiones y vómito. Al examen se la encuentra irritable, inconsciente y letárgica. El fondo de ojo revela hemorragia retiniana derecha. Los exámenes de laboratorio son normales excepto por la presencia de anemia, ¿Cuál es el diagnóstico más probable?","opts":["Síndrome del niño sacudido.","Enfermedad de von Willebrand.","Encefalitis herpética","Hemofilia tipo A."],"ans":[0],"fix":0},{"id":606,"page":232,"q":"Según Esquema Nacional de Vacunación. ¿Qué vacunas se administra a los 6 meses de edad?","opts":["OPV 3ra dosis – Pentavalente 3ra dosis – Neumococo conjugada.","Pentavalente – Fiebre amarilla – Hepatitis B." Cuál es el diagnóstico de la paciente?","opts":["Vaginosis bacteriana.","Candidiasis vulvovaginal.","Cervicitis por Chlamydia trachomatis.","Gonorrea no complicada."],"ans":[0],"fix":0},{"id":614,"page":235,"q":"Hombre de 28 años, acude a consulta externa por dolor en testículo derecho, de intensidad moderada, de 1 día de evolución, no fiebre, no refiere traumatismos. Antecedentes: No refiere. Vida sexual activa. A la exploración física presenta: TA: 120 /80 mmHg, FC: 78 lpm, T: 36.5ºC, FR:17 rpm. Consciente y orientado en las tres esferas. Cardiopulmonar: normal. Abdomen: normal. Genitourinario: Presencia de tumefacción a nivel del epidídimo derecho, dolor a la palpación de epidídimo derecho. Resto de la exploración normal. A parte de la terapia del dolor. ¿Cuál es la antibioticoterapia más apropiada?","opts":["Ceftriaxona y doxiciclina.","Trimetropim-sulfametoxazol.","Azitromicina y gentamicina.","Metronidazol o tinidazol."],"ans":[0],"fix":0},{"id":615,"page":236,"q":"Paciente de 3 años asiste a hospital de segundo nivel básico, con estridor inspiratorio y entrada de aire muy limitada. Al examen físico se observa un paciente somnoliento, letárgico, con retracciones torácicas generalizadas, cianosis distal, SpO2 menor a 90 %. FR: 60 rpm, FC 120 lpm. Seleccione la combinación correcta en cuanto a las medidas iniciales y fármacos en el crup:","opts":["Oxígeno, dexametasona 0.15 a 0.6 mg/kg/dosis IV, adrenalina racémica 1mg/1ml nebulizada a 0.5 mg/kg/dosis, referir tras la estabilización.","Oxígeno, prednisona 4 mg/kg VO, adrenalina nebulizada a 0.5 mg/kg/dosis, referir tras la estabilización.","Oxígeno, dexametasona 0.15 a 0.6 mg/kg/dosis IV, salbutamol nebulizaciones 0.15 a 0.35 mg/kg/dosis, referir tras la estabilización.","Oxígeno, dexametasona 0.15 a 0.6 mg/kg/dosis IV, ampicilina 150 mg/kg/día, referir tras la estabilización."],"ans":[0],"fix":0},{"id":616,"page":236,"q":"Varón de 15 años, residente en la zona rural. Presenta fiebre y escalofríos de 15 días de
