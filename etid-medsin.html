<style>
:root{--bg:#f3f5f9;--c:#fff;--t:#14202e;--m:#64748b;--p:#0f4c81;--p2:#1d6fb8;--ok:#15803d;--ko:#b91c1c;--b:#e2e8f0;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);padding-bottom:76px}
header{background:linear-gradient(135deg,#0f4c81,#1d6fb8);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}

button{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:12px;padding:10px 16px;transition:.15s}button:active{transform:scale(.98)}
.pri{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}.pri:disabled{opacity:.5}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:9px 0;padding:12px 14px;border-radius:14px}.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--m)}
.opt.sel{border-color:var(--p);background:rgba(29,111,184,.1)}.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.12)}.opt.ok .l{background:var(--ok);color:#fff}.opt.ko{border-color:var(--ko);background:rgba(185,28,28,.1)}.opt.ko .l{background:var(--ko);color:#fff}

oQRVxeopX+8aLBcqzh3XhST6UluGSIKUIq4v+s/CkalYLlK8V5Idqoadao6QIpB4q0/3fwoj+5VWC5UuleSMAA8NUqhlUcGpH6D6041NguU7tXcrgGpl3BR8p4p8vVakHQ07Bco3CO7KQh61YBYDG01I/b609u9FguZ1xE7XSuAcVbYsR0NK/3hTz2osCZR8uT7Tu2HpVkbupU1N/F+FKfuCiwNlGJXWdj5bYIqcF/wDnm1TL1qXsKLCuZsKuJWJjIFTHODhDU/egd6LDTKFqkiFhsPJqeUO0RGDU6d6U9DRYbZTskdIzkHrTrlWeM/Kanh+5+NPb/VmiwrlW3VkjwUNJch2iICnmrS/cFJN90UWBMghDiIKQaiukkeMhQc1bSj+9RYHIjQvsUMDwKr3iSPtKA8VdPT8KQ/cFFhpjFZ9o4PSq1zG7SocGro6UknVKLCTIhuwODUEkbtdI2DV3tTf+Wq0WHcT5s9DVby3F2HwavCmH74osK4wF92earQxOLl2wcE1dFIv3jRYLjCWAIwar26SLKxKnBNXD2pVosFyFt204U5qvaJIjuWUjJq+O9N7miwXInLGNhg1FZo6I+VPWrX8Jog6Giw7la43tC6hDyKLUOsCKUOQKtP8AdNEfaiwXKl2rtFgIaks1YBQUPSrEnSnQfeH0osFz/9k=","fix":0},{"id":123,"page":45,"q":"Seleccione la respuesta correcta con relación a la hipoglucemia neonatal:","opts":["El mantenimiento de la normoglucemia en el neonato es importante para mantener un adecuado metabolismo cerebral.","La incidencia de hipoglicemia es más frecuentes en lactantes mayores y de peso normal para la edad gestacional.","En la actualidad se define como hipoglicemia a valores bajo 65 mg/dl.","El tratamiento en la hipoglicemia sintomática consiste en la administración de un bolo de glucosa de 4ml/Kg al 25%."],"ans":[0],"fix":0},{"id":124,"page":46,"q":"En relación al asma bronquial. Seleccione el enunciado correcto.","opts":["El Asma es una patología multifactorial y poligénica. Hasta la actualidad se han identificado aproximadamente 100 genes relacionados con el desarrollo de esta patología.","La siguiente sintomatología clínica no aumenta la probabilidad de Asma: tos, sibilancias, dificultad respiratoria y opresión torácica especialmente; ni los cuadros infecciosos de las vías respiratorias altas, tampoco empeora con el ejercicio, ni al contacto con mascotas.","El Asma IgE mediado se caracteriza por no presentar una sensibilización alergénica. No suele haber atopia en el paciente, ni antecedentes familiares.","El riesgo de desarrollar Asma no tiene ninguna relación con antecedentes de madre fumadora, prematuridad, falta de lactancia materna y antibióticos en el tercer trimestre del embarazo."],"ans":[0],"fix":1},{"id":125,"page":46,"q":"Paciente de un mes con antecedente natal de cesárea por distocia de presentación, podálica, al nacimiento le indican signos de Ortholani y Barlow positivos. ¿Qué se debe solicitar como examen de imagen para corroborar el diagnóstico?","opts":["Ecografía de las caderas.","TAC con reconstrucción de cadera.","RX AP de caderas.","RMN de caderas."],"ans":[0],"fix":0},{"id":126,"page":47,"q":"Paciente femenina de 10 meses de edad es traída por su madre debido a que manifiesta rechazo parcial del alimento, irritabilidad + alza térmica por tres ocasiones. La madre refiere que la niña ha presentado pielonefritis por 2 ocasiones anteriormente. Al examen físico Usted, corrobora lo dicho por la madre y al presentar alza térmica de 39°C sin foco infeccioso específico, solicita un urocultivo que muestra positividad. Corroborando así su diagnóstico de pielonefritis aguda. Con respecto al tratamiento y exámenes complementarios. ¿Qué opción de las siguientes no recomienda?","opts":["Se recomienda por las infecciones recurrentes de la paciente realizar una ecografía renal más una cistouretrografía miccional; este abordaje identifica por excelencia alteraciones como cicatrices renales.","Es preferible un ciclo de 7-14 días de antibióticos de amplio espectro que puedan alcanzar unas concentraciones tisulares adecuadas. Es preferible el tratamiento parenteral con ceftriaxona (50-75 mg/kg/24 h, sin superar los 2 g), cefotaxima (100 mg/kg/24 h) o ampicilina (100 mg/ kg/24 h) más un aminoglucósido como gentamicina (3-5 mg/kg/24 h en 1-3 dosis).","Debe tenerse en cuenta la posible ototoxicidad y nefrotoxicidad de los aminoglucósidos, y se deben controlar las concentraciones séricas de creatinina y gentamicina antes del tratamiento y diariamente a lo largo de éste.","Se recomienda realizar por las infecciones recurrentes una gammagrafía con DMSA; este abordaje identifica por excelencia alteraciones como cicatrices renales, las áreas involucradas del riñón son hipocaptantes y el riñón se mostrará agrandado."],"ans":[0],"fix":0},{"id":127,"page":47,"q":"Paciente masculino de 6 meses de edad con antecedente de rinofaringitis hace 8 días, es traído por su madre por presentar alza térmica no cuantificada de 2 días de evolución, letargo, irritabilidad, diarreas y mala succión. Al examen físico: febril, fontanela anterior abombada, somnoliento con alternancia con irritabilidad paradójica. Usted sospecha de una meningitis y solicita una punción lumbar. ¿Cuál resultado de análisis de liquido cefalorraquídeo es compatible con una Meningitis Bacteriana?","opts":["LCR aspecto turbio, leucocitos 1.500/mm3, con un predominio de neutrófilos de 75 % , proteínas 600 mg/dl y glucosa 30 mg/dl.","Aspecto transparente con leucocitos 300 leucocitos/mm3 , con presencia de mononucleares 60 %, proteínas 35 mg/dl y glucosa de 50 mg/dl.","Aspecto opalescente, recuento de leucocitos 800 leucocitos/mm3, con un predominio de monocitos en 68 %, proteínas 80mg/dl y glucosa 40 mg/dl, coloración BAAR positiva.","Color transparente, aspecto agua de roca, ausencia de células, proteínas negativo, glucosa 50 mg/dl."],"ans":[0],"fix":0},{"id":128,"page":48,"q":"El déficit de hierro es el trastorno nutricional más extendido y común en el mundo. Se estima que el 30% de la población global sufre anemia ferropénica y la mayor parte de los afectados viven en países en vías de desarrollo. Una vez recalcada la importancia de la anemia por déficit de hierro, escoja el enunciado verdadero:","opts":["El diagnóstico de anemia por deficiencia de hierro se efectuará a través de la biometría hemática y el perfil de hierro, en donde se puede encontrar: hemoglobina disminuida, VCM disminuido, amplitud de distribución eritrocitaria elevada, ferritina sérica disminuida, captación total fija de hierro elevada.","El recién nacido a término posee 5gr de hierro al igual que el adulto, por lo que, no es necesaria la alimentación rica en hierro en los primeros 15 años de vida.","En el recién nacido a término la sección precoz del cordón umbilical <30 segundos no influye en el riesgo de déficit de hierro ni en las concentraciones de hemoglobina durante los 2 a 3 primeros meses de vida.","La mayor parte de los niños con déficit de hierro se encuentran sintomáticos y son identificados por evaluación clínica. El signo que tarda en aparecer y menos frecuente es la palidez y se genera cuando la hemoglobina desciende de 4 g/dl"],"ans":[0],"fix":0},{"id":129,"page":49,"q":"Paciente masculino de 4 años acude por presentar un cuadro de diarrea por cuatro ocasiones en las últimas 12 horas, las diarreas se caracterizan por ser mucosanguinolentas, poco voluminosas y con pujo, asociadas a fiebre de 39 °C. Al examen físico se halla un niño hidratado, con dolor abdominal a nivel de mesogastrio + alza térmica de 38.5 °C, abdomen levemente distendido. Usted diagnostica al niño de una enfermedad diarreica aguda y tiene la sospecha diagnóstica de que se trata de un mecanismo enteroinvasivo o inflamatorio. De los siguientes enunciados en relación al mecanismo mencionado. ¿Cuál es el correcto?","opts":["Los principales agentes responsables del mecanismo enteroinvasivo o inflamatorio son la salmonella, shigella, E. coli enteroinvasiva, campylobacter, yersinia, bacilo cereus, vibrio parahaemolyticus, entamoeba histolyitica.","En el mecanismo enteroinvasivo los gérmenes se adhieren a la mucosa intestinal a través de pilis y elaboran toxinas que generan la producción de cloro y un bloqueo de la absorción de sodio y de agua; se afecta principalmente el intestino delgado por lo que las diarreas son líquidas y abundantes.","En el estudio macroscópico y microscópico de las heces en el mecanismo enteroinvasivo podemos encontrar una coloración amarillenta dorada con un pH ácido y bajo contenido de Na en heces.","El tratamiento solo irá dirigido a restablecer el desequilibrio hidroelectrolítico únicamente con dextrosa y no es necesario la administración de antibióticos."],"ans":[0],"fix":0},{"id":130,"page":49,"q":"¿Cuál es una condición clínica de la enfermedad de VIH en adultos y adolescentes en el estadio III?","opts":["Tuberculosis pulmonar actual.","Encefalopatía asociada al VIH.","Erupción papular pruriginosa.","Queilitis angular."],"ans":[0],"fix":0},{"id":131,"page":50,"q":"Aproximadamente el 0.5-2 % de las infecciones víricas de las vías respiratorias superiores en los niños y adolescentes se complican con una sinusitis bacteriana aguda sintomática. Con respecto a la presente enfermedad escoja el enunciado correcto.","opts":["El diagnóstico es clínico y se puede solicitar una radiografía simple de senos paranasales donde se hallará opacificación de los senos paranasales, engrosamiento de la mucosa mayor de 4 mm, este cuadro debe tratarse con amoxicilina de 45 mg/kg día dividida en dos dosis de 7 a 10 días, en casos graves amoxicilina más ácido clavulánico 80 - 90 mg/Kg/d por 7 a 10 días.","El agente cusal de la sinusitis es el estafilococo dorado o aureus.","Los niños y niñas al nacimiento tienen sus 4 pares de senos paranasales totalmente formados y neumatizados.","Los signos patognomónicos de la sinusitis es la halitosis, hiposmia y edema periorbitario; por lo que es fácilmente diferenciable de un resfriado común."],"ans":[0],"fix":0},{"id":132,"page":50,"q":"En relación al aborto terapéutico (AT), contemplado en el código orgánico integral penal ecuatoriano, 1.- “si se ha practicado para evitar un peligro para la vida o salud de la mujer embarazada y si este peligro no puede ser evitado por otros medios” o 2.- si el embarazo es consecuencia de una violación en una mujer que padezca de discapacidad mental. Indique: ¿Cuál es el método farmacológico adecuado para proceder a la interrupción en un embarazo con una edad gestacional de hasta 12 semanas (84 días)?","opts":["El método recomendado par ntecedentes médicos de importancia acude al servicio de urgencias. Refiere que presenta un dolor de tipo cólico localizado en el epigastrio desde hace 6 horas, luego de la ingesta de comida con contenido graso, se acompaña de nausea que llega al vómito de contenido alimentario que no ha modificado el dolor. Al examen físico la paciente presenta tinte ictérico en escleras, refiere dolor a la palpación profunda en el hipocondrio derecho. ¿Qué examen es el más apropiado realizar?","opts":["Ecografía de hígado y vías biliares.","Tomografía computarizada.","Colangiografía retrógrada endoscópica.","Ecografía endoscópica."],"ans":[0],"fix":0},{"id":211,"page":77,"q":"Una de las infecciones parasitarias prevalentes en la infancia es por oxiuros o Enterobius vermicularis, que es un nematodo pequeño (1 cm de largo), blanco, filiforme o gusano redondo, que habitualmente habita el ciego, el apéndice y las áreas adyacentes del íleon y colon ascendente, a través de contaminación fecal oral. Respecto de la infección por Enterobius vermicularis, señale lo correcto:","opts":["La migración aberrante a sitios ectópicos ocasionalmente puede conducir a apendicitis, salpingitis crónica, enfermedad inflamatoria pélvica, peritonitis, hepatitis y lesiones ulcerativas en el intestino grueso o delgado.","Para el diagnóstico microscópico, el examen de coprológico muestra huevos del parásito y 1 examen detecta el 99 % de las infecciones.","Se deben tratar a individuos infectados y su familia con imidazólicos, como Metronidazol es el tratamiento de elección y da como resultado tasas de curación superiores a 90%.","La prevalencia de la infección por oxiuros es mayor en niños menores de 5 años."],"ans":[0],"fix":0},{"id":212,"page":78,"q":"Respecto de la Infección de Vías Urinarias ( IVU ) en niños, señale lo correcto:","opts":["La pielonefritis se caracteriza por alguno de los siguientes síntomas o por todos ellos: dolor abdominal, de espalda, dolor en el costado, fiebre, malestar, náusea, vómitos y, ocasionalmente, diarrea.","Los recién nacidos pueden mostrar síntomas específicos, tales como disuria, polaquiuria, urgencia y tenesmo miccional, orina turbia y de mal olor con dolor en fosas lumbares.","La pielonefritis es la infección bacteriana grave menos común en bebés menores de 24 meses de edad.","Es frecuente la infección renal que se produce por diseminación hematógena, como en la endocarditis o en algunos neonatos bacteriémicos."],"ans":[0],"fix":0},{"id":213,"page":78,"q":"El tratamiento de la pielonefritis en pacientes pediátricos, debe ser adecuado y oportuno, para evitar complicaciones. Respecto del tratamiento. Señale lo correcto:","opts":["Un curso de antibióticos de 7-14 días que es capaz de alcanzar niveles significativos en tejidos es adecuada en pielonefritis; Las vías oral y parental son igualmente eficaces.","Los niños deshidratados, con vómito, no pueden beber, tienen infección complicada, o con urosepsis, deben ser tratados en forma ambulatoria.","Ante síntomas leves o de diagnóstico dudoso, el tratamiento debe iniciarse con un curso de quinolonas.","La nitrofurantoína debe usarse habitualmente en niños con IVU febril, porque alcanza niveles significativos de tejido renal."],"ans":[0],"fix":0},{"id":214,"page":79,"q":"Un varón de 55 años, es traído a urgencias por el personal prehospitalario con inmovilización cervical y en tabla rígida. Le comentan que siendo el conductor de una motocicleta, sufre un accidente de tránsito en el que se produce un impacto frontal (con uso de casco) contra una pared. Desde su evaluación prehospitalaria presenta una Escala de Coma de Glasgow: 12 (RO: 3; RV: 4; RM: 5). SV: TA: 130/90 mmHh; FC: 105 lpm; FR: 19 rpm; T: 36 °C, Sat. 92%. Ausencia de lesiones en cuero cabelludo, sin equimosis periorbitaria, presenta pupilas isocóricas y fotorreactivas, a la palpación de la columna torácica realiza un quejido, se evidencia alteración sensorial al dolor y temperatura por debajo de la caja torácica, en el examen motor muestra ausencia de movimiento en las extremidades inferiores. La tomografía de columna torácica muestra fractura de cuerpos vertebrales a nivel de T5 a T8 con desplazamiento posterior de fragmentos óseos. ¿Cuál sería la lesión más probable en este paciente?","opts":["Síndrome de cordón anterior.","Síndrome medular central.","Síndrome de Brown Sequard.","Síndrome del foramen magnum."],"ans":[0],"fix":0},{"id":215,"page":79,"q":"Mujer de 31 años, con antecedente de 4 abortos de repetición, acude por astenia desde hace 6 meses, sin otra sintomatología. A la exploración física: Paciente en buen estado general, TA: 115/75 mmHg, FC: 74 lpm, FR: 12 rpm, SatO2 96%, soplo sistólico pulmonar grado 3/6, resto sin alteraciones. La analítica sanguínea en ayunas muestra: Hb 13.7 g/dL, Hto 41.1%, VCM: 87 fL, leucocitos 8 750/mL, Neutrófilos 63%, linfocitos 33%, eosinófilos 1%, monocitos 1%, basófilos 2%, plaquetas: 200 000/µL; Glucosa 87 mg/dL, creatinina 0.7 mg/dL, ácido úrico: 5.20 mg/dL. Colesterol total: 188 mg/dL, HDL: 50 mg/dL, LDL: 97 mg/dL, triglicéridos: 135 mg/dL. Perfil hepático, tiroideo, coagulación y EMO normales. INR: 1.1. Anticoagulante lúpico y anticuerpos anticardiolipina positivos a título alto. Eco transtorácico y transesofágico: masa móvil de 3.2 x 1.2 cm en el tracto de salida del ventrículo derecho (VD) en forma de racimo que prolapsa en sístole hacia la arteria pulmonar. ¿Cuál es el tratamiento de primera elección para esta paciente?","opts":["Enoxaparina sódica en dosis de anticoagulación.","Clopidogrel 300 mg dosis única.","Warfarina.","Acenocumarol."],"ans":[0],"fix":0},{"id":216,"page":80,"q":"Una mujer de 20 años con normopeso es llevada a la emergencia del hospital por presentar letargia. De acuerdo a sus familiares, la paciente presentó un malestar estomacal hace cuatro días con náusea, vómito, y dolor abdominal. Desde entonces, el vómito ha desaparecido, pero persisten los otros síntomas que se han intensificado, además de una disminución del apetito. Adicionalmente, en las últimas semanas ha experimentado una pérdida de 4 kg de peso corporal, asociado a una sed excesiva. Refiere fecha de la última menstruación hace 10 días. La paciente toma ocasionalmente cervezas, niega consumo de tabaco o drogas ilícitas. No relata antecedentes familiares. Al examen físico presenta una temperatura de 37.2 °C, presión arterial de 100/56 mmHg, pulso de 120/min (regular pero débil), y respiraciones de 28/min (rápidas y profundas). La saturación de oxígeno es de 97%, se encuentra letárgica, pero responde a estímulos y mueve sus extremidades espontáneamente. La química sanguínea muestra glucemia de 300 mg/dL, cetonas 3.0 mmol/L. El análisis de orina mostró un valor de 20 mg/dL de cetonas. ¿Cuál es el diagnóstico más probable que presenta esta paciente?","opts":["Diabetes Mellitus tipo 1.","Diabetes insípida central.","Diabetes Mellitus tipo 2.","Diabetes insípida nefrogénica."],"ans":[0],"fix":0},{"id":217,"page":80,"q":"Varón de 7 meses, atendido en emergencia de un hospital, deshidratado con vómitos, diarrea y fiebre de 4 días de evolución. Ojos hundidos, signo del pliegue positivo, taquipneico y peso: 6 kg. Analítica sanguínea: Hb 11.6 g/dl; Hto: 39 %; Leucocitos: 14 900 mm3 (Neutrófilo 63 %; Linfocitos: 30 %; Monocitos: 7 %); Plaquetas: 322 000 mm3; Osmolaridad: 295 mOs/L; Na: 137 mEq/l; K: 5.6 mEq/l; Ca iónico: 1.2 mmol/l; pH: 7.20; pCO2: 35 mmHg; HCO3:11mEq/l; Lactato: 5.3mmol/l; Creatinina: 4.2 mg /dl. ¿Cuál es la deshidratación más probable que presenta el paciente?","opts":["Isotónica con acidosis metabólica.","Hipotónica con acidosis respiratoria.","Hipotónica con acidosis metabólica.","Hipertónica con acidosis metabólica."],"ans":[0],"fix":0},{"id":218,"page":81,"q":"Un paciente de 77 años es traído a la emergencia por sus familiares por presentar dolor abdominal. El dolor comenzó 18 horas antes y se localiza en el cuadrante inferior izquierdo del abdomen. El dolor empezó insidiosamente y ha aumentado mucho en intensidad hasta alcanzar 7/10 en opinión del paciente. Ha tenido dos episodios de vómito alimentario al inicio del dolor. No ha tenido evacuación intestinal ni ha eliminado flatos en 18 horas. El dolor no tiene irradiación y es continuo. Sus antecedentes personales son importantes por un sangrado digestivo bajo hace 4 años. Al examen físico su temperatura es de 37.9 grados; FR: 17/min; FC: 96/min; TA: 150/85 mm Hg. El examen cardiopulmonar es normal. El abdomen se aprecia ligeramente distendido. Es suave pero hay resistencia muscular a la palpación del lado izquierdo en donde se produce dolor intenso a la palpación profunda. No hay dolor de rebote. Los ruidos hidroaéreos están diminuidos. La biometría hemática muestra leucocitosis de 12.000/ mm3 y neutrofilia. La creatinina está en 1.1 mg/dL. ¿Cuál es el diagnóstico más probable?","opts":["Diverticulitis aguda.","Vólvulo de sigma.","Colitis ulcerativa.","Colitis isquémica."],"ans":[0],"fix":0},{"id":219,"page":81,"q":"Un paciente de 56 años acude a la consulta de gastroenterología tras haber tenido tres episodios de diverticulitis aguda, el último hace un mes. En todas las ocasiones fue tratado con reposo digestivo por unos días y dieta sin fibra por unas semanas hasta continuar luego con la dieta habitual. Siempre siguió las recomendaciones que se le hicieron pero sus problemas persisten. El paciente se encuentra asintomático y ha empezado desde hace una semana, por recomendación de su médico personal, una dieta con fibra. El paciente se encuentra en buen estado general. Sus signos vitales son normales, su examen físico es normal y su analítica sanguínea es totalmente normal. ¿Cuál es la recomendación que corresponde respecto al tratamiento?","opts":["Programar cirugía resectiva del segmento de colon.","Dieta con fibra y anticolinérgicos por seis meses.","Dieta sin fibra y estimulantes de la motilidad por un año.","Colonoscopía cada año por dos años y luego cada tres años."],"ans":[0],"fix":0},{"id":220,"page":82,"q":"Mujer de 40 años, acude a consulta por secreción vaginal dos días pos coito, sin otros síntomas acompañantes. Tiene una pareja estable desde hace 3 años. Al examen físico presenta: signos vitales normales, leucorrea grisácea fétida en escasa cantidad, vagina y cérvix sin anomalías. Resto de la exploración normal. La preparación en fresco de la secreción vaginal muestra células guía al microscopio, el pH vaginal es de 5 y la prueba de aminas es positiva. ¿Cuál es el principal agente causal del cuadro descrito?","opts":["Gardnerella vaginalis.","Cándida albicans.","Trichomona vaginalis.","Chlamydia trachomatis."],"ans":[0],"fix":0},{"id":221,"page":82,"q":"Mujer de 35 años se encuentra en seguimiento de puerperio luego de haberse sometido a una cesárea programada a la semana 37 de gestación debido a hipertensión arterial diagnosticada en la semana 24, que respondió parcialmente a tratamiento con nifedipina. El procedimiento se realizó sin complicaciones y a las 24 horas la paciente no refiere síntomas de relevancia. Su historia clínica refiere como único antecedente una gesta previa con diagnóstico de preeclampsia sin secuelas. Actualmente el examen físico evidencia tensión arterial de 180/90 mmHg, frecuencia cardíaca 90 latidos por minuto, frecuencia respiratoria 16 por minuto. Abdomen: suave, depresible, no doloroso. Fondo uterino: O – 1. Laboratorio: Plaquetas 200.000 mm3 creatinina 0.9 mg/dL, ALT 25 U/L. Proteinuria: positiva. A las 48 horas postparto la paciente presenta crisis convulsivas tónico clónico generalizadas. ¿Cuál es el diagnóstico inicial más probable?","opts":["Eclampsia.","Hipertensión crónica con preeclampsia sobreañadida.","Preeclampsia leve.","Preeclampsia grave."],"ans":[0],"fix":0},{"id":222,"page":83,"q":"Mujer de 45 años acude a emergencia por presentar desde hace 48 horas, dolor en el miembro inferior derecho en relación a un aparente traumatismo con el borde de su ropero. Antecedentes: hipertensión arterial hace 4 años. Al examen físico presenta: FC: 98 lpm, TA: 125/86 mmHg, temperatura: 38 °C, FR: 16 rpm y Sat O2: 96%. En el tercio medio de la pierna derecha se objetiva una placa eritematoedematosa, caliente, brillante, dolorosa a la digitopresión de aproximadamente 10 cm de diámetro, con aspecto de piel de naranja y límites de la lesión bien demarcados. Pulsos distales presentes. Resto de la exploración normal. ¿Cuál es el diagnóstico más probable?","opts":["Erisipela.","Celulitis.","Fascitis necrosante.","Herpes zóster."],"ans":[0],"fix":0},{"id":223,"page":83,"q":"Mujer de 48 años, acude por consulta externa, refiere que hace un año presenta caída del cabello, piel seca, disminución de libido sexual, alteración en los ciclos menstruales, aumento de peso. A los exámenes: HB: 12.5 gr/dl plaquetas 140 000 mcL, FSH: 19 mlU/mL (4.5 a 21.5 mIU/L), LH 24 UI/L (5 a 25 UI/L) TSH 5.2 mUI/L (0.5 a 4.5 mUI/L), T4 libre normal, ATPO 75 ng/ml (60 ng/mL). Al examen físico PA 100/60 mm Hg, FC de 85 lpm, IMC de 29.5 Kg/m2, piel seca en manos, uñas quebradizas, resto de examen físico en parámetros normales. ¿Cuál es el diagnóstico más probable?","opts":["Hipotiroidismo subclínico.","Síndrome de ovario poliquístico.","Hipertiroidismo.","Insuficiencia ovárica primaria."],"ans":[0],"fix":0},{"id":224,"page":84,"q":"Mujer de 45 años acude a urgencias por presentar desde hace 36 horas dolor abdominal de gran intensidad, constante, localizado en epigastrio y región periumbilical e irradiado a flancos y a hemiabdomen inferior, acompañado de náusea, vómito y distensión abdominal. Antecedente: litiasis vesicular. A la exploración física presenta: TA: 80/60 mmHg, FC: 115 lpm, FR: 24 rpm, T: 38 °C, SpO2 94%. Abdomen: RHA disminuidos, dolor generalizado a la palpación y rigidez muscular abdominal en grado variable, se evidencia signo de Cullen y de Turner. Resto de la exploración normal. Los exámenes complementarios muestran: Hb: 18.9 g/dL, Hto: 44.3%, leucocitos 14 000/µL, neutrófilos: 75%, linfocitos: 20%, plaquetas: 252 000, sodio: 124 mEq/L, potasio: 3.37 mEq/L, cloro: 100 mEq/L, calcio: 1.50 (2.13 a 2.55 milimol/L), magnesio: 1.9 (de 0.85 a 1.10 mmol/L), creatinina: 0.78, BUN: 7.4 (7 y 20 mg/dL). Glucemia 130 mg/dl, amilasa: 537 U/l y lipasa: 6 660 U/l. Pruebas de coagulación normales. ¿Cuál es la prioridad en el tratamiento inicial de este paciente?","opts":["Fluidoterapia intravenosa intensiva.","Analgésicos narcóticos por vía endovenosa.","Oxígeno complementario por cánula nasal.","Antibióticos parenterales intravenosos."],"ans":[0],"fix":0},{"id":225,"page":84,"q":"Mujer de 34 años acude a consulta para programación de su esplenectomía, debido a que entre sus antecedentes personales se incluyen púrpura trombocitopénica idiopática en tratamiento con prednisona 50mg/ día. Al examen físico se palpa esplenomegalia, presencia de petequias en extremidades superiores e inferiores. El hemograma muestra plaquetas 25 000/mm3. ¿Contra cuál de las siguientes bacterias se recomienda la inmunización en esta paciente?","opts":["Haemophilus influenzae.","Bordetella pertussis.","Pseudomona aeruginosa.","Corynebacterium diphteriae."],"ans":[0],"fix":0},{"id":226,"page":85,"q":"Paciente masculino de 68 años acude a emergencias traído por su hijo por tos seca desde hace 8 días. En las últimas 48 horas, presenta expectoración purulenta, dificultad respiratoria, fiebre de 39 °C, diaforesis nocturna, mialgias y dolor pleurítico en la región dorso lateral de hemitórax derecho. Se acompaña desde hace 24 horas de confusión mental y falta de ingesta oral. Antecedentes: hipertensión arterial controlada con Lisinopril. Al examen físico presenta: TA: 88/56 mm Hg, FC: 115 lpm, FR: 35 rpm, T: 38 °C, SpO2 88 %. Se objetiva tiraje intercostal inferior y matidez en hemitórax posterior derecho. Los exámenes muestran: urea 12 mmol/l, leucocitos 14 000/µL, neutrófilos 80 %, VSG 50 mm/h. Radiografía de tórax con infiltrado en base derecha. De acuerdo con el índice de gravedad de la clasificación CURB 65 ¿Cuál es el siguiente paso para el manejo de este paciente?","opts":["Hospitalización con ingreso a Unidad de Cuidados Intensivos.","Hospitalización corta con seguimiento domiciliario.","Seguimiento ambulatorio con control domiciliario.","Observación y vigilancia en sala de emergencias."],"ans":[0],"fix":0},{"id":227,"page":85,"q":"Un recién nacido de 1 día de vida es valorado en el servicio de neonatología porque presenta mucha salivación y su madre refiere que vomita todo lo que come. Antecedentes prenatales: su madre no se realizó chequeos, ni ecografías hasta el momento del parto. Antecedentes natales: producto de parto vaginal espontáneo a las 39 semanas de gestación, peso: 2400 g, Apgar 8 – 9 al nacimiento y a los 5 minutos respectivamente. Al examen físico FC: 140/min, FR 45/min, paciente irritable, con hambre, abundante sialorrea, se intenta colocación de sonda orogástrica sin éxito. Radiografía de tórax con medio de contraste evidencia saco esofágico proximal, sin comunicación con el estómago. ¿Qué cuadro probable presentó la madre del paciente durante el embarazo?","opts":["Polihidramnios.","Oligohidramnios.","Infección por Rubéola.","Ingesta de Talidomida."],"ans":[0],"fix":0},{"id":228,"page":86,"q":"Mujer de 21 años acude a urgencias con labor de parto. Niega antecedentes médicos de importancia. Gestas 2 Parto 1 Aborto 0. Embarazo actual de 39 semanas por fecha de última menstruación. Al examen físico presenta tensión arterial 120/80 mmHg, frecuencia cardíaca 74 latidos por minuto, frecuencia respiratoria 16 por minuto. Abdomen: suave, depresible, no doloroso. Fondo uterino acorde a edad gestacional. Feto único, cefálico. Frecuencia cardíaca fetal: 100 latidos por minuto mantenida. Tacto vaginal: dilatado 6 cm, borrado 70 %. Actividad uterina 1 en 10 minutos repetida en 1 hora. La evaluación a los 30 minutos no evidencia cambios en frecuencia cardíaca fetal, actividad uterina y tacto vaginal. Monitoreo fetal: frecuencia cardíaca fetal: 100 latidos por minuto, desaceleraciones tardías, sin variabilidad. ¿Cuál es el manejo inicial más apropiado para esta paciente?","opts":["Cesárea.","Conducción del parto.","Inducción del parto.","Evolución espontánea."],"ans":[0],"fix":0},{"id":229,"page":86,"q":"Mujer de 40 años, que acude al servicio de emergencia por dolor abdominal, hace 24 horas localizado en mesogastrio, tipo cólico, de moderada intensidad (7/10), náusea, vómito por varias ocasiones en poca cantidad (50 ml), poliurea, sed. Antecedente: Diabetes mellitus 2 en tratamiento con insulina. Examen físico: presión arterial: 90/60 mmHg, frecuencia cardíaca: 107 por minuto. Paciente: somnolieta, Glasgow: 15/15. Boca: Mucosas orales secas, aliento afrutado, respiración de Kussmaul, Abdomen: suave, depresible, doloroso a la palpación profunda en mesogastrio, ruidos hidroaéreos presentes. Laboratorio: Glucosa: 300 mg/dl. Na: 135 mEq/l, K: 5mEq/L. Cl: 90 mEq/L. GSA: pH: 7, PCO2: 25 mmHg. Bicarbonato: 12 mEq/L. Anión gap: 28. Osmolaridad plasmática: 290 mOsm/L. EMO: nitritos: positivos piocitos: campo lleno, hematíes: campo lleno, bacterias:+++. ¿Cuál es el diagnóstico más probable?","opts":["Cetoacidosis diabética.","Diabetes mellitus 2 descompensada.","Estado hiperosmolar hiperglucémico.","Pancreatitis aguda."],"ans":[0],"fix":0},{"id":230,"page":87,"q":"Hombre de 35 años acude a emergencias tras caída desde su propia altura sobre el brazo derecho en extensión y separado del cuerpo, con posterior dolor de hombro derecho de 30 minutos de evolución. Es la segunda vez que presenta un cuadro clínico similar. No traumatismo craneal, ni pérdida de conocimiento tras la caída. Al examen físico, los signos vitales están dentro de la normalidad. Miembro superior derecho: en rotación externa y signo de charretera con pulsos distales y fuerza conservadas. Resto de la exploración normal. ¿Cuál es la principal lesión responsable de la recidiva en este paciente?","opts":["Bankart.","Hill-Sachs.","Mack Laughlin.","Neer."],"ans":[0],"fix":0},{"id":231,"page":87,"q":"Le invitan a participar como investigador para una molécula que ha demostrado resultados favorables en animales para bajar la presión arterial. El estudio se encuentra en fase clínica y se ha decidido comenzar la administración del fármaco en personas residentes en un barrio urbano que tengan hipertensión arterial no controlada. Luego de culminar esta fase, se tiene previsto administrar el fármaco, en doble ciego, y compararlo con el tratamiento de primera línea estipulado en la guía local para esta patología. Usted decide no participar ya que el diseño vulnera principios éticos por haberse saltado una de las fases de la investigación. ¿Qué fase no se desarrolló en este caso?","opts":["Fase I","Fase IV","Fase II","Fase III"],"ans":[0],"fix":0},{"id":232,"page":88,"q":"Una mujer 31 años, acude a emergencias por cefalea de intensidad 10/10, de inicio súbito (2 horas de evolución), desencadenada por esfuerzo en la mañana. Se acompaña de náusea, niega otra sintomatología. Niega antecedentes clínicos relevantes. Al examen físico TA 130/80 mm Hg, pulso 83 por minuto, temperatura 36.8 °C, diaforética, álgida, consciente, orientada en las tres esferas, pupilas isocóricas normoreacticas, diplopía horizontal. Al examen fondo de ojo hay edema de papila. No se cuenta con estudios de imagen en el establecimiento. Tomando en cuenta la clínica de la paciente. ¿Cuál es el diagnóstico más probable?","opts":["Hemorragia subaracnoidea","Migraña con aura","Cefalea tensional","Cefalea en racimos"],"ans":[0],"fix":0},{"id":233,"page":88,"q":"Mujer de 83 años, acude al servicio de urgencias por presentar sin causa aparente, pérdida súbita de la agudeza visual del ojo derecho, cefalea en región occipital 8/10 en escala de EVA, labilidad emocional. Antecedente de fibrilación auricular para lo toma anticoagulante en forma irregular. Exámen físico: TA: 120/80 mmHg, frecuencia cardíaca 80 latidos por minutos, frecuencia respiratoria 12 por minuto, hemianopsia homónima derecha, la paciente puede escribir correctamente una frase que se le dicta, pero no puede leerla. El resto del examen físico es normal. ¿Qué arteria estaría afectada por obstrucción?","opts":["Arteria cerebral posterior.","Arteria cerebral media.","Arteria coroidea anterior.","Arteria basilar."],"ans":[0],"fix":0},{"id":234,"page":89,"q":"Niño de 5 años es llevado al servicio de emergencias por presentar cuadro clínico de 6 días de evolución con fiebre muy alta que no cede a la administración de paracetamol. No refiere antecedentes personales de importancia y tiene las inmunizaciones para la edad. Al examen físico: FC: 135 /min, FR: 23/min, temperatura 39.6 °C. Presenta inyección conjuntival no exudativa bilateral, los labios están eritematosos, secos y agrietados, y la lengua es de color rojo brillante. Tiene una erupción polimorfa no vesicular en el tronco. Sus manos y pies están edematosos y sus palmas y plantas están eritematosas. ¿Cuál es el diagnóstico más probable del paciente?","opts":["Enfermedad de Kawasaki.","Infección por adenovirus.","Escarlatina.","Sarampión."],"ans":[0],"fix":0},{"id":235,"page":89,"q":"Varón de 35 años atendido en consulta externa por vértigo. El episodio dura menos de un minuto y se genera por movimientos de la cabeza (rotar en la cama). Refiere cuadro similar hace un año, mismo que cedió espontánemamente sin dejar secuelas. Niega síntomas visuales o auditivos asociados. Niega antecedentes médicos de importancia. Al examen físico: tensión arterial 130/80 mmHg, frecuencia cardíaca 72 latidos por minuto, frecuencia respiratoria 16 por minuto. Nistagmo horizontal cuando el paciente está en decúbito lateral, de ambos lados. Usted sospecha la presencia de otoconías como agente etiológico del cuadro clínico. ¿Cuál es el tratamiento de primera elección para este paciente?","opts":["Maniobras de sustitución de Epley.","Corticoides orales.","Antiinflamatorios no esteroidales.","Restricción de sodio y diuréticos."],"ans":[0],"fix":0},{"id":236,"page":90,"q":"Mujer de 34 años, primigesta de 37 semanas con controles prenatales y ecografías normales. Acude a emergencia por cefalea persistente y edema en sus manos. Antecedentes: sin importancia. Al examen físico presenta: FC: 74/min, FR: 21/min, temperatura 36 °C, TA: 160/110 mmHg durante dos ocasiones con un intervalo de 15 minutos en el mismo brazo. Abdomen gestante con fondo uterino a término, feto único móvil, en presentación cefálica y con frecuencia cardiaca fetal (FCF): 155/min. Tacto vaginal: cérvix posterior cerrado. Los exámenes complementarios muestran: proteínas en orina ++ mediante tira reactiva. Plaquetas 210 000/uL, TGO 32 UI/L, TGP 30 UI /L, creatinina sérica 0.7 mg/dL. ¿Cuál es el tratamiento de elección para prevenir convulsiones en esta paciente?","opts":["Sulfato de magnesio.","Nifedipino.","Labetalol.","Hidralazina."],"ans":[0],"fix":0},{"id":237,"page":90,"q":"Paciente de 75 años que consulta por tumoración en la región supraclavicular izquierda de 1 mes de evolución con pérdida de peso, palidez, anorexia cansancio, relata haber tenido coronariopatía diagnosticada por el médico hace 3 años, y entre la medicación recibida consta aspirina, clopidrogel, omeprazol y valsartan, entre los que recuerda. Examen de laboratorio revela: Hemoglobina 9 g/dl; Hematocrito 29 %; PCR 1.5 mg/l; Creatinina 1.09 mg/dl. ¿Cuál de los siguientes síntomas y signos relatados y encontrados en el examen físico, es la mejor opción que se relacione con metástasis por cáncer gástrico?","opts":["Presencia del ganglio de Virchow","Anemia","Melena","Hematemesis"],"ans":[0],"fix":0},{"id":238,"page":91,"q":"Varón de 25 años acude a consulta externa para revisión de exámenes por estudio de enfermedad de transmisión sexual. No refiere antecedentes médicos de importancia. Indica tener vida sexual activa con 2 parejas heterosexuales y no refiere la práctica de sexo anal. Al examen físico los signos vitales se encuentran normales. En área genital se evidencia úlcera no dolorosa con adenopatías alrededor de la zona. Laboratorio: Creatinina 1 mg/dL; VDRL positivo, Prueba de reagina plasmática rápida positiva (títulos 1:32). Examen de orina: nitritos y esterasa leucocitaria negativos. Cultivo de orina negativo. HIV: negativo. ¿Cuál es el fármaco de elección para este paciente?","opts":["Betalactámicos.","Macrólidos.","Trimetoprim sulfametoxazol.","Aminoglucósidos."],"ans":[0],"fix":0},{"id":239,"page":91,"q":"Varón de 60 años, atendido en consulta externa por edema de miembros inferiores. Refiere que 3 semanas antes de su molestia inició tratamiento farmacológico para hipertensión arterial. No presenta reacciones alérgicas medicamentosas conocidas. Al examen físico presenta: tensión arterial de 140/90 mmHg, temperatura 37 °C, frecuencia cardíaca de 80 latidos por minuto, frecuencia respiratoria 16 latidos por minuto, Sat O2 aire ambiente 94 %. Exploración cardiopulmonar normal. Miembros inferiores: pulsos distales presentes, edema maleolar bilateral +/+++, sin fóvea. ¿Cuál es el fármaco causante del efecto adverso en este paciente?","opts":["Amlodipina.","Enalapril.","Losartán.","Clortalidona."],"ans":[0],"fix":0},{"id":240,"page":92,"q":"Mujer de 60 años acude a urgencias por lesión cutánea en el tórax. Indica que hace 48 horas inició con dolor en el área afectada y posteriormente aparecen lesiones eritematosas pruriginosas en la piel. Niega antecedente de inmunodepresión. Al examen físico: tensión arterial 120/80 mmHg, frecuencia cardíaca 100 latidos por minuto, frecuencia respiratoria 14 por minuto. Temperatura 37,2 °C. Tórax anterior derecho: múltiples lesiones vesiculares sobre un fondo eritematoso y con costra circunscritas al dermatoma T5. Cardiopulmonar: normal. Neurológico: sin focalidad. Resto de la exploración normal. ¿Cuál es el diagnóstico más probable?","opts":["Herpes zóster.","Varicela - zóster.","Panadizo herpético.","Síndrome de Ramsay Hunt."],"ans":[0],"fix":0},{"id":241,"page":92,"q":"Mujer de 51 años acude a consulta para revisión del resultado de mamografía. Se encuentra asintomática. Antecedentes: Gestas 4. Partos 3. Abortos 1. FUM: hace 3 meses. Madre y hermana con cáncer de mama. Al examen físico presenta: TA: 110/70 mmHg, FC: 76 lpm, T: 36 °C. Exploración física general dentro de la normalidad, incluido el examen mamario. La mamografía reporta BI-RADS 1. ¿Cuál es la estrategia de seguimiento más adecuada para esta paciente?","opts":["Mamografía anual.","Ecografía mamaria bianual.","Prueba triple.","Autoexamen mamario."],"ans":[0],"fix":0},{"id":242,"page":92,"q":"Mujer de 30 años acude a consulta externa para evaluar métodos de planificación familiar. Paciente en 3 semanas postparto y desea mantener la lactancia. En el momento actual se encuentra asintomática. Antecedentes: embarazo ectópico hace 2 años. Gestas 2. Partos 1. Abortos 0. Pareja sexual estable. Al examen físico: los signos vitales son normales, al igual que la exploración general. ¿Cuál es el método anticonceptivo de elección para esta paciente?","opts":["Progestágenos solos.","Estrógenos con progestágenos.","Dispositivo intrauterino con levonorgestrel.","Método del ritmo."],"ans":[0],"fix":0},{"id":243,"page":93,"q":"Mujer de 33 años acude a consulta externa por intolerancia al frío, ganancia de peso y amenorrea desde hace 3 meses. Niega otra sintomatología asociada. Hace 3 meses los ciclos menstruales eran cada 28 a 35 días y con una duración de 4 a 7 días. Antecedentes médicos: sin importancia. Gineco-obstétricos: Gestas 2. Partos 1. Abortos 1. Vida sexual activa con pareja estable y usa preservativo como anticonceptivo. Examen físico: TA: 110/80 mmHg, FC: 54 lpm. T: 36 °C normales. IMC: 29 kg/m2. Resto de la exploración general normal. Los exámenes complementarios muestran: gonadotropina coriónica humana sérica (hCG): 2 mIU /mL, FSH 15 UI/L (4.7 a 21.5), LH 10 UI/L (1.68 a 15), TSH 13 mUI/L (0.37 a 4.7). Prolactina 15 ng/ml. ¿Cuál es el diagnóstico más probable?","opts":["Hipotiroidismo.","Amenaza de aborto.","Menopausia precoz.","Amenorrea primaria."],"ans":[0],"fix":0},{"id":244,"page":93,"q":"Paciente de 5 años, con antecedentes de atopía. Presenta desde hace 2 horas: rinorrea, tos, disfagia; temperatura de 38.3 °C; estridor ++. Laboratorio: Biometría hemática: Hb: 13.4 mg/dl: Hcto: 42 %; Leucocitos 9.800/mm3; Linfocitos 73 %; Monocitos 7 %; Neutrófilos 20 %. ¿Cuál es su diagnóstico presuntivo?","opts":["Croup espasmódico.","Laringotraqueitis viral.","Epiglotitis.","Traqueítis bacteriana."],"ans":[0],"fix":0},{"id":245,"page":94,"q":"Mujer de 25 años acude a urgencias por mastalgia. Gestas 1, Partos 1, Abortos 0. Paciente acude a 3 semanas de parto vaginal sin complicaciones. Refiere 72 horas de evolución de dolor en mama derecha y dificultad para amamantar a su bebé. Alergia documentada a la penicilina. Examen físico: Tensión arterial 120/80 mmHg, frecuencia cardíaca 90 latidos por minuto, frecuencia respiratoria 14 por minuto, T 38.4 °C. Mama derecha: Dura, turgente con eritema externo, no evidencia supuración. Laboratorio: Cultivo: S. aureus meticilino sensible. ¿Cuál es el tratamiento de elección para esta paciente?","opts":["Clindamicina.","Dicloxacilina.","Trimetoprim sulfametoxazol.","Ciprofloxacina."],"ans":[0],"fix":0},{"id":246,"page":94,"q":"Varón de 61 años acude a consulta externa para evaluación preoperatoria por hernia umbilical. Antecedente de cirrosis hepática en tratamiento clínico con espironolactona. Niega hábitos tabáquico y alcohólico actual. Examen físico: Tensión arterial 120/80 mmHg, frecuencia cardíaca 90 latidos por minuto, frecuencia respiratoria 16 por minuto, IMC 22 Kg/m2. Somnoliento, confuso. Abdomen: onda ascítica. Hernia umbilical no reducible. Telangiectasias periféricas. Laboratorio: Bilirrubina 3.2 mg/dL, Albumina 2.2 g/L. Tiempo de protrombina: 28 segundos. INR 2.4. ¿Cuál es el diagnóstico de estratificación preoperatoria para este paciente?","opts":["Child Pough C.","Child Pough B.","Child Pough A.","Encefalopatía estadio II."],"ans":[0],"fix":0},{"id":247,"page":95,"q":"Madre soltera analfabeta de 25 años. Está dudosa de participar en una investigación del Subcentro de Salud de su comunidad que iniciará mañana. Los investigadores le han indicado de manera oral que se trata de obtener el “Coeficiente de correlación de la translocación axial de los eslabones 1821 de la cadena isométrica del gen 88” y que los resultados servirán para resolver definitivamente los problemas COVID de su comunidad. Le han garantizado que por su participación recibirá doble dosis de complemento alimentario para su hija, así como un cuidado más esmerado de su salud y que al terminar el estudio se le acreditará un bono de $150. ¿Cuáles son los principios bioéticos de la investigación que se hallan evidentemente comprometidos?","opts":["No maleficencia; autonomía.","Beneficencia; autonomía.","Justicia; beneficencia.","Valor; autonomía."],"ans":[0],"fix":0},{"id":248,"page":95,"q":"Varón de 15 años, evaluado en urgencias por accidente de tránsito. Niega antecedentes médicos de importancia. Evento se da como acompañante de vehículo, no usaba cinturón de seguridad. Examen físico: Tensión arterial 130/80 mmHg, frecuencia cardíaca 110 latidos por minuto, frecuencia respiratoria 18 por minuto. Extremidad inferior derecha: deformidad en muslo con lesión abierta y pérdida de continuidad de la piel con exposición de músculo y hueso. Rx: fractura abierta grado IIIb de fémur asociada a fractura bifocal de tibia ipsilateral cerrada (rodilla flotante). ¿Qué tipo de herida quirúrgica se planifica para este paciente?","opts":["Contaminada.","Limpia.","Limpia/contaminada.","Sucia."],"ans":[0],"fix":0},{"id":249,"page":96,"q":"Varón de 68 años acude a consulta externa por rectorragia. Chofer profesional. Antecedente de diagnóstico por anoscopia de hemorroides hace 6 meses recibe tratamiento que no especifica. No cumple medidas de tratamiento no farmacológico prescritas. Examen físico: Tensión arterial 120/80 mmHg, frecuencia cardíaca 80 latidos por minuto, frecuencia respiratoria 14 por minuto, T 37 °C. IMC 31 Kg/m2. Tacto rectal: tono esfínter normal, no masas o nódulos, paquetes venosos que se reducen de forma manual. Borde anal y área perineal sin patología. No presencia de fisuras o fístulas. No sangrado activo. ¿Cuál es el diagnóstico de las hemorroides de este paciente?","opts":["Internas: Tercer grado.","Externas.","Internas: Primer grado.","Internas: Segundo grado."],"ans":[0],"fix":0},{"id":250,"page":96,"q":"Infante de 15 meses con diagnóstico presuntivo de obstrucción de vías respiratorias por cuerpo extraño. El médico tratante ha sugerido un procedimiento radiológico bajo anestesia del infante. Los padres del infante son ambos menores de edad emancipados en unión estable, ambos con educación primaria. ¿Quién debe firmar el","opts":["Profesional y padre o madre.","Padre o madre.","Ambos progenitores.","Abuelos."],"ans":[0],"fix":1},{"id":251,"page":97,"q":"Se presenta el caso de un paciente de 58 años, residente de Quito, que acude por una lesión en la punta de la nariz. La lesión apareció hace dos meses aproximadamente, inicialmente como una descamación pruriginosa con un área deprimida central que ahora se observa como una costra que sangra ocasionalmente. Si bien la lesión no ha crecido mayormente, tampoco ha mejorado, por lo que acude. No refiere antecedentes patológicos de relevancia o síntomas acompañantes. Al examen físico se observa una lesión papular de 2cm con borde descamativo y color perlado. En el centro de la lesión se observa una úlcera central de 3mm, ligeramente deprimida y con centro hemorrágico. ¿Cuál sería el procedimiento diagnóstico más recomendado en este caso?","opts":["Biopsia por escisión.","Dermatoscopia.","Identificación de anticuerpos antinucleares (ANA) en sangre.","Prueba de KOH."],"ans":[0],"fix":0},{"id":252,"page":97,"q":"Una mujer de 23 años acude a la consulta por presentar dolor y ardor al orinar desde hace 24 horas. Se acompaña de escalofríos, náusea que no llega al vómito y dos deposiciones diarréicas, sin moco ni sangre. La paciente no tiene antecedentes de importancia. Al examen físico la temperatura es de 38.2 °C; FC: 100/ min; TA: 90/60 mmHg. El abdomen es plano, suave, depresible, puño percusión positiva en fosa lumbar izquierda. El hemograma evidencia leucocitos de 16 000/mm cúbico, hemoglobina 16.3 g/d. Con este cuadro. ¿Cuál sería el diagnóstico más probable?","opts":["Pielonefritis aguda.","Uretritis.","Cistitis.","Litiasis renal."],"ans":[0],"fix":0},{"id":253,"page":97,"q":"En un paciente con urticaria. ¿Cuál es el medicamento adecuado para el tratamiento inicial?","opts":["Desloratadina.","Betametasona.","Hidroxicina.","Ranitidina."],"ans":[0],"fix":0},{"id":254,"page":98,"q":"Niño de 10 años es traído a la emergencia por su madre por presentar dolor abdominal. El dolor empezó hace 24 horas, sin causa aparente, y se localizó inicialmente en el epigastrio siendo constante y aumentando progresivamente de intensidad hasta alcanzar 8/10. El dolor se acompaña de vómito de contenido alimentario por 3 ocasiones; diarrea por 2 ocasiones, acuosas, también por pérdida del apetito y fiebre. Al cabo de 6 horas el dolor se irradió al cuadrante inferior derecho del abdomen que es el sitio del dolor al momento. El niño no tiene antecedentes patológicos personales ni familiares de importancia. Al examen físico la temperatura es 37.8 °C; FC: 92 /min; FR: 16/min; TA: 110/60 mmHg. El paciente muestra facies de dolor, se encuentra en posición fetal. El abdomen es plano levemente doloroso a la palpación superficial e intensamente doloroso a la palpación y profunda en la fosa ilíaca derecha. Hay dolor de rebote limitado a la fosa ilíaca y el signo de Rovsing es positivo. Los exámenes revelaron: leucocitos 16 000 /mm3, neutrófilos 50 %, linfocitos 50 %, plaquetas 350 000 /mm3, Proteína C reactiva (PCR) 9 mg/l. ¿Cuál es el diagnóstico más probable?","opts":["Apendicitis aguda flegmonosa.","Apendicitis aguda hiperémica, inicial.","Apendicitis y peritonitis generalizada.","Gastroenteritis aguda."],"ans":[0],"fix":0},{"id":255,"page":98,"q":"¿Cuál es la causa de delirio en pacientes geriátricos que se asocia a tasas altas de mortalidad?","opts":["Infecciones del Sistema Nervioso Central.","Crisis epilépticas.","Insuficiencia renal.","Estrés postraumático."],"ans":[0],"fix":0},{"id":256,"page":98,"q":"De las siguientes patologías. ¿Cuál es causa de Balanitis infecciosa?","opts":["Balanitis por protozoos.","Balanitis plasmocelular.","Balanitis xerótica Obliterans.","Balanitis Seudoepiteliomatosa."],"ans":[0],"fix":0},{"id":257,"page":99,"q":"Hombre de 29 años acude a emergencias por dolor abdominal difuso tipo cólico, de 12 horas de evolución, acompañado de náuseas sin vómitos ni alteración del ritmo intestinal. Antecedentes: desde hace 1 año presenta períodos intermitentes de dolor abdominal tipo cólico en hemiabdomen inferior, diarrea sin moco ni sangre y pérdida de peso. No refiere intervenciones quirúrgicas ni endoscópicas recientes, ni viajes a áreas tropicales. Tiene un hermano con enfermedad inflamatoria intestinal. A la exploración física presenta: TA: 100/70 mmHg, FC: 115 lpm, T: 38 ºC, FR: 19 rpm. Cardiopulmonar: normal. Abdomen: distendido, ruidos hidroaéreos disminuidos, doloroso de forma difusa a la palpación profunda y signos de irritación peritoneal positivos. En la radiografía de tórax PA se observa aire libre en la cavidad peritoneal. ¿Cuál es la causa más probable del cuadro que presenta el paciente?","opts":["Enfermedad de Crohn.","Iatrogénica.","Enteritis tifoidea.","Divertículos duodenales."],"ans":[0],"fix":0},{"id":258,"page":99,"q":"Paciente adolescente que dice mentiras para abordar conflictos, que roba dinero y comida, sale de la casa sin permiso, vagabundea, tiene historia de acoso escolar con agresión verbal y física hacia sus compañeros de clase. Señale el tipo de trastorno que presenta:","opts":["Del control de los impulsos.","De la atención con hiperactiv ":110,"q":"Una paciente de 32 años se presenta en la emergencia del hospital local con sangrado genital. La paciente cursa la décima semana de su cuarto embarazo habiendo terminado los otros tres en abortos espontáneos. Sus antecedentes patológicos personales son importantes por un cuadro de embolia pulmonar a los 28 años y dos episodios de trombosis venosa profunda a los 22 y 26 años. Su FC: 80/min; FR: 14 /min; T: 37 grados C; TA: 100/70 mmHg. Su índice de masa corporal es de 22. El examen físico es normal excepto por la visualización del cuello uterino abierto y con sangrado activo. ¿Cuál de los siguientes resultados es el que encontrará con mayor probabilidad?","opts":["Positividad de anticuerpos anticardiolipina","Trombocitosis por encima de 500.000 por mm3","Hiperfibrinogenemia","INR de 0,7"],"ans":[0],"fix":1},{"id":285,"page":110,"q":"Mujer de 28 años, acude a sala de emergencias por presentar palpitaciones y sudoración, acompañada de gran angustia y desasosiego, crisis de 10 minutos de duración. No tiene náuseas, no presenta vómitos ni otra sintomatología. Niega consumo de fármacos. Antecedentes: Cuadros similares de angustia por diferentes motivos en 5 ocasiones. No fuma, no consume alcohol ni otras sustancias. Su exploración física no presenta alteraciones: TA: 125/80; FC: 90 lpm. T: 36.5ºC, FR: 20 rpm. Consciente y orientada en las tres esferas. Glicemia: normal. Electrocardiograma: normal. ¿Cuál es el diagnóstico inicial más probable?","opts":["Crisis de pánico.","Intento autolítico.","Agitación psicomotriz.","Delirium tremens."],"ans":[0],"fix":0},{"id":286,"page":110,"q":"¿Cuál es la causa de infección urinaria complicada?","opts":["Disinergia del detrusor.","Hiperplasia prostática benigna.","Circuncisión.","Retención urinaria postoperatoria."],"ans":[0],"fix":0},{"id":287,"page":111,"q":"Un varón de 28 años acude a la emergencia por presentar dolor en la región lumbar derecha. El dolor es de inicio súbito y comenzó hace aproximadamente 4 horas. El dolor ha ido incrementando en intensidad y actualmente refiere que éste es de tipo cólico, irradiándose hacia la región inguinal derecha. No hay disuria, sin embargo, hay presencia de hematuria. Sus antecedentes personales incluyen enfermedad de Crohn desde hace 9 años. No consume alcohol ni tabaco. Al examen físico la TA es de 140/90 mm Hg; FC: 98/min; FR: 23/min; T: 36.7 °C. El paciente está intranquilo, con dolor intenso, observándose dolor en la puño percusión en la región lumbar derecha. El resto del examen físico es normal. El hemograma, electrolitos, glucosa, ácido úrico, albúmina, urea y creatinina son normales. La URO-TAC sin contraste muestra una lesión hiperdensa ubicada en medio del uréter derecho. ¿Cuál de las siguientes opciones explica con mayor probabilidad la causa de obstrucción en este paciente?","opts":["Aumento de la excreción urinaria de oxalato.","Aumento del pH urinario por presencia de bacterias productoras de ureasa.","Aumento de la excreción urinaria de cistina.","Aumento de la ingesta de productos lácteos."],"ans":[0],"fix":0},{"id":288,"page":111,"q":"Juan de 13 años, sufre traumatismo nasal agudo mientras juega fútbol, es valorado en el centro de salud por epistaxis de fosa nasal izquierda y deformidad del dorso nasal, al ceder la epistaxis, le prescriben ibuprofeno 600 mg cada 8 horas durante 3 días y hielo local. A los 3 días presenta equimosis y edema nasal y palpebral izquierdo, dolor en la zona con obstrucción nasal que no le deja respirar bien. No fiebre. A la exploración se aprecia edema y abombamiento de la mucosa del tabique nasal, la Rx muestra fractura de huesos propios nasales no desplazada. ¿Cuál es la complicación más frecuente que presenta Juan al no ser diagnosticado y tratado precozmente?","opts":["Hematoma septal.","Absceso septal.","Necrosis septal.","Retracción de la columela."],"ans":[0],"fix":0},{"id":289,"page":112,"q":"Indique la familia a la cual pertenece el virus que produce el molusco contagioso y su tiempo de incubación.","opts":["Poxviridae, 2 a 7 semanas.","C. trachomatis, 1 a 2 semanas.","Herpesviridae, de 3 a 5 semanas.","Virus del papiloma humano, 8 a 12 semanas."],"ans":[0],"fix":0},{"id":290,"page":112,"q":"Paciente de 6 años que como resultado de hurgarse las narices presenta unas lesiones epidérmicas no cicatriciales, bien delimitadas, localizadas en la zona perinasal y peribucal, que han evolucionado a vesículas y ampollas con contenido amarillento, más o menos turbio e incluso purulento, y con una costra fina. ¿Cuál es el diagnóstico?","opts":["Impétigo.","Escarlatina.","Erisipela.","Celulitis."],"ans":[0],"fix":0},{"id":291,"page":112,"q":"El síndrome de insuficiencia respiratoria aguda en el embarazo, comienza con una lesión pulmonar aguda producida por diversas causas. La más frecuente es la septicemia. Seleccione la opción con las causas más comunes de septicemia en el embarazo:","opts":["Infección pélvica puerperal, corioamnionitis y pielonefritis.","Infección dental, cistitis y neumonía bacteriana.","Infecciones dérmicas como erisipela y gastroenteritis.","Salmonelosis, malaria y amebiasis."],"ans":[0],"fix":0},{"id":292,"page":113,"q":"Se presenta el caso de un paciente de 57 años que busca dejar de consumir alcohol. Refiere que inició su consumo en la adolescencia y ha aumentado progresivamente, al punto de consumir la sustancia todos los días en los últimos 5 años. Su consumo le ha generado problemas en el trabajo, con su familia y recientemente le han diagnosticado de hígado graso, por lo que pide ayuda. El paciente se encuentra nervioso ya que no ha bebido en cuatro días y presenta temblores, nauseas constantes y vómito ocasional de contenido gástrico. No refiere otros síntomas acompañantes. ¿Qué medida terapéutica sería la más recomendable en este caso?","opts":["Hidratación, suplementación de tiamina y observación","Tratamiento con clordiazepóxido","Hospitalización para observación y sujeción en caso de ser necesario","Tratamiento con disulfiram"],"ans":[0],"fix":0},{"id":293,"page":113,"q":"Paciente de 45 años, asintomático, sin antecedentes de interés, realiza ciclismo habitual 2 a 3 veces por semana, acude con resultado de PSA (Antígeno Prostático Específico) de 4.2 ng/ml, que se ha realizado por su cuenta. Hace 1 año tenía PSA de 1.5 ng/ml. ¿Cuál es la conducta más adecuada?","opts":["Repetir el PSA dentro de 1 mes sin realizar ejercicios físicos vigorosos durante al menos 2 días antes del examen.","Realizar examen rectal digital y al siguiente día repetir el PSA porque se ha elevado en más de 0.75 U/año.","Realizar el PSA de control en 1 año porque los valores están dentro de la normalidad y actualmente está asintomático.","Realizar tacto rectal seguido de análisis del PSA y su cociente porque tiene riesgo para cáncer de próstata."],"ans":[0],"fix":0},{"id":294,"page":114,"q":"Hombre de 38 años, acude a la emergencia por epigastralgia intensa (EVA 10/10) de 6 horas de evolución, de inicio repentino. No náuseas, no vómitos, ni fiebre. Antecedentes: lumbalgia crónica que precisa ingesta de diclofenaco sódico 50 mg tres veces al día durante 2 semanas. Hace 1 mes le realizaron una endoscopia digestiva alta, donde se evidenció una úlcera duodenal y le prescribieron tratamiento que no tomó. Al examen físico presenta: Facies álgica. Consciente y orientado en las tres esferas. TA: 115/72 mmHg; FC: 96 lpm; FR: 20 rpm. T: 36 °C. Cardiopulmonar: normal. Abdomen: RHA disminuidos, tenso, poco depresible, doloroso a la palpación superficial y profunda en epigastrio, reacción peritoneal a la descompresión en todos los cuadrantes. Tacto rectal: no doloroso a la digitopresión, esfínter normotónico, ampolla con heces marrón claro, no se objetivan tumoraciones ni signos de sangrado activo. Resto de la exploración normal. ¿Cuál es el diagnóstico más probable que presenta el paciente?","opts":["Perforación de úlcera péptica.","Obstrucción por úlcera péptica.","Úlcera péptica hemorrágica.","Enfermedad úlcera péptica intratable."],"ans":[0],"fix":0},{"id":295,"page":114,"q":"Según los rangos de peso propuestos, identifique el grupo en que se encuentran los recién nacidos prematuros con bajo peso al nacer:","opts":["De 1500 g a 2500 g.","De 500 g a 1000 g.","1000 g a 1500 g.","Menos de 500 g."],"ans":[0],"fix":0},{"id":296,"page":114,"q":"¿Cuál es el tratamiento prioritario e inicial en la atención de un paciente con Pancreatitis Aguda independientemente de la causa o la gravedad?","opts":["Solución cristaloide isotónica.","Inhibidor del factor activador de plaquetas.","Antiproteasas.","Inhibidores de la secreción pancreática."],"ans":[0],"fix":0},{"id":297,"page":115,"q":"Niño de 8 años consulta por rinorrea y dificultad para respirar. Su madre refiere que el cuadro se ha presentado en varios episodios y ahora se exacerba por exposición a mascota. No tiene antecedentes médicos de importancia. Al examen físico: tensión arterial 100 / 60 mmHg, frecuencia cardiaca 80 por minuto, frecuencia respiratoria 16 por minuto, saturación 94 % con Fi O2 21 %. Temperatura 36 °C. Cornetes nasales pálidos con secreciones acuosas transparentes. Goteo retronasal. Sin otros hallazgos de relevancia. ¿Cuál es el tratamiento de primera elección para este paciente?","opts":["Mometasona intranasal.","Difenhidramina oral.","Bromuro de ipratropium en inhalador.","Azelastina intranasal."],"ans":[0],"fix":0},{"id":298,"page":115,"q":"Paciente de 29 años, con embarazo de 34 semanas. Acude al servicio de emergencia por presentar convulsiones tónico clónicas por 1 ocasión hace 2 horas. A la exploración física: TA: 140/80 mmHg, FR: 17 por minuto, T: 36.7 °C, FC: 84 latidos por minuto. Se ausculta frecuencia cardiaca fetal de 150 latidos por minuto. Los exámenes complementarios muestran: proteinuria con tira reactiva negativa, plaquetas 200 000 / uL, TGO 30 UI / L, TGP 35 UI / L, creatinina sérica 0.8 mg / dL, LDH 250 UI / L, Hb 13 g/dL, Hcto 42 %. Familiar refiere que la paciente nunca antes a convulsionado, en este caso. ¿Cuál es el diagnóstico?","opts":["Eclampsia.","Preeclampsia con signos de gravedad.","Epilepsia.","Síndrome de HELLP."],"ans":[0],"fix":0},{"id":299,"page":116,"q":"Lactante de 4 meses presenta tos y rinorrea abundante desde hace dos días. Desde esta mañana tiene dificultad para respirar. Nació a término de peso adecuado para la edad gestacional. Lactancia mixta. Examen físico: afebril, buen estado general. Bien nutrido e hidratado. No tiene alteraciones cutáneas. Relleno capilar menor de 2 segundos. Rinorrea abundante, tiraje subcostal e intercostal leves, frecuencia respiratoria 48 rpm. Auscultación cardiaca: rítmica, soplo sistólico I/VI. Auscultación pulmonar: buena ventilación bilateral, sibilancias espiratorias difusas en ambos campos pulmonares, temperatura: 36.8 ºC. SO2: 95 %. ¿Cuál es la mejor indicación para este paciente?","opts":["Aseo nasal, explicar signos de alarma y citar en 48 horas.","Azitromicina 10 mg/kg/ día x 3 días y explicar signos de alarma.","Remitir a Urgencias para Rx de tórax y exámenes de laboratorio.","Remitir a Urgencias para antibioticoterapia y broncodilatación."],"ans":[0],"fix":0},{"id":300,"page":116,"q":"¿Qué medicamento usado en el tratamiento del síndrome nefrótico ocasiona cataratas e hipertensión arterial en los niños?","opts":["Corticoides.","Diuréticos.","Hipolipemiantes.","Anticoagulantes."],"ans":[0],"fix":0},{"id":301,"page":116,"q":"Paciente de 5 años, pesa 20 kg. Presenta epigastralgia postprandial moderada seguida de diarreas, 3 o 4 veces al día, líquidas, abundantes, explosivas, blanquecinas, espumosas, esteatorréicas, mal olientes y con restos alimentarios. Flatulencia intensa. Buen estado general. El abdomen algo abombado y timpánico. ¿Cuál es el diagnóstico más probable y su tratamiento?","opts":["Giardiasis, metronidazol suspensión de 250 mg / 5 ml, tomar 2.0 ml TID, 5 días.","Amebiasis, metronidazol suspensión de 250 mg / 5 ml, tomar 5 ml TID, 10 días.","Enterobiasis, albendazol 200 mg, una sola dosis.","Ascaridiasis, albendazol 400 mg en una sola toma."],"ans":[0],"fix":0},{"id":302,"page":117,"q":"Identifique el patrón de resultados que se corresponde con anemia ferropénica:","opts":["Hierro sérico: bajo, Ferritina: baja, Saturación de transferrina: baja.","Hierro sérico: bajo, Ferritina: alta, Saturación de transferrina: alta.","Hierro sérico: bajo, Ferritina: normal, Saturación de transferrina: normal.","Hierro sérico: alto, Ferritina: alta, Saturación de transferrina: alta."],"ans":[0],"fix":0},{"id":303,"page":117,"q":"Un paciente de 6 meses de edad acude a vacunación, el lactante ha sido vacunado con BCG y con Hepatitis B pediátrica al nacimiento, ha recibido la segunda dosis de vacuna anti poliomielítica, segunda dosis de vacuna pentavalente, segunda dosis de neumococo y segunda dosis de rotavirus. Actualmente el lactante debe recibir las siguientes vacunas de acuerdo al esquema de vacunación en el Ecuador. EXCEPTO:","opts":["Vacuna contra Rotavirus","Vacuna pentavalente","Vacuna anti poliomielítica","Vacuna contra Influenza"],"ans":[0],"fix":0},{"id":304,"page":117,"q":"En los siguientes enunciados cuál NO es contraindicación para administrar la vacuna BCG:","opts":["Infección por Hepatitis B.","Infección por VIH.","Uso de un inmunosupresor.","Tratamiento con radioterapia."],"ans":[0],"fix":0},{"id":305,"page":118,"q":"La proteinuria es una alteración que puede estar presente en las patologías renales; en relación a ella, seleccione la afirmación correcta:","opts":["Un esfuerzo físico intenso puede generar proteinuria transitoria, sobre todo si se ha realizado en ambientes muy fríos.","Las tiras reactivas son efectivas para detectar la proteinuria de Bence-Jones típica de pacientes con mieloma múltiple.","En el síndrome nefrótico la proteinuria es inferior a 3.0 g en 24 h.","La microalbuminuria es un marcador precoz de daño renal en el diabético pero carece de utilidad en los hipertensos."],"ans":[0],"fix":0},{"id":306,"page":118,"q":"Joven migrante de 23 años con historia de promiscuidad bisexual y drogadicción, consulta por fiebre, malestar general y dolor en glande. La exploración física muestra múltiples tatuajes, \"piercings\" y la presencia de tres lesiones vesiculosas sobre base eritematosa en glande y adenopatías inguinales bilaterales. ¿Cuál es el diagnóstico más probable?","opts":["Herpes genital.","Condilomas acuminados.","Gonorrea.","Sífilis."],"ans":[0],"fix":0},{"id":307,"page":118,"q":"En concordancia con las guías de práctica clínica del MSP, un criterio de referencia a un nivel de mayor complejidad, de un paciente con hipertensión arterial es:","opts":["Hipertensión asociada a cambios en el fondo de ojo (grado III).","Urgencia hipertensiva que no resuelve en 4 horas.","Debut de hipertensión arterial esencial en adulto.","Paciente que no controla la presión con 2 fármacos."],"ans":[0],"fix":0},{"id":308,"page":119,"q":"¿Cuál es el elemento menos probable como factor de riesgo absoluto y directo para suicidio en adolescentes?","opts":["Sobre protección por parte de los padres.","Trastorno mental del padre o la madre.","Antecedentes familiares de conductas suicidas.","Nivel socioeconómico bajo."],"ans":[0],"fix":0},{"id":309,"page":119,"q":"¿Cuándo debe administrarse un medicamento a la mitad de la velocidad para evitar que sea nefrotóxico?","opts":["Choque.","Cirrosis.","Hipoalbuminemia.","Desnutrición."],"ans":[0],"fix":0},{"id":310,"page":119,"q":"En relación con las recomendaciones de las guías del MSP para el tratamiento de la hipertensión arterial en el paciente diabético, seleccione el enunciado correcto:","opts":["La restricción de sodio en la dieta es fundamental y se ha demostrado que su efecto beneficioso es mayor en hipertensos con diabetes.","La presión arterial sistólica objetivo en diabéticos insulinorrequirientes es menor o igual a 120 mmHg independientemente de la edad.","La clortalidona está altamente recomendada en estos pacientes por ser muy eficaz controlando la presión con escasos efectos adversos.","Los betabloqueantes cardioselectivos son primera línea en estos pacientes porque ayudan también a controlar síntomas neuropáticos."],"ans":[0],"fix":0},{"id":311,"page":120,"q":"Hombre de 45 años llega a emergencia del hospital con heridas superficiales por arma blanca en antebrazos y abdomen. Antecedentes de ansiedad y autoagresiones. Los familiares que lo trasladan, refieren intento de suicidio en el domicilio del paciente. Durante la evaluación de la urgencia, se procede a suturar las heridas; sin embargo, manifiesta eventos de ansiedad generalizada con preocupación excesiva, incontrolable, persistente y carente de realismo acerca de situaciones futuras, al punto que, la intervención de micro cirugía resulta accidentada e interrumpida debido al comportamiento poco colaborador del paciente. ¿Qué tratamiento es el más recomendable para este momento?","opts":["Midazolam","Fluoxetina","Citalopram","Paroxetina"],"ans":[0],"fix":0},{"id":312,"page":120,"q":"Un hombre de 28 años acude a su consulta preocupado, ya que desde hace 2 años ha cambiado la talla de zapatos, nota un aumento considerable en el tamaño de sus pies y manos, esta manifestación se acompaña de acné en frente, pómulos y mentón. El paciente refiere que su voz es más grave y áspera, su familia lo despierta en la noche repetidas veces por que ronca intensamente al dormir. No presenta antecedentes personales de importancia. Al examen físico la temperatura es de 37.1 °C, la FC: 98 /min, FR: 20/min, TA: 134/93 mmHg, IMC: 28.4, el paciente está consciente, orientado, la piel del rostro es brillante, la frente se encuentra abultada y ensanchada, se visualiza la lengua aumentada de tamaño, la piel de las axilas es gruesa y con un color gris parduzco. Al palpar el abdomen el hígado está aumentado de tamaño. Los exámenes de laboratorio muestran: leucocitos y hemoglobina dentro de parámetros normales, Glucosa 120 mg/dL, IGF-I: 230 ng/ml. Según la clínica del paciente. ¿Cuál es la complicación que a secreción amarillenta y fétida. El estudio en fresco revela un organismo unicelular flagelado móvil. ¿Cuál de los siguientes es el agente infeccioso causal más probable?","opts":["Tricomona vaginal.","Gardnerella vaginal.","Candida albicans.","Chlamydia trachomatis."],"ans":[0],"fix":0},{"id":383,"page":146,"q":"Una paciente de 7 meses de edad es traída a la consulta externa de pediatría a control de niño sano. La madre niega molestias. Los antecedentes personales son importantes por historia de oligohidramnios y presentación podálica, por lo que realizaron cesárea de urgencia, sin complicaciones neonatales posteriores. Fuera de ello ningún otro antecedente personal ni familiar de importancia. Al examen físico el pediatra encuentra al paciente en buen estado general; los pliegues de muslos y glúteos son asimétricos durante la flexión de la cadera y las rodillas. El signo de Galeazzi es positivo. La radiografía de la cadera muestra un índice acetabular de 30 grados y la línea de Shenton se ve discontinua. ¿Cuál es el tratamiento adecuado?","opts":["Reducción cerrada y férula de cadera.","Arnés de Pavlik.","Colocación de doble pañal.","Osteotomía pélvica y femoral."],"ans":[0],"fix":0},{"id":384,"page":147,"q":"En el frotis de sangre periférica de un paciente de 4 años, con desnutrición proteico- calórica de 2do grado, se reporta presencia de leucocitos con: macrocitosis, anisocitosis, poiquilocitosis y polimorfonucleares polilobulados. Seleccione el diagnóstico más probable y el tratamiento correlativo con dicho diagnóstico:","opts":["Anemia por déficit de folato; tratamiento con ácido fólico.","Anemia perniciosa; tratamiento con vitamina B12.","Anemia ferropénica; tratamiento con fumarato ferroso.","Anemia de Fanconi; tratamiento con transfusión y prednisona."],"ans":[0],"fix":0},{"id":385,"page":147,"q":"Varón de 60 años acude a consulta externa para revisión de resultados de laboratorio: Hemoglobina 10 g/dL y volumen corpuscular medio 120 fL. ¿Cuál de los siguie
