ACTH y GH fueron normales. La IRM de encéfalo simple y con contraste reveló una masa sólida, homogénea de 22 mm de diámetro en la silla turca, hipointensa en las secuencias T1 y T2, sin captación de contraste. La lesión tiene extensión supraselar y hacia el seno cavernoso. Se solicita una campimetría visual. ¿Cuál es el tipo de déficit en la campimetría que debe tener esta paciente?","opts":["Hemianopsia heterónima.","Hemianopsia altitudinal.","Amaurosis mono-ocular.","Hemianopsia homónima."],"ans":[0],"fix":0},{"id":865,"page":334,"q":"Una mujer de 66 años fue recientemente diagnosticada de mieloma múltiple. Consulta al médico a causa de disnea que se ha incrementado progresivamente, lo que le impide subir gradas o realizar las tareas de la casa. Al examen se aprecia edema con fóvea, bilateralmente en sus miembros inferiores, hay matidez de concavidad superior en el abdomen y distensión yugular. No se palpa el ápice cardíaco ni se ausculta frote. Hay crepitantes pulmonares bilaterales. La TA: 130/85 mm Hg. FC: 86 lpm, FR: 20 x min. Un ECG muestra disminución difusa del voltaje. La Rx de tórax es normal y un ECO cardiograma revela ventrículos pequeños con incremento del grosor de sus paredes y atrios dilatados con engrosamiento del septo interatrial. El miocardio tiene una textura granular y se observa acumulación mínima de fluido en el espacio pericárdico. ¿Cuál es el diagnóstico más probable?","opts":["Cardiopatía restrictiva.","Pericarditis crónica sin taponamiento cardíaco.","Pericarditis crónica con taponamiento cardíaco.","Pericarditis constrictiva."],"ans":[0],"fix":0},{"id":866,"page":334,"q":"Un recién nacido (RN) presenta en su LCR los siguientes valores: Proteínas = 140 mg /dl. Leucocitos = 28 / mm3. Linfocitos = 77%. La glucosa en LCR es inferior a la glicemia en 30%. Seleccione la opción más probable:","opts":["LCR normal.","Sepsis precoz.","Sepsis tardía.","Meningoencefalitis aguda."],"ans":[0],"fix":0},{"id":867,"page":335,"q":"Según la guía de Hipertensión Arterial del MSP, seleccione el enunciado correcto en relación a las metas de tratamiento de la presión arterial en pacientes diabéticos de acuerdo a la edad:","opts":["En diabéticos de más de 80 años, se debe alcanzar una presión sistólica de 130-139 mmHg si es bien tolerada.","En diabéticos menores de 65 años, la presión sistólica objetivo es de 135-130 mmHg, si ésta es bien tolerada.","En diabéticos menores de 40 años, es recomendable alcanzar valores de presión sistólica de 120-110 mmHg.","En diabéticos insulinodependientes debe mantenerse la presión sistólica siempre menor o igual a 120 mmHg."],"ans":[0],"fix":0},{"id":868,"page":335,"q":"Una mujer de 47 años es llevada a Emergencias por personal paramédico, a causa de traumatismo penetrante de tórax hace 1 hora aproximadamente. No se conocen antecedentes personales patológicos. Al examen físico FC:120/min, FR: 25/min TA: 95 /55 mmHg temperatura: 36 °C, saturación de oxígeno: 88 % al aire ambiente. En región cervical ingurgitación yugular. El tórax presencia de herida de 2 cm localizada a nivel de 4 espacio intercostal 3 cm medial al pezón, campos pulmonares con presencia de murmullo vesicular normal, ruidos cardíacos hipofonéticos. ¿Cuál sería el paso inicial recomendado en esta paciente?","opts":["Realizar una pericardiocentesis.","Solicitar una Rx PA de tórax.","Realizar una toracostomía con aguja.","Realizar una toracostomía con tubo."],"ans":[0],"fix":0},{"id":869,"page":336,"q":"Una mujer de 40 años, acude a emergencia por debilidad en los miembros inferiores que comenzó hace 10 días, hace 3 días nota también debilidad en las manos. Desde el inicio de la debilidad hace 10 días, hay sensación de hormigueo en los dedos de los pies. No tiene ninguna enfermedad previa, excepto que hace dos semanas tuvo un resfriado común. La TA en emergencia es de 110/70 mm Hg, saturación de O2 de 92% (aire ambiente), Fc de 76 por minuto. Glasgow 15/15. El balance muscular en los 4 miembros es de 4/5 a nivel proximal y de 3+/5 a nivel distal. Hay arreflexia osteotendinosa en los 4 miembros y una hipoestesia en bota corta para la sensibilidad táctil y al pinchazo. Usted decide realizar una punción lumbar. ¿Cuál es el resultado que se debe encontrar en el líquido céfalo raquídeo en esta paciente?","opts":["Elevación de las proteínas sin pleocitosis.","Proteínas normales y pleocitosis.","Proteínas normales, sin pleocitosis.","Disminución de las proteínas y pleocitosis."],"ans":[0],"fix":0},{"id":870,"page":336,"q":"Un hombre de 35 años, acude a consulta de urología por presentar lesiones ulcerosas muy dolorosas en el pene; refiere que hace 7 días mantuvo relaciones sexuales sin anticonceptivo de barrera con una trabajadora sexual, hace 4 días presento “unos granos” en el pene no dolorosos que posteriormente drenaron pus y se tornaron dolorosos. No ha presentado disuria. Sus antecedentes personales incluyen: infección de vías urinarias hace 1 año que se resolvió con tratamiento que no especifica. Al examen físico FC: 80/min, FR: 20/min, TA: 120/75 mmHg, temperatura: 37.7 °C. En el lado derecho del surco coronal del pene se observa dos úlceras muy dolorosas y no induradas, con bordes irregulares; las úlceras contienen secreción amarillenta, al realizar un raspado se presenta sangrado. Se palpan adenopatías inguinales derechas dolorosas. El hemograma muestra leucocitos de 12000/mm3 con 77 % de segmentados neutrófilos. La química sanguínea muestra glucosa de 110 mg/dl y creatinina de 1.1 mg/dl. ¿Cuál es el agente etiológico responsable de este cuadro clínico?","opts":["Haemophilus ducreyi.","Treponema pallidum.","Neisseria gonorrhoeae.","Virus del papiloma humano."],"ans":[0],"fix":0},{"id":871,"page":337,"q":"Varón de 10 meses consulta porque hace 8 días presentó fiebre durante 24 horas. Ese día vomitó dos veces. Desde entonces tiene tos, rinitis, conjuntivitis y deposiciones abundantes y acuosas, en número de 4-6 al día. No tiene sangre en las deposiciones, pero sí moco. La madre refiere que ha seguido dieta con leche al medio y alimentación astringente, con aporte de SRO tras cada deposición suelta, sin notar mejoría. El niño asiste a guardería. Examen físico: peso: 9.800 g. (p50); talla: 73 cm. (p50). Buen estado general y de hidratación. Mucosas húmedas, masa muscular eutrófica. Afebril. Abdomen distendido, con timpanismo y borborigmos, no doloroso. Importante eritema en el área del pañal. Hiperemia orofaríngea y conjuntival. Resto de la exploración física es normal. ¿Cuál es el agente infeccioso más probable?","opts":["Adenovirus spp.","Campylobacter spp.","Entamoeba histolytica.","Criptosporidium parvum."],"ans":[0],"fix":0},{"id":872,"page":337,"q":"Paciente de 32 años, con embarazo de 38 semanas, acude a emergencia del hospital por presentar cefalea intensa. Familiar refiere que la paciente hace 1 hora presentó convulsiones generalizadas. A la exploración física: TA: 150/110 mmHg, FR: 18 rpm, T: 36.5 °C, FC: 80 lpm. Exámenes complementarios: determinación de proteínas en orina con tira reactiva y con resultado negativo, plaquetas 250 000/uL, TGO 28 UI/L, TGP 32 UI/L, creatinina sérica 0.7 mg/dL, LDH 300 UI/L, en este caso. ¿Qué dosis de sulfato de magnesio intravenoso se utiliza como impregnación en profilaxis de convulsiones?","opts":["6 gramos en 20 minutos.","4 gramos en 20 minutos.","8 gramos en 20 minutos.","2 gramos en 15 minutos."],"ans":[0],"fix":0},{"id":873,"page":338,"q":"Un lactante mayor de 18 meses de edad acude al subcentro de salud por presentar desde hace 24 horas diarreas líquidas, abundantes, mal oliente, sin moco ni sangre, en número de 10. Al examen físico presenta astenia; sin embargo, se pone irritable al manejo, tiene los ojos algo hundidos, globos oculares blandos y el llanto sin lágrimas. Su lengua y mucosas orales están secas. Presenta signo de pliegue únicamente en abdomen. T: 38,7 °C, FC: 116 x 1´, FR: 40 x 1´. Llenado capilar rápido. No ha vomitado y toma un poco de seno materno. Su peso actual es de 9.2 kg. ans":[0],"fix":0},{"id":877,"page":340,"q":"Una mujer de 68 años, acude a la emergencia por presentar desde hace 45 minutos dificultad para respirar, refiere que le falta el aliento y que no puede respirar profundamente. La sintomatología se acompaña de mareo intenso y nausea que no llega al vómito. Como antecedente presenta Diabetes Mellitus no insulino dependiente desde hace 10 años, en tratamiento con metformina, 500 mg cada 12 horas. Al examen físico la temperatura es de 36.4 °C, FR: 22/min, FC: 170/min, TA: 86/62 mmHg, Sat O2: 92% en aire ambiente, IMC: 29.5. La paciente se encuentra muy ansiosa, hay presencia de pulso carotídeo rápido, con ausencia de pulso radial bilateral. Se ausculta murmullo vesicular bilateral con estertores moderados. En el electrocardiograma se observa taquicardia ventricular de complejo ancho monomórfica. ¿Cuál es el tratamiento inmediato para esta paciente?","opts":["Cardioversión sincronizada a 100 julios.","Desfibrilar a 360 julios.","Marcapasos transcutáneo a 60 LPM.","Desfibrilar a 120 julios."],"ans":[0],"fix":0},{"id":878,"page":340,"q":"De los fármacos con receta de los que se abusa con frecuencia señale el que tiene efecto estimulante:","opts":["Anfetaminas.","Barbitúricos.","Hipnóticos.","Benzodiacepinas."],"ans":[0],"fix":0},{"id":879,"page":340,"q":"¿Cuál de los siguientes esquemas de tratamiento es el apropiado para el manejo ambulatorio de la enfermedad pélvica inflamatoria?","opts":["Ceftriaxone 250 mg IM 1 dosis + Doxicilina 100 mg BID por 14 días.","Azitromicina 1g VO en monodosis.","Ampicilina sulbactam 1g VO QD + doxiciclina 100 mg BID x 14 días.","Ciprofloxacina 500 mg BID VO x 14 días."],"ans":[0],"fix":0},{"id":880,"page":341,"q":"Según la guía de Atención Integrada Para Enfermedades Prevalentes en la Infancia (AIEPI). ¿Cuál opción corresponde a taquipnea o respiración rápida?","opts":["50 o más respiraciones por minuto en un niño de 2 a 11 meses.","50 o más respiraciones por minuto en un niño de 12 meses a 4 años.","40 o más respiraciones por minuto en un niño de 2 a 11 meses.","20 o más respiraciones por minuto en un niño de 12 meses a 4 años."],"ans":[0],"fix":0},{"id":881,"page":341,"q":"¿Qué apgar presentó al nacimiento un RN con FC 80 lpm, esfuerzo respiratorio lento, sin tono muscular, sin llanto, con extremidades azules?","opts":["Apgar 3.","Apgar 0.","Apgar 6.","Apgar 4."],"ans":[0],"fix":0},{"id":882,"page":341,"q":"Una paciente mujer de 17 años presenta un cuadro de fiebre de 48 horas de evolución, que se acompaña de odinofagia, malestar general importante y mialgias generalizadas. Niega viajes recientes, transfusiones o haber estado en contacto con personas con síntomas gripales. Al examen físico: TA:110/60, frecuencia cardíaca: 93 por minuto, Sat O2: 94 %, T: 38.5 °C y un IMC de 17. Las conjuntivas están rosadas y se evidencia un leve edema palpebral superior, bilateral. La orofaringe es exudativa con amígdalas grandes y purulentas y se aprecian petequias en el paladar duro y blando. En el cuello se aprecia abundantes linfonodos de más de 2 cm. En la cadena posterior, poco dolorosas a la palpación. Cardiopulmonar: normal. Abdomen: blando, depresible, levemente doloroso a la palpación en hemiabdomen izquierdo, presencia de esplenomegalia. Resto del examen físico es normal. Exámenes: La hemoglobina es de 13 g/dL; leucocitos de 4 500/mm cúbico con 39 % de neutrófilos y 55 % de linfocitos. ¿Cuál es el agente causal de este proceso infeccioso?","opts":["Virus de Epstein Barr","Estreptococo beta hemolítico del grupo A","Coxackievirus del grupo A","Bacteroides frágilis"],"ans":[0],"fix":0},{"id":883,"page":342,"q":"Un hombre de 17 años acude a la emergencia con dolor abdominal de 24 horas de evolución, que ha incrementado en intensidad, el dolor inició alrededor del ombligo, pero ahora se localiza en cuadrante inferior derecho y se ha acompañado de vómito por dos ocasiones. Refiere que no tiene apetito a pesar de no poder comer nada desde ayer. Sin antecedentes de importancia. Al examen físico: FC: 90/min, TA: 120/85 mmHg, FR: 20/min, temperatura es de 38,5 °C. Abdomen: dolor en el cuadrante inferior derecho, presencia de irritación peritoneal en fosa iliaca derecha; el dolor se incrementa al extender la pierna. La biometría hemática muestra leucocitos 15.000 / mm3, neutrófilos 78%, hemoglobina 15 g/dl. ¿Cuál es el examen imagenológico con mayor sensibilidad que se puede realizar en este paciente?","opts":["Tomografía abdominal","Ecografía abdominal","Resonancia magnética abdominal","Radiografía abdominal"],"ans":[0],"fix":0},{"id":884,"page":342,"q":"¿Qué ocasiona sangrado leve, continuo y útero más grande que lo previsto, 12h después del parto?","opts":["Retención de restos placentarios.","Rotura uterina.","Retención de placenta.","Atonía uterina."],"ans":[0],"fix":0},{"id":885,"page":342,"q":"Una niña de 6 años, pesa 20 kg, presenta infección de vías urinarias por Escherichia coli, sensible a cotrimoxazol. Se dispone de una suspensión de cotrimoxazol que contiene Sulfametoxazol 200 mg y Trimetoprima 40 mg / 5ml, para su tratamiento durante 7 días. Seleccionar el esquema terapéutico adecuado:","opts":["10 ml vía Oral cada 12 horas.","5 ml vía Oral cada 12 horas.","10 ml vía Oral en una toma diaria.","20 ml vía Oral cada 12 horas."],"ans":[0],"fix":0},{"id":886,"page":343,"q":"La tercera etapa del trabajo de parto se caracteriza por: 1. Separación de la membrana fetal. 2. Expulsión de la placenta. 3. Creación de hematoma retroplacentario. 4. Reparación cervicouterina. 5. Comienzo de la lactogénesis. 6. Descenso del diámetro biparietal fetal.","opts":["1, 2, 3","1, 4, 6","3, 4, 5","2, 3, 6"],"ans":[0],"fix":1},{"id":887,"page":343,"q":"¿Cuál es el manejo inicial de un varón con retención aguda de orina causada por hematuria con coágulos?","opts":["Colocar un catéter de tres vías.","Realizar cistoscopia con dilatador uretral.","Colocar una sonda suprapúbica.","Colocar una sonda vesical Foley."],"ans":[0],"fix":0},{"id":888,"page":344,"q":"Hombre de 72 años, acude a consulta externa por falta de aire de 3 meses de evolución, además tos nocturna ocasional, duerme con 2 almohadas desde hace 15 días. Mantiene su actividad física con ligera limitación por aparición de disnea. Niega insomnio o despertares nocturnos. Niega náuseas, vómitos, dolor abdominal. Antecedentes Infarto del miocardio hace 4 años. Examen físico: TA: 130 /80 mmHg, FC: 88 lpm, FR: 20 rpm, Saturación: 90% aire ambiente (2850m). Consciente. Cuello: ingurgitación yugular ausente, reflujo abdominoyugular positivo. Pulmones: a la auscultación murmullo vesicular conservado, estertores subcrepitantes en bases pulmonares. Corazón: ruidos cardíacos rítmicos, se ausculta un tercer ruido, no soplos. Extremidades: edema simétrico bilateral en tobillos y zonas pretibiales x/xxx. ¿Cuál de los siguientes es el síntoma más relevante en el paciente?","opts":["Ortopnea.","Fatiga.","Disnea.","Disnea paroxística nocturna."],"ans":[0],"fix":0},{"id":889,"page":344,"q":"¿Qué complicación de la diabetes gestacional ocasiona con mayor frecuencia parto prematuro?","opts":["Preeclampsia.","Gastropatía.","Cetoacidosis.","Nefropatía."],"ans":[0],"fix":0},{"id":890,"page":344,"q":"Señale la patología en la cual la acidosis metabólica tiene anión “gab” (GA) normal:","opts":["Insuficiencia suprarrenal.","Cetoacidosis diabética.","Intoxicación por etanol.","Intoxicación con paracetamol."],"ans":[0],"fix":0},{"id":891,"page":345,"q":"La siguiente es característico de la anemia megaloblástica:","opts":["Deficiencia de la función bactericida de los leucocitos.","Se produce en el crecimiento rápido.","Disminución de la capacidad al ejercicio.","Presencia de coiloniquia."],"ans":[0],"fix":0},{"id":892,"page":345,"q":"¿Cuál es el medicamento inhibidor selectivo de la recaptación de serotonina, que se usa en el tratamiento farmacológico del adulto con intento autolítico?","opts":["Paroxetina.","Risperidona.","Galantamina.","Rivastigmina."],"ans":[0],"fix":0},{"id":893,"page":345,"q":"Una mujer de 76 años acude a consulta médica por cuadro de un mes de evolución de presencia de sangre en la orina, no presenta dolor. No refiere molestias urinarias ni genitales. Además, ha presentado pérdida de peso en los últimos 3 meses. Sus antecedentes personales incluyen hipertensión arterial desde hace 15 años en tratamiento con enalapril 10mg diarios, fumadora de 20 unidades de cigarrillo al día desde los 30 años. Al examen físico FC: 88/min, FR: 19/min, TA: 135/85 mmHg, temperatura: 36.7 °C. El examen físico regional es completamente normal. El hemograma muestra leucocitos 7000/mm3 con 58 % de segmentados neutrófilos, hemoglobina 11.5 g/dl. El examen de orina muestra campo lleno de hematíes, ausencia de bacterias y piocitos. Considerando su sospecha diagnóstica. ¿Cuál de las siguientes opciones confirmará mejor el diagnóstico?","opts":["Cistoscopia.","Tomografía computarizada de la pelvis.","Niveles séricos de creatina quinasa.","Urograma excretor."],"ans":[0],"fix":0},{"id":894,"page":346,"q":"Un varón soltero, de 26 años con antecedente de una relación sexual sin protección hace 15 días, acude a su consulta por una lesión genital. Inició hace unos 6 días como una mácula en el prepucio que progresó a pápula, con posterior salida de material purulento y dolor. Al examen físico se encuentra una úlcera redondeada, algo deprimida, de aproximadamente un centímetro de diámetro, de bordes difusos y suaves, irregulares y piel eritematosa en su contorno. Se evidencia un exudado purulento, gris, abundante, en el fondo de la úlcera. Además presenta un ganglio inguinal derecho palpable y doloroso, de 1.5 centímetros de diámetro. ¿Para cuál de los siguientes microorganismos direccionaría la terapéutica?","opts":["Haemophylus ducreyi.","Herpes virus.","Treponema pallidum.","Chlamydia trachomatis."],"ans":[0],"fix":0},{"id":895,"page":346,"q":"Señale la enfermedad aguda autolimitada de la lactancia y la primera infancia que se caracteriza por la aparición brusca de fiebre alta, que suele resolverse después de 72 horas (crisis), pero puede disminuir de forma gradual durante un día (lisis) coincidiendo con la aparición en el tronco de un exantema morbiliforme de color rosa o ligeramente enrojecido y no pruriginoso, de 2-3 mm. El exantema suele durar 1-3 días, pero a menudo se describe como evanescente y puede ser visible sólo durante horas, extendiéndose desde el tronco hasta la cara y las extremidades. Los signos asociados pueden consistir en congestión leve de la faringe, la conjuntiva palpebral o el tímpano, y en un aumento de tamaño de los ganglios suboccipitales.","opts":["Roséola.","Sarampión.","Rubeóla.","Mononucleosis infecciosa."],"ans":[0],"fix":0},{"id":896,"page":347,"q":"Un hombre de 32 años acude al servicio de emergencia por cuadro de 36 horas de evolución de fiebre, dolor muscular generalizado y decaimiento. Sus antecedentes personales incluyen uso de drogas ilícitas intravenosas, desde los 30 años. Al examen físico FC: 100/min, TA: 95/65 mmHg, FR: 22/min, temperatura 38.5 °C. A la auscultación cardíaca se escucha un soplo sistólico en foco tricúspideo, en las palmas de las manos y plantas de los pies hay presencia de máculas hemorrágicas, no dolorosas y hay presencia de petequias subungueales. ¿Cuál es el agente etiológico responsable del cuadro, teniendo en cuenta que el germen del paciente es coagulasa positiva?","opts":["Staphylococcus aureus","Estreptococo del grupo A","Streptococcus viridans","Enterococcus"],"ans":[0],"fix":0},{"id":897,"page":347,"q":"Paciente masculino de 1 año. Motivo de consulta: 72 horas de fiebre, sin predominio horario, se acompaña de hiporexia. Su hermano presenta infección respiratoria alta en curso. No tiene antecedentes personales ni familiares de importancia. Examen físico: tensión arterial 85/60 mmHg, frecuencia cardíaca 120/minuto, temperatura axilar 38 °C, frecuencia respiratoria: 40/minuto, saturación de oxígeno 90 %. En boca se observa orofaringe eritematosa novirus.","Adenovirus."],"ans":[0],"fix":0},{"id":901,"page":348,"q":"Paciente procedente de zona tropical, acude a consulta por presentar: fiebre, escalofríos, artralgias y dolor retroocular de 2 días de evolución. En las últimas 12h también se acompaña de rash en el tronco, conjuntivitis y petequias. El diagnóstico menos probable es:","opts":["Fiebre amarilla.","Dengue.","Chinkungunya.","Zika."],"ans":[0],"fix":0},{"id":902,"page":349,"q":"¿Cuál es la primera medida de intervención durante la fase aguda de la crisis convulsiva?","opts":["Colocar al paciente en posición de decúbito semiprono con la cabeza girada hacia un lado.","Introducir depresores linguales entre los dientes apretados.","Corregir de inmediato los trastornos metabólicos reversibles.","Colocar al paciente en posición de decúbito supino, con la cabeza rotada hacia la izquierda."],"ans":[0],"fix":0},{"id":903,"page":349,"q":"Un hombre de 76 años acude al servicio de emergencia. Su hija, con quien vive, menciona que desde hace seis meses ha perdido su energía habitual y que todos en casa han notado que desde hace tres días está confuso y somnoliento. Al examen físico se identifica una TA: 130/85 mm Hg, FC: 76 lpm, rítmico, FR: 18 x min; llama la atención al palpar el pulso radial las variaciones en su amplitud y, que los ruidos de Korotkoff son audibles en cada sístole (fase 1), mientras se desinfla el manguito del tensiómetro, y que esto es independiente del ciclo respiratorio. De acuerdo a este hallazgo. ¿Qué anomalía podría tener este paciente?","opts":["Disfunción ventricular grave.","Fibrilación auricular.","Taponamiento cardíaco.","Pericarditis constrictiva."],"ans":[0],"fix":0},{"id":904,"page":349,"q":"Un niño de 3 años es llevado al servicio de emergencias por cuadro de diarreas acuosas, muco sanguinolentas y con fiebre de 2 días de evolución. No presenta vómito. Sin embargo; en las últimas 24 horas presenta oliguria y al llorar tiene escasas lágrimas. Se le ofrece agua y la toma con avidez. No tiene antecedentes personales ni familiares de importancia. Al examen físico TA: 95/60 mmHg, FC: 120/min su pulso es débil, FR: 35/min, temperatura: 38 °C. Mucosas orales secas. Abdomen suave, depresible, ruidos hidroaéreos incrementados. ¿Cuál es el tratamiento más adecuado para el paciente?","opts":["Sales de hidratación oral a 100 ml/kg en 4 horas.","Sales de hidratación oral a 50 ml/kg en 4 horas.","Sales de hidratación oral a 10 ml/ por cada deposición.","Solución salina 0.9% intravenoso 10 ml/kg en 40 minutos."],"ans":[0],"fix":0},{"id":905,"page":350,"q":"Mujer de 58 años, 50 kg de peso, residente en Manta y sin antecedentes de interés. Sufre traumatismo craneal grave (TCE) con Glasgow en 8/15. TA 80/50 mm Hg. Glicemia: 280 mg/dl, Hb: 8 g/dL, Sat O2: 90 %. Le administran oxígeno, cloruro de sodio al 0.9 % hasta normalizar la TA. Presenta convulsiones que se manejan con fenitoína. Los signos de hipertensión intracraneal se trataron con manitol 100 gr iniciales en 20 minutos. Seleccione las respuestas correctas en cuanto al manejo inicial en este caso y objetivos terapéuticos en el TCE grave: 1. En el manejo de la hipotensión el ringer lactato y el cloruro de sodio al 0.9 % son recomendados por igual. 2. La presión arterial sistólica mayor a 100 mm de Hg garantiza una presión de perfusión cerebral adecuada. 3. La glicemia que presenta el paciente es el objetivo a alcanzar por el riesgo a desarrollar hipoglucemia. 4. Se debió haber realizado hiperventilación hasta lograr una PaCO2 menor a 35 mm de Hg. 5. El manejo de los signos de hipertensión intracraneal utilizando manitol fue adecuado. 6. El valor de hemoglobina que presenta el paciente está dentro del objetivo del tratamiento de la lesión cerebral.","opts":["1, 2, 6.","1, 3, 5.","2, 5, 6.","3, 4, 5."],"ans":[0],"fix":1},{"id":906,"page":350,"q":"Mujer de 35 años acude a consulta prenatal para control de embarazo de 32 semanas. Niega antecedentes personales y familiares de relevancia. Gestas 2 Parto 1 Abo ación enteral (calostro).","Glucosa al 5%, 10 ml/kg/hora PO; control de glucemia cada 30 minutos. Si glucemia >45 mg/dl, continuar con glucosa oral o IV y alimentación enteral (calostro).","Bolo de Glucosa al 10%, 2 ml/kg IV (200 mg/kg) + Glucosa al 10%, 5 - 8 mg/kg/min IV; glucemia c/30 minutos. Si glucemia >45 mg/dl, glucosa oral o IV y alimentación enteral (calostro).","Glucosa 15%, 15 mg/kg/min IV; control de glucemia cada 30 minutos. Si glucemia >45 mg/dl, continuar con glucosa oral o IV y alimentación enteral (calostro)."],"ans":[0],"fix":0},{"id":940,"page":362,"q":"Paciente de 20 años, con embarazo de 37 semanas, acude a emergencia del hospital por epigastralgia. Al examen físico: TA: 150/115 mmHg, FR: 17 por minuto, T: 36.6 C, FC: 80 latidos por minuto. Los exámenes complementarios muestran: proteínas en orina +++ mediante tira reactiva, plaquetas 240 000/uL, TGO: 32 UI/L, TGP: 30 UI /L, creatinina sérica 0.7 mg/dL, LDH: 320 UI/L, en este caso. ¿Qué dosis de sulfato de magnesio en infusión continua se utiliza como mantenimiento en profilaxis de convulsiones?","opts":["1 gramo por hora.","2 gramos por hora.","4 gramos en 24 horas.","6 gramos en 24 horas."],"ans":[0],"fix":0},{"id":941,"page":363,"q":"¿Cua´l es el patrón de resultados que representa un diagnóstico de diabetes mellitus tipo 1 (Nota: HOMA, valor referencial menor a 3; Péptido C, valor referencial: 0.7- 3ng/ml)?","opts":["Glucemia en ayunas: 168 mg/dl, Tolerancia de glucosa a 2h: 342 mg/dl, HbA1c: 8.5, HOMA: 2.2, Péptido C: 0.3 ng/ml.","Glucemia en ayunas: 102 mg/dl, Tolerancia de glucosa a 2h: 167 mg/dl, HbA1c: 6.1, HOMA: 4.3, Péptido C: 4.2 ng/ml.","Glucemia en ayunas: 99 mg/dl, Tolerancia de glucosa a 2h: 135 mg/dl, HbA1c: 5.4, HOMA: 1.9 Péptido C: 2.1 ng/ml.","Glucemia en ayunas: 107 mg/dl, Tolerancia de glucosa a 2h: 210 mg/dl, HbA1c: 6.8, HOMA: 5.6, Péptido C: 6.7 ng/ml."],"ans":[0],"fix":0},{"id":942,"page":363,"q":"Un hombre de 45 años consulta por cefalea, rinorrea, otalgia, fiebre, artralgias y anorexia. Este cuadro ha ocurrido desde hace más de tres meses. Hace dos semanas fue evaluado por un médico quien solicitó una radiografía de senos paranasales en la que se apreció una sinusitis maxilar bilateral. Le prescribió antibiótico, pero en lugar de mejorar su cuadro, se añadió: tos, dolor torácico y hemoptisis. El examen físico revela los siguientes hallazgos: deformidad nasal en silla de montar, ulceración en la mucosa nasal. Los exámenes reportan: BUN: 35 mg/dl, creatinina sérica: 2 mg/dl, EMO: 10-12 eritrocitos por campo de alto poder. La RX de tórax muestra infiltrados cavitarios bilaterales. El examen de expectoración: BAAR: negativo, ausencia de hongos o células malignas. ¿Cuál sería el diagnóstico más probable?","opts":["Granulomatosis de Wegener","Poliarteritis nodosa","Sarcoidosis","Tuberculosis"],"ans":[0],"fix":0},{"id":943,"page":364,"q":"Hombre de 68 años, acude a consulta por palpitaciones de 4 meses de evolución. Antecedentes de Hipertensión arterial de 20 años en tratamiento con Amlodipino 10 mg QD. Examen físico: TA: 110/70 mmHg, FC: irregular (110 a 140 lpm), FR: 18 rpm, Glasgow 15/15. Corazón: ruidos cardíacos arrítmicos, no soplos, pulsos radiales rápidos e irregulares. En electrocardiograma se evidencia ausencia de onda P, presencia de ondas f, FC: 130 lpm, intervalo R-R no regular, segmento ST y onda T sin alteración en todas las derivaciones. ¿Cuál es el manejo o recomendación inicial más adecuados?","opts":["Control de la frecuencia.","Cardioversión eléctrica.","Cardioversión farmacológica.","Anticoagulación crónica."],"ans":[0],"fix":0},{"id":944,"page":364,"q":"Seleccione los cambios hematológicos fisiológicos que se presentan en un embarazo normal: 1. Aumento de la viscosidad de la sangre entera. 2. Hiperplasia eritroide moderada en la médula ósea. 3. La coagulación y la fibrinólisis tienden a aumentar. 4. El intervalo de la cuenta leucocítica disminuye. 5. Descenso de la concentración plaquetaria por hemodilución.","opts":["2, 3, 5","1, 2, 3","3, 4, 5","1, 3, 4"],"ans":[0],"fix":1},{"id":945,"page":364,"q":"¿Cuál es una causa de hemorragia fetomaterna relacionada con aloinmunización del antígeno eritrocitario?","opts":["Embarazo ectópico","Toxoplasmosis.","Hipotiroidismo.","Hipertiroidismo."],"ans":[0],"fix":0},{"id":946,"page":365,"q":"Mujer de 43 años, acude a sala de emergencias por dolor abdominal en el cuadrante superior derecho, acompañado de fiebre e ictericia, de 12 horas de evolución, acompañado de náuseas y vómitos en dos ocasiones. Antecedentes: obesidad y dislipidemia. Al examen físico: TA: 100/50 mmHg, FC: 98 lpm, FR: 22 rpm; T: 39.0 ° C. Consciente y orientada en las tres esferas. Piel y escleras ictéricas. Cardiopulmonar: normal. Abdomen: ruidos hidroaéreos conservados, dolor a la palpación superficial y profunda de hipocondrio derecho. Ecografía transabdominal informa: dilatación del árbol biliar. ¿Cuál es el diagnóstico más probable?","opts":["Colangitis aguda.","Colecistitis aguda.","Cólico biliar.","Coledocolitiasis."],"ans":[0],"fix":0},{"id":947,"page":365,"q":"Respecto a la fisiología del trabajo del parto. ¿A qué fase del parto corresponde la llamada maduración cérvicouterina?","opts":["Fase 2.","Fase 1.","Fase 3.","Fase 4."],"ans":[0],"fix":0},{"id":948,"page":366,"q":"Mujer de 35 años secundigesta de 38 semanas, acude a emergencias según refiere por contracciones uterinas, que iniciaron hace 6 horas, pero que cada vez son más intensas y frecuentes, además nota los movimientos fetales. No tiene sangrado ni salida de líquido por la vagina. Antecedentes obstétricos: primera gesta, con controles prenatales y ecografías normales. Al examen físico presenta: FC: 74/min, FR: 21/min, temperatura 36 °C, TA: 115/80 mmHg. Abdomen: gestante con fondo uterino a término, en presentación cefálica y FCF (frecuencia cardíaca fetal): 155/min. Al tacto vaginal cuello uterino posterior dilatado 2 cm y con 30% de borramiento, membranas íntegras y se palpa la cabeza fetal en segundo plano de Hodge. En la monitorización electrónica fetal se observa una caída aguda de la FCF con una pendiente rápida descendente y una recuperación variable, como \"v\", este hallazgo tiene una relación variable con las contracciones. ¿Cuál es la causa más probable de la desaceleración cardíaca fetal encontrada?","opts":["Compresión del cordón umbilical.","Taquisistolia uterina.","Hipoxia fetal.","Compresión de la cabeza del feto."],"ans":[0],"fix":0},{"id":949,"page":366,"q":"Paciente de 3 años, presenta tos productiva, fiebre y astenia. T= 38.5 °C; FC= 110 lpm; FR= 48 pm´; SO2= 86 %. Campos pulmonares con estertores finos en base derecha. Seleccione el diagnóstico más probable.","opts":["Neumonía grave.","Bronquiolitis grave.","Crup grave.","Bronquitis aguda."],"ans":[0],"fix":0},{"id":950,"page":367,"q":"Mujer de 26 años, con 4 abortos de repetición, trombosis venosa profunda de pierna derecha hace 3 años. Es hospitalizada, a la exploración: soplo sistólico pulmonar 3/4. Plaquetas 200 000, anticoagulante lúpico y anticuerpos anticardiolipina positivos a título alto. Eco transtorácico y transesofágico: masa móvil de 4.3 x 1.2 cm en el tracto de salida del ventrículo derecho (VD) en forma de racimo que prolapsa en sístole hacia la arteria pulmonar. ¿Cuál es la alternativa de anticoagulación de primera elección para este paciente?","opts":["Heparina.","Acenocumarol.","Fondaparinux.","Warfarina."],"ans":[0],"fix":0},{"id":951,"page":367,"q":"Mujer de 35 años con embarazo de 28 semanas, acude a consulta prenatal de rutina. Durante la entrevista no refiere sintomatología de importancia. Entre sus antecedentes relevantes están: Gestas 2 Parto 1 Aborto 0 y un antecedente familiar de madre con preeclampsia en su última gesta. Al examen físico presenta tensión arterial 160/110 mmHg, (repetida en intervalos de 15 minutos), frecuencia cardíaca 74 latidos por minuto, frecuencia respiratoria 16 por minuto. Abdomen: suave, depresible, no doloroso. Fondo uterino acorde a edad gestacional. ¿Cuál es el mecanismo de acción de la terapia indicada?","opts":["Agonista alfa adrenérgico central.","Bloqueador mixto alfa y beta adrenérgico.","Antagonista de canales de calcio.","Antagonista alfa 1."],"ans":[0],"fix":0},{"id":952,"page":367,"q":"Uno de los pilares del tratamiento del tromboembolismo pulmonar es la fibrinólisis. De los siguientes factores, seleccione el que constituye una contraindicación absoluta de este procedimiento.","opts":["Tumores del sistema nervioso central.","Ictus isquémico hace 4 meses.","Uso crónico de anticoagulantes.","Úlcera péptica gástrica activa."],"ans":[0],"fix":0},{"id":953,"page":368,"q":"¿Cuál es el valor normal de glucosa sanguínea en una paciente con diagnóstico de diabetes gestacional en tratamiento?","opts":["Glucosa en ayunas menor a 90 mg/dl.","Glucosa en ayunas menor a 100 mg/dl.","Glucosa dos horas postprandial menor a 160 mg/dl.","Glucosa dos horas postprandial menor a 140 mg/dl."],"ans":[0],"fix":0},{"id":954,"page":368,"q":"¿Cuál es la alteración del equilibrio ácido - base presente en los siguientes gases arteriales: PaO2: 84 mmHg; PaCO2: 20 mmHg; HCO3: 18 mmol/L; pH: 7.48?","opts":["Alcalosis Respiratoria.","Alcalosis metabólica.","Acidosis respiratoria.","Acidosis Metabólica."],"ans":[0],"fix":0},{"id":955,"page":368,"q":"Mujer de 25 años, acude a emergencia por lesión autoinflingida por ingestión de pesticida hace 1 hora. Antecedentes: tuvo trastorno depresivo. Antecedentes psicosociales: buena dinámica familiar, niega problemática económica, social o situacional. Personalidad previa introvertida. Examen físico: TA: 90/60 mmHg, FC: 48 lpm, FR: 16 rpm Glasgow 12/15. Pupilas mióticas no reactivas. Sialorrea. No signos físicos de violencia. Resto de examen físico normal. Exámenes complementarios toxicológicos negativos. En la valoración psiquiátrica posterior: Funciones cognitivas superiores sin alteración. Presenta anhedonia. No tiene alucinaciones. ¿Cuál es la causa de mayor peso para su conducta?","opts":["Factores psicopatológicos.","Datos demográficos de riesgo.","Factores psicológicos de riesgo.","Acontecimiento situacional."],"ans":[0],"fix":0},{"id":956,"page":369,"q":"¿Qué patología respiratoria del recién nacido afecta sobretodo a prematuros y está inversamente relacionada a la edad gestacional?","opts":["Síndrome de dificultad respiratoria.","Taquipnea transitoria del recién nacido.","Aspiración de material extraño.","Aspiración de meconio."],"ans":[0],"fix":0},{"id":957,"page":369,"q":"Mujer en fase activa de trabajo de parto, con frecuencia cardíaca fetal de 130 latidos por minuto, presenta un descenso de la frecuencia cardíaca fetal de 15 latidos por minuto, que se inicia en el punto máximo de la contracción uterina y retorna a la línea basal después de que ha concluido la contracción uterina. ¿Qué tipo de desaceleración presenta?","opts":["Desaceleración tardía.","Desaceleración temprana.","Desaceleración variable.","Desaceleración prolongada."],"ans":[0],"fix":0},{"id":958,"page":369,"q":"Paciente de 29 años con 34 semanas de gestación, 60 kg de peso y sin antecedentes de interés. Acude a emergencias por dolor en hipogastrio, asociado a sangrado vaginal oscuro desde hace 4 horas. Familiar refiere que la paciente presentó pérdida de la consciencia de escasos segundos al incorporarse de la cama. Al examen físico: paciente agitada, álgica con EVA 10/10, palidez y frialdad cutáneo-mucosa, frecuencia cardiaca 115 lpm, presión arterial sistólica de 75 mmHg. ¿Cuál es el grado de choque que presenta la paciente según la escala de Basket?","opts":["Choque moderado, con pérdidas estimadas de sangre de 1500-2000 ml.","Choque compensado con pérdidas estimadas de sangre de entre 500 a 1000 ml.","Choque severo, con pérdidas estimadas de sangre de 2000 a 3000 ml.","Choque leve, con pérdidas estimadas de sangre de 1000 a 1500 ml."],"ans":[0],"fix":0},{"id":959,"page":370,"q":"Paciente femenina de 18 años, estudiante universitaria, reside en Quito. Lateralidad diestra. Hace 3 días presentó astenia, hiporexia, malestar general, alza térmica no cuantificada y 4 deposiciones diarreicas sin moco ni sangre. Hace 24 horas por primera vez presentó cefalea occipital, opresiva, con náusea y vómito en dos ocasiones. En emergencia, la TA es de 120/70 mmHg, Fc 84 LPM, temperatura bucal 38.3°C, saturación O2 (aire ambiente) 93%. La paciente esta somnolienta, orientada en persona, espacio y tiempo. El lenguaje y el fondo de ojo son normales. No hay compromiso de pares craneales, ni déficit motor. Hay rigidez de nuca y signo de Kernig. La biometría revela leucocitos 11.210 mm3; linfocitos 60%, neutrófilos 32%; Proteína C reactiva de 5.9 mg/L, glucosa sérica de 83 mg/dl. El líquido céfalo raquídeo muestra un aspecto turbio, 385 leucocitos/mm3; 70% linfocitos, proteínas de 62 mg /dL y glucosa de 50 mg/dL. ¿Cuál es el diagnóstico más probable en esta paciente?","opts":["Meningitis viral","Meningitis tuberculosa","Meningitis bacteriana aguda","Encefalitis por herpes"],"ans":[0],"fix":0},{"id":960,"page":370,"q":"Paciente asintomático, que al examen físico presenta un aumento del tiroides grado II, sin nódulos palpables. Los exámenes reportan: TSH y T3 normales, T4 total baja, colesterol alto, anticuerpos contra TPO (Transperoxidasa) negativos, la gamagrafía tiroidea pone de manifiesto un aumento difuso en la captación. Señale el diagnóstico:","opts":["Bocio difuso no tóxico.","Tiroiditis de Hashimoto.","Bocio multinodular no tóxico.","Bocio multinodular tóxico."],"ans":[0],"fix":0},{"id":961,"page":371,"q":"Varón de 68 años, evaluado en urgencias por dolor abdominal. Refiere 18 horas de dolor abdominal que se ubica en cuadrante inferior izquierdo. Antecedente de diabetes mellitus en tratamiento con metformina. Enfermedad pulmonar obstructiva crónica de hábito tabáquico en tratamiento con bromuro de ipratropium. Examen físico: Tensión arterial 140/90 mmHg, frecuencia cardíaca 110 latidos por minuto, frecuencia respiratoria 18 por minuto, T 38 °C. IMC 40 Kg/m2. Abdomen: Dolor y defensa con rebote en cuadrante inferior izquierdo. Ruidos hidroaéreos disminuidos. Laboratorio: Hemoglobina glucosilada 8.9 %. TAC abdomen: signos de imagen compatibles con diverticulitis aguda. ¿Cuál es el riesgo quirúrgico de ASA (American Society of Anesthesiologists) para este paciente?","opts":["ASA III.","ASA VI.","ASA V.","ASA IV."],"ans":[0],"fix":0},{"id":962,"page":371,"q":"El Ministerio de Salud Pública realiza anualmente una campaña de vacunación para Influenza. ¿A partir de qué edad está indicada la vacuna de gripe?","opts":["6 meses.","3 meses.","9 meses.","12 meses."],"ans":[0],"fix":0},{"id":963,"page":372,"q":"Hombre de 15 años, acude a consulta externa por odinofagia y fiebre, de 24 horas de evolución, no náuseas ni vómitos. No alteraciones del ritmo intestinal ni síntomas urinarios. Antecedentes: faringoamigdalitis estreptocócica aguda reciente. A la exploración física presenta: FC: 94 lpm. T: 38.5 ºC, FR: 20 rpm. Consciente y orientado en las tres esferas. Piel: exantema eritematoso. Exploración orofaríngea: lengua roja con descamación de las papilas, amígdalas eritematosas y faringe cubierta con una película membranosa amarilla. Linfadenopatía a nivel del cuello. Cardiopulmonar: normal. Resto de la exploración normal. Dentro de las complicaciones que puede presentar el paciente. ¿Cuál es el diagnóstico probable según el cuadro actual?","opts":["Fiebre escarlatina.","Fiebre reumática.","Glomerulonefritis posestreptocócica.","Absceso periamigdalino."],"ans":[0],"fix":0},{"id":964,"page":372,"q":"Un niño de 5 años es llevado al servicio de emergencias por cuadro de dolor abdominal en fosa iliaca derecha acompañado de vómito. Sin antecedentes prenatales ni natales de importancia. Al examen físico FC: 100/min, FR: 24/min, TA: 115/70 mmHg, temperatura: 38°C. El abdomen está suave, depresible, doloroso a la palpación en fosa iliaca derecha con reacción peritoneal a ese nivel. Se decide realizar laparoscopia diagnóstica encontrando apéndice cecal sin ninguna patología, pero a 60 cm de la válvula iliocecal presencia de un divertículo en la cara antimesentérica del íleon. ¿Cuál de los siguientes hallazgos se podría encontrar en el estudio histopatológico del divertículo?","opts":["Mucosa heterotópica gástrica o pancreática","Células ganglionares ausentes","Bandas de Ladd","Presencia de fecalito"],"ans":[0],"fix":0},{"id":965,"page":373,"q":"Una mujer de 44 años acude al servicio de emergencias por cuadro de 5 días de evolución de importante lagrimeo del ojo derecho, acompañada de dolor en la región medial del párpado inferior. No ha notado pérdida de la visión. Sus antecedentes personales incluyen hipertensión arterial hace 5 años en tratamiento con amlodipina 10 mg/ día. Al examen físico FC: 95/min, FR: 19/min, TA: 115/75 mmHg, temperatura: 37 °C. El examen ocular agudeza visual normal en ambos ojos, isocoria, reactivas a la luz. En ojo derecho: presencia de epífora, inflamación periocular con elevación mínima en la zona interna del párpado inferior por debajo del tendón cantal interno. Se ejerce leve presión sobre la zona elevada y se observa salida de una secreción purulenta de color amarillento. El hemograma muestra leucocitos de 15000 /mm3 con 88% de segmentados neutrófilos. ¿Cuál es el diagnóstico más probable de la paciente?","opts":["Dacriocistitis.","Uveítis.","Chalazión.","Absceso orbital."],"ans":[0],"fix":0},{"id":966,"page":373,"q":"Acude a su chequeo pre quirúrgico, una paciente femenina de 46 años que va a ser sometida a una histerectomía por presencia de múltiples miomas que le producen metrorragias con anemia de difícil manejo. No refiere antecedentes de importancia, viajes recientes, alergias o transfusiones. Al examen físico, la paciente se encuentra hemodinámicamente estable, conjuntivas pálidas, mucosas orales húmedas. Cardiopulmonar: ruidos rítmicos, no soplos, murmullo vesicular conservado, sin ruidos sobreañadidos. Abdomen: leve dolor a la palpación en hipogastrio. Se realiza su chequeo anestesiológico, y es autorizada realizarse su procedimiento quirúrgico. ¿Qué conducta en cuanto a profilaxis antibiótica tendría en este caso?","opts":["Ampicilina + sulbactam 1 hora antes de la cirugía.","Levofloxacina por 3 días.","Ceftriaxona + metronidazol 1 sola dosis antes de cirugía.","Ciprofloxacina 1 hora antes de cirugía y mantener por 2 días."],"ans":[0],"fix":0},{"id":967,"page":374,"q":"Un paciente de 5 años presenta hace 3 días fiebre, tos seca, rinorrea y congestión ocular. Hoy la fiebre se incrementa a 40 °C y se acompaña de un exantema máculo - papular rojizo, confluente que inicia en la línea de implantación del cabello. ¿Cuál es el diagnóstico más probable?","opts":["Sarampión.","Varicela.","Exantema súbito.","Eritema infeccioso."],"ans":[0],"fix":0},{"id":968,"page":374,"q":"Respecto a la tuberculosis pleural, señale la opción correcta:","opts":["Se caracteriza por fiebre persistente, sudoración nocturna y pérdida de peso.","Representa el 40 % de los casos de tuberculosis extra pulmonar.","Cursa con dolor torácico tipo opresivo.","Presenta típicamente radiopacidad homogénea bilateral en la radiografía de tórax."],"ans":[0],"fix":0},{"id":969,"page":374,"q":"En relación al tratamiento del síndrome nefrótico en el adulto, seleccione la afirmación adecuada:","opts":["La hiperlipemia debe tratarse de forma enérgica, siendo las estatinas los fármacos de elección si se usa monoterapia.","La furosemida está contraindicada en el manejo de los edemas por el elevado riesgo de insuficiencia renal prerrenal.","Una dieta hiperproteica está indicada para compensar las pérdidas renales y evitar la progresión de la lesión glomerular.","Los antiagregantes plaquetarios son fármacos de primera línea en presencia de fenómenos tromboembólicos periféricos."],"ans":[0],"fix":0},{"id":970,"page":375,"q":"Varón de 10 meses consulta porque hace 3 días presentó fiebre durante 24 horas. Ese día vomitó dos veces. Desde entonces tiene tos, rinitis, conjuntivitis y deposiciones abundantes y acuosas, en número de 4-6 al día. No tiene sangre en las deposiciones, pero sí moco. La madre refiere que ha seguido dieta con leche al medio y alimentación astringente, con aporte de un vaso de SRO tras cada deposición suelta, sin notar mejoría. El niño asiste a guardería. Examen físico: peso: 9.800 g. (p50); talla: 73 cm. (p50). Buen estado general y de hidratación. Mucosas húmedas, masa muscular eutrófica. Afebril. Abdomen distendido, con timpanismo y borborigmos, no doloroso. Importante eritema en el área del pañal. Hiperemia orofaríngea y conjuntival. Resto de la exploración física es normal. ¿Cuál es la opción más adecuada para su diagnóstico?","opts":["Análisis eminentemente clínico.","Biometría, urea, glucosa, creatinina.","Radiografía de abdomen.","Coprocultivo."],"ans":[0],"fix":0},{"id":971,"page":375,"q":"Paciente de 8 años, 32 kg de peso con diagnóstico de escarlatina. ¿Cuál es la etiología y el tratamiento adecuado?","opts":["Streptococcus pyogenes, penicilina G benzatínica 1 200 000 UI IM, una dosis.","Streptococcus pyogenes, penicilina G benzatínica 600 000 UI IM, una dosis.","Streptococcus pyogenes, penicilina G benzatínica 600 000 UI IM, una dosis.","Staphylococcus aureus, penicilina G benzatínica 1´200.000 UI IM. una dosis."],"ans":[0],"fix":0},{"id":972,"page":376,"q":"Una Mujer de 30 años acude a consulta por presentar flujo vaginal de mal olor que se intensifica durante la relación sexual; niega síntomas irritativos, niega disuria. No tiene antecedentes personales de importancia. Vida sexual activa sin protección, 1 pareja sexual. Al examen físico de la región inguino genital: secreción grisácea en el vestíbulo vaginal, al examen especular paredes vaginales normales, flujo grisáceo homogéneo espumoso de mal olor, el cérvix tiene aspecto macroscópico normal. La medición del PH vaginal con papel de nitrazina es de 5. Al tacto vaginal: útero de tamaño y consistencia normal, no hay dolor a la lateralización cervical, los anexos no son palpables. Prueba de KOH positiva. El gram y fresco de secreción vaginal reporta la presencia de células clave. ¿Cuál de los siguientes es el agente infeccioso causal más probable?","opts":["Gardnerella vaginalis","Cándida albicans","Trichomona vaginalis","Chlamydia trachomatis"],"ans":[0],"fix":0},{"id":973,"page":376,"q":"Un hombre de 50 años es evaluado en la emergencia de un hospital a causa de dolor torácico retroesternal de 30 minutos de evolución. A primera vista se le ve ansioso, disneico, diaforético. Sus signos vitales evidencian una TA: 175/110 mmHg, FC: 110 lpm, FR: 30 x min, SatO2: 94 % al aire ambiente, corazón rítmico, sin soplos ni frotes, pulmones sin hallazgos pertinentes, pulsos distales sincrónicos y simétricos. Un ECG informa una elevación del ST en V2-V4. Inmediatamente se ordena administrar: aspirina masticada, oxígeno por catéter nasal a 2 lts/min, nitroglicerina sublingual y morfina IV. Sin embargo, el dolor no cede. ¿Qué acción terapéutica sería más apropiada para este paciente en este momento?","opts":["Administrar un activador del plasminógeno tisular","Administrar un calcio antagonista sublingual","Administrar un inhibidor IECA intravenoso","Administrar un betabloqueador intravenoso"],"ans":[0],"fix":0},{"id":974,"page":377,"q":"Indique el mejor método diagnóstico imagenológico para pancreatitis:","opts":["Tomografía abdominal con contraste.","Radiografía abdominal simple.","Ecografía abdominal.","Colangiopancreatografía por resonancia."],"ans":[0],"fix":0},{"id":975,"page":377,"q":"Paciente femenina de 55 años acude por presentar ictericia de 2 días de evolución. Su cuadro se acompaña de astenia, adinamia de varios meses de evolución. Como antecedentes, refiere ser hipertensa, toma amlodipina 5 mg QD. Antecedentes quirúrgicos: histerectomía post parto hace 20 años, por lo que recibió transfusiones sanguíneas. Niega consumo de alcohol, tabaco, drogas o viajes recientes. Además indica prurito en miembros inferiores desde hace 3 semanas que empeora en las noches. Acudió dónde médico general que le indicó cremas humectantes y cetirizina sin mejoría del prurito. Al examen físico, los signos vitales están normales. Se evidencia ictericia escleral y sublingual. Cardiopulmonar: normal. Abdomen: blando, depresible, no doloroso a la palpación, ruidos presentes. A la percusión, el hígado mide 14 cm en línea medio clavicular derecha, abdomen timpánico. No esplenomegalia. No edema en miembros inferiores, se evidencian lesiones por rascado. Examen neurológico normal. ¿A qué podría deberse su ictericia?","opts":["Colangitis biliar primaria.","Hepatitis A.","Colelitiasis.","Sindrome de Gilbert."],"ans":[0],"fix":0},{"id":976,"page":377,"q":"Mujer de 45 años es ingresada para realización de cirugía programada de excéresis de tumor en el piso de la boca, en el lado izquierdo. El procedimiento se realiza sin aparentes complicaciones, pero al control postoperatorio a los dos meses, al examen físico se observa debilidad al volver la cabeza hacia la derecha, con deterioro de la abducción de la extremidad superior izquierda a la altura del hombro. ¿Qué estructura se lesionó con mayor probabilidad durante la cirugía?","opts":["Nervio espinal accesorio.","Nervio supraescapular.","Nervio torácico largo.","Tronco inferior del plexo braquial."],"ans":[0],"fix":0},{"id":977,"page":378,"q":"Paciente de 26 años, primigesta de 12 semanas. Refiere que desde hace 2 semanas presenta astenia. Los resultados de laboratorio muestran: Hb 10.6 g/dL, Hto 31 %, VCM: 82 fL, leucocitos 11.950, Neutrófilos 60 %, linfocitos 34 %, eosinófilos 2 %, monocitos 1 %, basófilos 2 %, plaquetas 150.000/ul. Glucosa 91 mg/dL, creatinina 0.7 mg/dL. ¿Cuál es la sospecha diagnóstica?","opts":["Anemia leve normocítica.","Anemia leve microcítica.","Anemia moderada normocítica.","Anemia moderada microcítica."],"ans":[0],"fix":0},{"id":978,"page":378,"q":"Una mujer de 65 años acude a consulta médica por cuadro de dolor a tes y bradicardia persistente:","opts":["Categoría III.","Categoría I.","Categoría II.","Categoría IV."],"ans":[0],"fix":0},{"id":987,"page":381,"q":"Identifique un hallazgo radiográfico en apendicitis aguda.","opts":["Mala definición de la línea grasa del músculo psoas del lado derecho.","Cambios inflamatorios de la grasa circundante del apéndice.","Realce anormal y heterogéneo de la pared apendicular.","El edema submucoso o estratificación que configura el signo de la ‘Diana’"],"ans":[0],"fix":0},{"id":988,"page":382,"q":"Una mujer de 23 años es trasladada por sus padres a la emergencia de un hospital. En las últimas 12 horas ha presentado un estado de confusión y agitación, se contorsiona y se queja de malestar abdominal. Al examen físico se nota una marcada diaforesis. Los signos vitales son normales, con excepción de la temperatura (rectal): 39.6 °C. Se le practicó una biometría y estudio de líquido cefalorraquídeo, los cuales fueron normales. Al indagar a sus padres con mayor énfasis, se conoce que había estado en tratamiento de esquizofrenia con clorpromazina. ¿Cuál es un potencial efecto de este medicamento?","opts":["Síndrome neuroléptico maligno.","Reacción distónica aguda.","Acatisia.","Disquinesia tardía."],"ans":[0],"fix":0},{"id":989,"page":382,"q":"Complete el enunciado, seleccionando la combinación correcta, con relación al manejo de la hipoglicemia neonatal en la encefalopatía hipóxica isquémica: La hipoglicemia neonatal se debe tratar con dextrosa al 10 % en una infusión de ___ mg/kg/minuto, para lograr una cifra objetivo de glicemia entre _______ mg/dl.","opts":["6; 50 a 120.","10; 70 a 130.","15; 80 a 130.","10; 50 a 120."],"ans":[0],"fix":0},{"id":990,"page":382,"q":"Un signo de cetoacidosis diabética es:","opts":["Hipotensión.","Hipertensión.","Hiperactividad.","Bradipnea."],"ans":[0],"fix":0},{"id":991,"page":383,"q":"Mujer de 15 años acude a consulta externa por hirsutismo. Su molestia inicia hace 6 meses, cuando empieza tratamiento farmacológico para cuadro de movimientos involuntarios de mano derecha, de aparición súbita que combinan flexión con extensión. Niega antecedentes médicos de importancia. Asintomática. Al examen físico: Índice de masa corporal 22 Kg/m2, tensión arterial 120/80 mmHg, frecuencia cardíaca 80 latidos por minuto, frecuencia respiratoria 14 por minuto, T 37 °C. Boca: Hipertrofia gingival. No focalidad neurológica. Laboratorio: Hemoglobina 13.5 g/dL, hematocrito 40 %, leucocitos 6000 k/µL, plaquetas 150.000 k/µL. alt 25 U/L. ¿Cuál fármaco es el responsable del efecto adverso del motivo de consulta?","opts":["Fenitoína.","Ácido valproico.","Carbamazepina.","Lamotrigina."],"ans":[0],"fix":0},{"id":992,"page":383,"q":"¿Cuál de los siguientes signos o síntomas en un paciente con pancreatitis aguda es un factor de riesgo de gravedad?","opts":["Obesidad, índice de masa corporal mayor de 30.","Dolor abdominal intenso 10/10.","Hiperamilasemia elevada 4 veces o más de su valor normal.","Imágenes tomográficas de adherencias peripancreáticas."],"ans":[0],"fix":0},{"id":993,"page":383,"q":"Señale la complicación que se asocia a menor sobrevida en pacientes con diabetes mellitus tipo 2:","opts":["Coronariopatía.","Retinopatía.","Nefropatía.","Neuropatía."],"ans":[0],"fix":0},{"id":994,"page":384,"q":"En la pelvis materna los límites del estrecho superior incluyen:","opts":["Atrás limitado por el promontorio del sacro y a los lados por la cresta pectínea.","Atrás limitado por la cresta pectínea y adelante por la sínfisis del pubis.","A los lados limitado por promontorio del sacro y adelante por la sínfisis del pubis.","A los lados limitado por las alas del sacro y adelante por la cresta pectínea."],"ans":[0],"fix":0},{"id":995,"page":384,"q":"Un hombre de 75 años, diabético insulinodependiente, hipertenso y con antecedentes de angina de pecho y cirugía de carótida derecha hace 3 años por estenosis ateroesclerótica, consulta por dolor epigástrico posprandial de 30 minutos de duración que cede esp tico más probable?","opts":["Anemia de enfermedad crónica.","Anemia sideroblástica.","Talasemia mayor.","Anemia ferropénica."],"ans":[0],"fix":0},{"id":1001,"page":387,"q":"Una mujer de 55 años ha venido experimentando desde hace unos 5 años episodios de vértigo rotatorio, recurrente, en forma de episodios que se inician con sensación de plenitud ótica derecha, que duran entre 2 y 3 horas y que posteriormente durante unos días cursa con inestabilidad para la deambulación. No hay náusea, no se relaciona con los cambios posicionales. Asimismo, la paciente refiere acúfenos en oído derecho e hipoacusia fluctuante. Como parte de su estudio, se le solicita una RM craneal, cuyo reporte es normal; además una audiometría que evidencia una hipoacusia neurosensorial moderada en el oído derecho. ¿Cuál sería el diagnóstico más probable?","opts":["Enfermedad de Meniëre.","Vértigo de origen central.","Vértigo posicional paroxístico benigno.","Schwannoma del nervio vestibular."],"ans":[0],"fix":0},{"id":1002,"page":387,"q":"Un lactante de 4 meses recibió hoy la vacuna pentavalente. ¿Cuál de estas opciones muestra el espectro de microorganismos para los cuales se generará la protección inmunológica?","opts":["Hepatitis B, H. influenzae, difteria, tétanos y tosferina.","Difteria, tétanos, tosferina, virus influenza y hepatitis B.","Haemophilus influenzae, difteria, tétanos, tosferina y polio.","Neumococo, rotavirus, virus influenza, polio y difteria."],"ans":[0],"fix":0},{"id":1003,"page":387,"q":"Un niño de 2 años acude a emergencia por presentar desde hace 2 días fiebre, vómito e irritabilidad. En el examen físico se encuentra letargia, signos de Kernig y Brudzinski positivos. El Gram del líquido cefalorraquídeo arroja como resultado un coco bacilo Gram negativo. ¿Cuál de las siguientes opciones corresponderá al agente etiológico más probable?","opts":["Haemophilus influenzae.","Escherichia coli.","Listeria monocitogenes.","Neisseria meningitidis."],"ans":[0],"fix":0},{"id":1004,"p dministren los medicamentos necesarios para evitar mayores sufrimientos, pero en ningún caso para prolongar su vida artificialmente. Seleccione la opción correcta en relación a la ejecución de este testamento vital, si luego de otra opinión autorizada, no existen posibilidades de una sobrevida adecuada:","opts":["El médico debe cumplir con la voluntad del paciente.","Una junta de médicos debe decidir su posible cumplimiento.","El Comité de Bioética de la institución debe decidir su aplicación.","El médico por compromiso con la vida, diferirá todo lo posible su aplicación."],"ans":[0],"fix":0},{"id":1188,"page":451,"q":"Una paciente recibe diagnóstico de cáncer de mama. Por medio de consentimiento informado, solicita al médico que solamente le proporcione analgésicos. Rechaza cirugía y quimioterapia. Seleccione el principio de la Bioética al que corresponde la decisión de la paciente:","opts":["Principio de autonomía.","Consentimiento informado.","Principio de justicia.","Principio de beneficencia."],"ans":[0],"fix":0},{"id":1189,"page":452,"q":"El desarrollo de la vacuna para el Covid-19 se realizará con voluntarios sanos que acepten participar en la fase clínica de la investigación. Los investigadores deberán aplicar el principio Bioético de autonomía mediante el consentimiento informado. Seleccione otro principio fundamental que deberán aplicar los investigadores:","opts":["No maleficencia.","Justicia.","Beneficencia.","Respeto de la vulnerabilidad humana e integridad personal."],"ans":[0],"fix":0},{"id":1190,"page":452,"q":"En el desarrollo de un nuevo fármaco para el tratamiento del Covid-19 se requiere la participación de voluntarios sanos. Los investigadores deberán aplicar el principio Bioético de no maleficencia durante el proceso de investigación. Seleccione otro principio fundamental que deberán aplicar los investigadores:","opts":["Autonomía.","Justicia.","Beneficencia.","Responsabilidad social."],"ans":[0],"fix":0},{"id":1191,"page":452,"q":"Seleccione l paciente es bien conocido que los antioxidantes previenen el desarrollo del cáncer en varios órganos. Usted conoce que no hay ninguna evidencia sólida en este sentido y que al contrario hay datos que sugieren que algunos antioxidantes podrían incrementar el riesgo de cáncer de pulmón. ¿Cuál es la conducta más apropiada en este caso?","opts":["Explicar al paciente la evidencia disponible y negarse a prescribir el tratamiento.","Explicar al paciente la evidencia disponible y prescribir un antioxidante si hay insistencia del paciente.","Indicarle al paciente que usted no va a prescribir una sustancia que no tiene evidencia y que usted no puede ser su médico tratante.","Explicarle al paciente que no hay evidencia sólida, solicitarle que firme un"],"ans":[0],"fix":0},{"id":1197,"page":455,"q":"Varón de 23 años acude a consulta particular de dermatología por problemas de acné. Refiere que lleva varios años con distintos tratamientos pero no ha obtenido el resultado esperado. No refiere antecedentes de importancia. Al examen físico los signos vitales son normales y se objetivan varias lesiones nódulo – quísticas en cara, cuello y espalda. Al considerar un cuadro crónico y refractario el especialista decide empezar tratamiento con isotretinoína. Se le informa al paciente que la isotretinoína empeora las lesiones durante las primeras semanas, según lo expuesto. ¿Qué información se está explicando al paciente?","opts":["Efectos adversos.","Descripción del tratamiento.","Alternativas disponibles.","Recomendaciones del médico."],"ans":[0],"fix":0},{"id":1198,"page":455,"q":"Mujer de 25 años, acude a emergencias de una clínica privada por odinofagia y alza térmica no cuantificada de 2 días de evolución. No tiene antecedentes importantes. Al examen físico presenta signos vitales normales. ORF: discreto eritema en pared posterior faríngea, sin placas ni exudados. Resto de la exploración normal. El médico que valora a la paciente, solicita exámenes con el fin de hospitalizarla y obtener un beneficio económico. Los exámenes son normales, pero le dice a la paciente que están alterados y que necesita ser hospitalizada. Con esta información, la paciente siente temor y acepta el ingreso. ¿Qué tipo de mecanismo utiliza el médico para influir en la decisión de la paciente?","opts":["Manipulación informacional.","Persuasión.","Manipulación psicológica.","Amenaza psicológica."],"ans":[0],"fix":0},{"id":1199,"page":456,"q":"El Hospital Judío de Enfermedades Crónicas (Jewish Chronic Disease Hospital), inoculó células cancerosas a pacientes ancianos sin su consentimiento. Este experimento se lo hizo bajo la hipótesis de que dichas células serían rechazadas. La falta de consentimiento. ¿Qué principio bioético quebrantó?","opts":["Autonomía.","Beneficencia.","Justicia.","Valor."],"ans":[0],"fix":0},{"id":1200,"page":456,"q":"Lactante de tres meses con malformación cerebral congénita, escafocefalia e hidrocefalia. Se halla con diagnóstico presuntivo de meningoencefalitis. El médico tratante ha sugerido un procedimiento invasivo para obtener líquido céfalo raquídeo. Los padres del lactante son mayores de edad en unión estable, ambos con educación superior. ¿Quién debe firmar el consentimiento informado escrito para autorizar este procedimiento?","opts":["Profesional y padre o madre.","Padre o madre.","Ambos progenitores.","Abuelos que viven con lactante."],"ans":[0],"fix":1}];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
function nav(){const t=[['home','Akèy'],['search','Chèche'],['stats','Pwogrè']];$('#nav').innerHTML=t.map(([k,n])=>`<button class="${tab==k&&!ses?'on':''}" onclick="stopT();tab='${k}';ses=null;draw()"><svg viewBox="0 0 24 24">${IC[k]}</svg>${n}</button>`).join('')}
function draw(){nav();$('#pg i').style.width=ses?(ses.fin?100:(ses.i+1)/ses.l.length*100)+'%':'0';$('#tm').hidden=!(ses&&ses.exam&&!ses.fin);ses?quiz():tab=='home'?home():tab=='search'?search():stats()}
function home(){const d=Object.values(S.done),n=d.length,ok=d.filter(x=>x==1).length,w=n-ok;
$('#app').innerHTML=`<div class="card"><h3>Vi d'ansanm</h3><div class="row sp"><b style="font-size:26px">${Math.round(n/Q.length*100)}%</b><span class="m">${n} / ${Q.length} kesyon fèt</span></div><div class="bar"><i style="width:${n/Q.length*100}%"></i></div>
<div class="kpi"><div><b>${n?Math.round(ok/n*100):0}%</b><span>Presizyon</span></div><div><b>${w}</b><span>Pou revize</span></div><div><b>${S.fav.length}</b><span>Make ★</span></div></div></div>
<div class="card"><h3>Pratike</h3><div class="row"><select id="mode"><option value="all">Tout kesyon</option><option value="new">Sa m poko fè</option><option value="wrong">Sa m te rate</option><option value="fav">Sa m make</option></select>
<select id="ord"><option value="seq">Nan lòd</option><option value="rnd">Aleyatwa</option></select></div>
<div class="row" style="margin:10px 0"><span class="m">Paj PDF</span><input id="p1" type="number" placeholder="de" style="width:76px"><input id="p2" type="number" placeholder="rive" style="width:76px"></div>
<button class="pri" onclick="start(false)">Kòmanse</button></div>
<div class="card"><h3>Simulasyon egzamen</h3><p class="m" style="margin-top:0">Kesyon aleyatwa, 1 minit pa kesyon, repons yo parèt nan fen.</p><div class="row"><select id="nx"><option>25</option><option>50</option><option selected>100</option><option>200</option></select><button class="pri" onclick="start(true)">Kòmanse egzamen</button></div></div>`}
function start(exam){let l=Q;if(exam){l=shuffle(Q).slice(0,+$('#nx').value)}else{const m=$('#mode').value,a=+$('#p1').value||0,b=+$('#p2').value||9999;
l=Q.filter(q=>q.page>=a&&q.page<=b&&(m=='all'||(m=='new'&&!(q.id in S.done))||(m=='wrong'&&S.done[q.id]===0)||(m=='fav'&&S.fav.includes(q.id))));if($('#ord').value=='rnd')l=shuffle(l)}
if(!l.length){alert('Pa gen kesyon pou seleksyon sa a.');return}ses={l,i:0,exam,ans:{},fin:false,left:l.length*60};if(exam)runT();draw()}
let TI=null;function stopT(){clearInterval(TI)}
function runT(){stopT();TI=setInterval(()=>{if(!ses||!ses.exam||ses.fin){stopT();return}ses.left--;if(ses.left<=0){finish();return}tick()},1000)}
function tick(){const m=Math.floor(ses.left/60),s=ses.left%60;$('#tm').textContent=m+':'+String(s).padStart(2,'0')}
function finish(){const s=ses;if(s.exam)for(const q of s.l)S.done[q.id]=s.ans[q.id]==q.ans[0]?1:0;save();s.fin=true;stopT();draw()}
function quiz(){const s=ses;if(s.fin)return result();const q=s.l[s.i],a=s.ans[q.id],sh=a!==undefined&&!s.exam;if(s.exam)tick();
$('#app').innerHTML=`<div class="row sp" style="margin-bottom:10px"><span class="m">Kesyon ${s.i+1} / ${s.l.length} · paj ${q.page} · #${q.id}</span><button onclick="fav(${q.id})" style="padding:6px 12px">${S.fav.includes(q.id)?'★':'☆'}</button></div>
<div class="card"><p class="q" style="margin-top:0">${esc(q.q)}</p>${q.img?'<img src="'+q.img+'" alt="imaj kesyon" style="max-width:100%;border-radius:12px;margin:4px 0 8px;display:block" onclick="zoomI(this.src)">':''}
${ord(q).map((r,k)=>`<button class="opt ${sh?(r==q.ans[0]?'ok':r==a?'ko':''):(s.exam&&r==a?'sel':'')}" onclick="pick(${r})"><span class="l">${L[k]}</span><span>${esc(q.opts[r])}</span></button>`).join('')}</div>
<div class="foot"><button onclick="go(-1)">←</button><button class="pri" onclick="go(1)">${s.i==s.l.length-1?(s.exam?'Remèt egzamen':'Fini'):'Swivan →'}</button><button onclick="stopT();ses=null;draw()">Kite</button></div>`}
function ord(q){ses.ord=ses.ord||{};return ses.ord[q.id]||(ses.ord[q.id]=q.fix?[0,1,2,3]:shuffle([0,1,2,3]))}
function zoomI(src){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:grid;place-items:center;padding:10px';d.innerHTML='<img src="'+src+'" style="max-width:100%;max-height:100%">';d.onclick=()=>d.remove();document.body.appendChild(d)}
function pick(k){const s=ses,q=s.l[s.i];if(s.ans[q.id]!==undefined&&!s.exam)return;s.ans[q.id]=k;if(!s.exam){const ok=k==q.ans[0]?1:0;S.done[q.id]=ok;save()}quiz()}
function go(d){const s=ses;s.i+=d;if(s.i<0)s.i=0;if(s.i>=s.l.length){s.i=s.l.length-1;finish();return}draw()}
function fav(id){const i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);save();quiz()}
function result(){const s=ses;const ok=s.l.filter(q=>s.ans[q.id]==q.ans[0]),bad=s.l.filter(q=>s.ans[q.id]!=q.ans[0]),p=Math.round(ok.length/s.l.length*100);
$('#app').innerHTML=`<div class="card" style="text-align:center"><h3>Rezilta</h3><b style="font-size:48px;color:${p>=60?'var(--ok)':'var(--ko)'}">${p}%</b><p class="m">${ok.length} bon sou ${s.l.length}</p><div class="row" style="justify-content:center"><button class="pri" onclick="ses={l:bad,i:0,exam:false,ans:{},fin:false};draw()" ${bad.length?'':'disabled'}>Revize ${bad.length} fot yo</button><button onclick="ses=null;draw()">Akèy</button></div></div>`}
function search(){$('#app').innerHTML=`<input id="sq" placeholder="Chèche yon mo (ex: tuberkiloz)" style="width:100%;margin-bottom:12px" oninput="doS()"><div id="sr"></div>`;}
function doS(){const t=$('#sq').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(t.length<3){$('#sr').innerHTML='';return}
const f=Q.filter(q=>(q.q+q.opts.join(' ')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(t));
$('#sr').innerHTML=`<p class="m">${f.length} rezilta${f.length>40?' (40 premye yo)':''}</p>`+f.slice(0,40).map(q=>`<div class="card"><p>${esc(q.q)}</p><p style="padding:10px;border-radius:10px;background:rgba(21,128,61,.12);border:1px solid var(--ok)"><b>${L[q.ans[0]]}.</b> ${esc(q.opts[q.ans[0]])}</p><span class="m">paj ${q.page} · #${q.id}</span></div>`).join('')}
function stats(){const d=Object.values(S.done),ok=d.filter(x=>x==1).length;
$('#app').innerHTML=`<div class="card"><h3>Pwogrè</h3><div class="kpi"><div><b>${d.length}</b><span>Fèt</span></div><div><b>${ok}</b><span>Bon</span></div><div><b>${d.length-ok}</b><span>Move</span></div></div><p class="m">Presizyon: ${d.length?Math.round(ok/d.length*100):0}% · Rete: ${Q.length-d.length} kesyon</p><button onclick="if(confirm('Efase tout pwogrè?')){S={done:{},fav:[]};save();draw()}">Rekòmanse nan zewo</button></div>`}
document.addEventListener('keydown',e=>{if(!ses||ses.fin||/INPUT|SELECT/.test(e.target.tagName))return;const k={a:0,b:1,c:2,d:3,1:0,2:1,3:2,4:3}[e.key.toLowerCase()];if(k!==undefined)pick(ord(ses.l[ses.i])[k]);else if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1)});
draw();
</script></body></html>
