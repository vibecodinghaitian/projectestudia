uadro?","opts":["Conversión","Disociación","Hipocondriasis","Patofobia (fobia específica)"],"ans":[0],"fix":0},{"id":637,"page":245,"q":"Paciente de 40 años que consulta por presentar masa en el cuello, pelo quebradizo, disminución de la sudoración, calambres, aumento de peso y estreñimiento. Al examen físico: TA: 130/80 mmHg, FC: 60 x min, párpados edematosos, masa palpable en el cuello, irregular y de consistencia firme, indolora y fija, TSH elevado, T4 baja, anticuerpos antiperoxidasa tiroidea (TPO) elevados. ¿Cuál es el diagnóstico más probable en este paciente?","opts":["Tiroiditis de Hashimoto.","Adenoma hipofisario productor de TSH.","Hipotiroidismo secundario.","Enfermedad de Graves."],"ans":[0],"fix":0},{"id":638,"page":245,"q":"Al revisar los resultados de pruebas tiroideas de una paciente, usted piensa en la existencia de hipotiroidismo subclínico. Seleccione el patrón de resultados que se corresponde con esa impresión diagnóstica:","opts":["TSH elevada, T3 normal, FT4 normal.","TSH normal, T3 normal, FT4 normal.","TSH baja, T3 baja, FT4 baja.","TSH normal, T3 baja, FT4 baja."],"ans":[0],"fix":0},{"id":639,"page":246,"q":"¿En qué porcentaje las infecciones maternas virales, bacterianas, protozoarias y por espiroquetas se vinculan a los casos de restricción de crecimiento fetal intrauterino?","opts":["5 %","30 %","15 %","50 %"],"ans":[0],"fix":0},{"id":640,"page":246,"q":"Femenina de 70 años, fumadora de larga data, con antecedente de hipertensión arterial, diabetes mellitus tipo II y dislipidemia, con aorta tricúspide según ecocardiograma de rutina, que presenta dolor torácico intenso de comienzo brusco y conlleva al síncope. Se sospecha una disección aórtica. ¿Cuáles son los factores de riesgo que presenta esta paciente para dicha patología?","opts":["Edad, tabaquismo, hipertensión arterial, dislipidemia.","Sexo femenino, edad, hipertensión arterial, diabetes mellitus.","Hipertensión arterial, tabaquismo, diabetes mellitus, aorta tricúspide.","Aorta tricúspide, edad, hipertensión arterial, diabetes mellitus."],"ans":[0],"fix":0},{"id":641,"page":246,"q":"Un paciente de 45 años, diestro de lateralidad, sufre una caída mientras conducía su moto sin portar casco; sufre un impacto directo en la región temporal derecha y permanece inconsciente en la calzada por 10 minutos. La evaluación en emergencia revela TA: 140/90 mmHg, Fc: 84 LPM, Fr: 16 por minuto, T: 37 °C, el paciente esta desorientado en espacio y tiempo, hay otorragia derecha, las pupilas son isocóricas de 2 mm de diámetro, no hay déficit motor, ni signos meníngeos. Una TAC simple de cráneo revela una fractura a nivel del hueso temporal derecho y un hematoma agudo subdural laminar frontal izquierdo sin efecto de masa sobre el parénquima cerebral adyacente. ¿Cuál de los siguientes pares craneales del lado derecho se encontraría afectado en este paciente?","opts":["Facial.","Motor ocular interno.","Patético.","Trigémino."],"ans":[0],"fix":0},{"id":642,"page":247,"q":"¿Cuál es una de las complicaciones más frecuentes del cuadro de ataque de pánico?","opts":["Trastornos depresivos.","Drogadicción.","Abuso de tabaco.","Trastorno de personalidad."],"ans":[0],"fix":0},{"id":643,"page":247,"q":"Mujer de 50 años, acude a su consulta por debilidad intensa, fatiga y pérdida de peso desde hace 1 semana, acompañado de náusea en las mañanas que no llega al vómito. Antecedentes personales: artritis reumatoidea en tratamiento con prednisona 20 mg /día por 4 meses, metrotexato 15 mg semanal, medicación que suspende por decisión propia hace 1 semana. Al examen físico presenta: TA: 80/50 mmHg, FC: 90/min, FR: 20/min, SatO2: 94% en aire ambiente. T: 36.5 °C. Se objetiva mucosas orales secas, sudoración excesiva en la cara y en las palmas, resto de la exploración normal. La analítica sanguínea muestra: hemograma normal, glucosa 65 mg/dl, cortisol am 3.5 mcg/dl (5 a 25 mcg/dL); TSH: 2.35 mUI/L (0.37 y 4.7 mUI/L); T4L: 1.5 ng/dl. (0.9 a 2.3 ng/dL). ¿Cuál es el diagnóstico más probable?","opts":["Insuficiencia suprarrenal aguda.","Diabetes mellitus.","Hipotiroidismo.","Hipertiroidismo."],"ans":[0],"fix":0},{"id":644,"page":247,"q":"Mujer de 68 años, acude a emergencias por presentar desde hace 3 días periodos fluctuantes de somnolencia que alterna con vigilia, desatención, inquietud, agitación psicomotriz y visualización de personas que no están presentes. Estas manifestaciones empeoran en la noche. Tuvo infección urinaria hace 5 días, tratada con antibiótico oral. Examen físico: TA: 90/60 mmHg, FC: 84 lpm, FR: 19 rpm, T: 38,5 °C. Paciente obnubilada, desorientada en tiempo, febril, inquietud psicomotriz, lenguaje confuso incoherente. ¿Cuál es el diagnóstico más probable?","opts":["Síndrome confusional.","Demencia.","Esquizofrenia.","Depresión."],"ans":[0],"fix":0},{"id":645,"page":248,"q":"Un escolar de 11 años acude a la consulta por presentar edema palpebral moderado, cefalea y astenia. Su madre refiere que la orina es de color rojizo. Al examen físico, el paciente está algo pálido y a nivel regional se observa un discreto edema bi-maleolar. Los signos vitales al momento son: FC: 72 x 1´; FR: 28 x 1´; TA: 130/90. Al indagar a fondo sobre la historia del paciente, su madre refiere que hace dos semanas aproximadamente presentó sintomatología compatible con la escabiosis, proceso que le generó algunas lesiones supurativas, que han disminuido luego de baños con agua de matico. El examen de orina demuestra la presencia de piocitos 5-6 por campo, innumerables hematíes dismórficos por campo, presencia de cilindros hialinos y una densidad normal. Los resultados del examen de sangre regresan con la novedad de tener la fracción C3 del complemento disminuida mientras que la albúmina plasmática esta en 4.5 g/dl. Con este cuadro. ¿Cuál es el diagnóstico más probable?","opts":["Glomerulonefritis aguda post estreptocócica.","Glomerulonefritis en el curso de una púrpura de Schönlein-Henoch","Síndrome nefrótico.","Pielonefritis aguda."],"ans":[0],"fix":0},{" "ans":[0],"fix":0},{"id":683,"page":262,"q":"Paciente femenina de 42 años con diagnóstico de cáncer de mama, se encuentra en tratamiento luego de una mastectomía radical con quimioterapia por ganglio centinela positivo. Finaliza hace 6 días su 4to ciclo con 5FU, metotrexato y ciclofosfamida. Presentó inicialmente sequedad en la boca después de 3 días, y actualmente presenta dolor intenso y dificultad para alimentarse: tolera líquidos, pero tiene dificultad para tragar sólidos. Al examen físico, presenta signos vitales estables, con temperatura de 37.6 °C. ¿Qué esperaría encontrar al examen físico en la orofaringe?","opts":["Eritema y úlceras.","Amigdalas hipertróficas.","Pus en pilares amigdalinos.","Absceso dental."],"ans":[0],"fix":0},{"id":684,"page":262,"q":"Una mujer de 35 años cursando embarazo de 39 semanas, acude a emergencia con dolor abdominal tipo contracción uterina de tres horas de evolución, que se intensifica desde hace 1 hora, se acompaña de expulsión de tapón mucoso y sensación de pujo. Como antecedentes de importancia tiene diabetes gestacional, diagnosticada a las 28 semanas, controlada con dieta y ejercicio. Antecedentes obstétricos: G2, P1. Al examen físico: Peso 70 kg; Talla 1.65 m; TA 100/70 mmHg; abdomen gestante, altura del fondo uterino en epigastrio, feto en presentación cefálica, dorso izquierdo FCF 134 latidos/min. Actividad uterina 3 contracciones en 10 minutos. En la región inguino genital: cabeza fetal en piso pélvico. Se atiende el parto céfalo vaginal, posterior al nacimiento de la cabeza, la rotación externa no se completa por una impactación del hombro anterior fetal en la sínfisis del pubis de la madre. ¿Cuál de las siguientes intervenciones es la más adecuada a realizar en este momento?","opts":["Maniobra de McRoberts.","Maniobra de Kristeller.","Maniobra de sacacorchos de Woods.","Fractura clavicular."],"ans":[0],"fix":0},{"id":685,"page":263,"q":"¿Cuál es la dosis inicial de hormona tiroidea en un paciente adulto con hipotiroidismo?","opts":["1.6 mcg/kg de peso por día.","0.8 mcg/kg de peso por día.","0.6 mcg/kg de peso por día.","3.6 mcg/kg de peso por día."],"ans":[0],"fix":0},{"id":686,"page":263,"q":"Un niño de 6 años, que vive en una región tropical del país, acude a consulta porque en los últimos 10 días presenta tos y esputo sanguinolento. Además, dolor abdominal ocasional, así como deposiciones diarreicas abundantes y con moco, que se producen por temporadas, desde hace un año. Ocasionalmente presenta también vómitos. En este año, por tres ocasiones presentó lesiones irregulares, longilíneas, a manera de trayectos indurados, eritematosos y pruriginosos en tórax, abdomen, glúteos y miembros inferiores. Estas lesiones desaparecieron en uno o dos días. Su peso es 15kilos (-2 DS para la edad). Su talla en el percentil 10. La biometría hemática reporta únicamente una marcada eosinofilia, con 600 eosinófilos/ml de sangre. Se realiza un coproparasitario que reporta la presencia de larvas parasitarias. Seleccionar el literal que contenga el parásito más probable de acuerdo con el cuadro clínico de este niño, y el medicamento con el que debería realizarse el tratamiento:","opts":["Strongyloides stercoralis; ivermectina, 3mg una vez al día, durante 2 días.","Ascaris lumbricoides; albendazol, 200mg en una sola toma, por una sola vez.","Giardia lamblia; metronidazol, 250 mg, 1 c/día, luego de una comida, 10 días.","Enterobius vermicularis; mebendazol, 100 mg dos veces diarias, por 7 días."],"ans":[0],"fix":0},{"id":687,"page":263,"q":"Un paciente de 25 años es trasladado de urgencia al hospital donde usted lo recibe como consecuencia de un traumatismo importante de tórax por un accidente vehicular. Al examen físico se constata polipnea, desviación de la tráquea hacia la derecha a nivel del cuello y ausencia de murmullo vesicular en hemitórax izquierdo. Escoja la conducta inicial adecuada para salvar la vida del paciente.","opts":["Toracocentesis con aguja.","Intubación orotraqueal.","Reposición de fluidos y sangre.","Reanimación cardiopulmonar."],"ans":[0],"fix":0},{"id":688,"page":264,"q":"Seleccione el antimicrobiano y la dosis adecuada para el tratamiento profiláctico de Infección de Vías Urinarias (IVU) en niños:","opts":["Cotrimoxazol: Trimetroprim: 2 mg/kg + Sulfametoxazol 10 mg/kg, al acostarle (Horas Sueño).","Cotrimoxazol: Trimetroprim: 4 mg/kg + Sulfametoxazol 20 mg/kg, en 2 tomas/día.","Nitrofurantoina: 10 mg/kg al acostarle (Horas Sueño).","Nitrofurantoina: 20 mg/kg en 2 tomas/día."],"ans":[0],"fix":0},{"id":689,"page":264,"q":"Una niña de 4 años acude hoy al Centro de Salud para un control. Tiene un IMC de 17 que en la curva de crecimiento de la OMS corresponde a una puntuación Zeta (Zeta escore o desviaciones estándar) de +1 a +2. De acuerdo a los estándares de crecimiento de la OMS. ¿Cuál de las siguientes opciones sería el diagnóstico más probable?","opts":["Riesgo sobrepeso.","Dentro de lo normal.","Sobrepeso evidente.","Obesidad leve."],"ans":[0],"fix":0},{"id":690,"page":264,"q":"Mujer de 59 años, acude a consulta por dolor lumbar derecho, alza térmica, vómito, disuria y hematuria desde hace 2 días. Ha presentado desde hace 10 años varios episodios con similares manifestaciones clínicas que han determinado hospitalización en 3 ocasiones. La TA es de 130/80 mm Hg, temperatura bucal 38.9°C, dolor a la puño percusión en la región lumbar derecha. La biometría revela 15.840 leucocitos, 79% neutrófilos, urea 23 mg/dl, creatinina 1,1 mg/dl. EMO: nitritos positivos, cilindros leucocitarios positivos, eritrocitos 30 por campo, leucocitos 35 por campo, bacterias +++. No se dispone aún del resultado del hemo y urocultivo. La ecografía reveló un cálculo que ocupa la pelvis renal derecha. ¿Cuál es el agente bacteriano que se asocia más frecuentemente a la infección que presenta la paciente?","opts":["Proteus mirabilis","Citrobacter freundii","Enterococcus faecium","Stafilococo epidermidis"],"ans":[0],"fix":0},{"id":691,"page":265,"q":"Paciente de  y cavum.","Rx de cavum y de tórax.","Rx de tórax y de senos maxilares."],"ans":[0],"fix":0},{"id":695,"page":266,"q":"Paciente de 70 años con diagnóstico de EPOC que requirió reposo en cama, acude a consulta por dolor torácico, disnea, tos, cianosis, hemoptisis, diaforesis; al examen físico presenta taquipnea, hipotensión, a la auscultación pulmonar hay presencia de estertores basales audibles, se escucha un galope cardíaco, en la pantorrilla derecha hay un desgarro muscular, en la extremidad superior derecha hay un hematoma con celulitis. En la Rx de tórax se reporta una elevación del hemidiafragma con infiltración pulmonar basal derecha y pequeño derrame pleural. Enfocándose en la etiología de la tromboembolia pulmonar, en cuadros clínicos como el expuesto. ¿Cuál es la causa principal de la insuficiencia respiratoria aguda?","opts":["Traumatismo de miembro inferior.","EPOC.","Traumatismo de miembro superior.","Inactividad física."],"ans":[0],"fix":0},{"id":696,"page":266,"q":"¿Qué tipo de fractura ocasiona lesión del plexo braquial?","opts":["De clavícula.","Del codo.","Proximal del húmero.","Distal del húmero."],"ans":[0],"fix":0},{"id":697,"page":267,"q":"¿Cuál es la complicación materna que se asocia a graves deficiencias neurológicas del lactante por parto distócico?","opts":["Rotura uterina.","Fístula vesicovaginal.","Lesión del piso pélvico.","Lesión puerperal de nervios de miembros inferiores."],"ans":[0],"fix":0},{"id":698,"page":267,"q":"Una paciente de 18 años con diagnóstico de anorexia nerviosa, ingresa grave al hospital, ¿Cuál de las siguientes complicaciones se asocia con alta mortalidad en esta patología?","opts":["Arritmias.","Insuficiencia renal.","Hipofosfatemia.","Anemia."],"ans":[0],"fix":0},{"id":699,"page":267,"q":"¿Cuál es el tratamiento que necesita el paciente en la fase de agravación del síndrome de Guillain Barré?","opts":["Inmunoglobulina intravenosa y plasmaféresis.","Glucocorticoides.","Rehabilitación.","Electroestimulación."],"ans":[0],"fix":0},{"id":700,"page":268,"q":"Una mujer de 40 años acude a la consulta por presentar ausencia de ciclos menstruales desde hace 13 meses acompañada de resequedad vaginal y dispareunia. Refiere insomnio y llanto fácil. Dentro de sus antecedentes patológicos tiene hipotiroidismo diagnosticado a los 30 años, toma levotiroxina 75 ug/día, último control hace un mes (eutiroidea), síndrome de ovario poliquístico manejado con anticonceptivos orales hasta los 40 años. Antecedentes obstétricos G3P2A1, último embarazo a los 29 años, aborto, resuelto con legrado uterino instrumental. Al examen físico Peso 56Kg Talla 1.56m, IMC 23kg/m2, TA 120/70 mmHg; cicatrices de acné en cara; hirsutismo moderado; Tiroides no palpable; mamas nodulares, no secreciones por pezón; abdomen normal; región genital: mucosa vaginal pálida, con zonas eritematosas. Flujo vaginal escaso sin mal olor. ¿Cuál de los siguientes es el estudio diagnóstico más adecuado para realizar en este momento?","opts":["Cuantificación de FSH","Relación LH/FSH","Cuantificación de Testosterona libre","Cuantificación de TSH"],"ans":[0],"fix":0},{"id":701,"page":268,"q":"En relación con el parvovirus humano B19. ¿Cuál es el enunciado correcto?","opts":["La infección fetal se relaciona con aborto, hidropesía no inmunitaria y óbito.","Siempre es asintomática en la mujer embarazada infectada.","El diagnóstico fetal es exclusivamente con hallazgos ecográficos.","Para la prevención se debe vacunar a la mujer embarazada."],"ans":[0],"fix":0},{"id":702,"page":269,"q":"Varón de 45 años, presenta desde hace 3 meses dolor y sensación urente en las plantas de pies y hormigueo en las pantorrillas; ocasionalmente, hay sensación de hormigueo en las manos. El paciente está en tratamiento por tuberculosis meníngea desde hace 5 meses y completó la primera fase de tratamiento con isoniazida, rifampicina, pirazinamida, etambutol y prednisona. Desde hace 3 meses recibe diariamente isoniazida, rifampicina y prednisona (5 mg). Las pruebas para VIH y sífilis fueron negativas. Los signos vitales son normales, IMC 17 kg/m2, Glasgow 15/15, pares craneales normales. Hay arreflexia aquiliana bilateral, hipoestesia en bota bilateral, disminución de la sensibilidad vibratoria en ambas piernas y paresia distal de 4+/5 en los miembros inferiores. Glucosa basal 118 mg/dl, pruebas de función hepática son normales. La electromiografía mostró una polineuropatía sensitiva axonal en miembros inferiores. ¿Cuál de los siguientes fármacos puede producir polineuropatía en este paciente?","opts":["Isoniazida.","Rifampicina.","Pirazinamida.","Etambutol."],"ans":[0],"fix":0},{"id":703,"page":269,"q":"En relación al uso de antibióticos en la ruptura prematura de membranas pretérmino (RPMP) es:","opts":["El uso de antibióticos está asociado con una reducción estadísticamente significativa de corioamnionitis.","El uso de clindaminicina en el tratamiento profiláctico de RPMP está asociado a un incremento de enterocolitis necrotizante.","Se recomienda un manejo expectante con antibióticos por 72 horas y dependiendo de la edad gestacional se decidirá el proceder.","El tratamiento de elección es amoxicilina-ácido clavulanico por 7 días."],"ans":[0],"fix":0},{"id":704,"page":270,"q":"Mujer de 33 años, agricultora, residente en la zona rural de Pastaza. Hace 2 meses presentó una lesión nodular no dolorosa en la cara anterior del antebrazo izquierdo, que posteriormente se ulceró y que no ha cicatrizado. Refiere múltiples picaduras de mosquitos y que otros miembros de su familia tienen lesiones similares. En el examen físico, presencia de una úlcera no dolorosa, excavada y con costra superficial de 45 x 22 mm, rodeada de una zona de induración de 65 x 30 mm. No hay signos de infección sobreañadida. Hay adenopatías axilares izquierdas, no dolorosas. El frotis de la lesión revela infiltrado mononuclear y abundantes amastigotes. ¿Cuál es el agente infeccioso productor de la úlcera en esta paciente?","opts":["Leshmania panamensis","Mycobacterium ulcerans","Mycobacterium leprae","Leshmania donovani"],"ans":[0],"fix":0},{"id":705,"page":270,"q":"Una mujer de 35 años con diagnóstico de bocio tiroideo multinodular ingresa al servicio de Cirugía general para ser sometida a tiroidectomía total. Al momento del ingreso paciente se encuentra asintomática. Sus antecedentes personales incluyen hipotiroidismo desde hace 3 años en tratamiento con levotiroxina 50 microgramos/día. La cirugía tuvo una duración de 120 minutos, con dificultad para la disección debido al tamaño muy aumentado de la glándula tiroidea. Al terminar la cirugía los signos vitales fueron FC:80/min, FR:19/min, TA:120/75 mmHg, T: 36.8°C; sin embargo al retirar el tubo endotraqueal la saturación de oxígeno disminuye a 80%, y la paciente presenta importante estridor. Al examen físico se evidencia cianosis peribucal, drenaje colocado en lecho quirúrgico sin producción hemática, región cervical anterior sin masas expansivas, tampoco se palpa enfisema subcutáneo. ¿Cuál considera fue la etiología de esta complicación?","opts":["Lesión bilateral de nervio laríngeo recurrente.","Lesión bilateral de nervio laríngeo superior.","Lesión quirúrgica de las glándulas paratiroideas.","Lesión inadvertida de la tráquea."],"ans":[0],"fix":0},{"id":706,"page":271,"q":"Paciente femenina de 63 años con diagnóstico de cirrosis por una colangitis biliar primaria (en tratamiento con propranolol, espironolactona y furosemida), acude a su control con facultativo por presentar dolor abdominal y sensación de alza térmica de 12 horas de evolución. No refiere náusea ni vómito. Catarsis: refiere en los últimos 5 días tendencia al estreñimiento debido a que no ha podido salir a hacer sus ejercicios habituales y ha disminuido su ingesta de frutas. Su hija indica que no ha notado cambios en la personalidad de su madre. Al examen físico, TA: 120/60 mmHg, frecuencia cardíaca: 64 x minuto, T: 37.6 °C, sat O2 93%. Conjuntivas rosadas, mucosas orales semihúmedas. Cardiopulmonar: normal. Abdomen: globoso, distendido, doloroso a la palpación de forma difusa, onda ascítica positiva, ruidos conservados. No edemas en miembros inferiores, examen neurológico normal. Se realiza una paracentesis diagnóstica. ¿Qué esperaría encontrar?","opts":["Más de 250/uL neutrófilos.","Menos de 200/uL de neutrófilos.","Más de 250/uL linfocitos.","Menos de 250 u/L de linfocitos."],"ans":[0],"fix":0},{"id":707,"page":271,"q":"¿En qué patología se encuentra el Signo de Kussmaul (aumento de la presión venosa durante la inspiración cuando está respirando de manera espontánea)?","opts":["Taponamiento cardiaco.","Hemotórax masivo.","Neumotórax a tensión.","Tórax inestable."],"ans":[0],"fix":0},{"id":708,"page":272,"q":"Recién nacido masculino de 8 horas de vida, llevado a neonatología por dificultad respiratoria. En sus antecedentes personales se destacan embarazo de 37 semanas de edad gestacional, cesárea sin labor de parto por diabetes materna descompensada, apgar 8-9, peso 3200 gramos. Al examen físico paciente con quejido respiratorio audible a distancia, frecuencia respiratoria 68/minuto, frecuencia cardiaca 180 /minuto, saturación de oxígeno 80%, retracciones intercostales leves, aleteo nasal leve, auscultación pulmonar con rales ocasionales. Exámenes en sangre: leucocitos 18.000 /mm3, neutrófilos 45%, linfocitos 45%, hematocrito 57%, plaquetas 200.000/mm3, proteína C reactiva 1 mg/l. Radiografía de tórax con aumento de la trama vascular bilateral. ¿Cuál es el diagnóstico más probable en este paciente?","opts":["Taquipnea transitoria del recién nacido.","Enfermedad de membrana hialina.","Neumonía neonatal transparto.","Hipertensión pulmonar persistente del recién nacido."],"ans":[0],"fix":0},{"id":709,"page":272,"q":"Seleccione el patrón de resultados que representa un diagnóstico de diabetes mellitus tipo 2 (Nota: HOMA: valor referencial menor a 3; Péptido C, valor referencial: 0.7- 3ng/ml).","opts":["Glucemia en ayunas: 127 mg/dl, Tolerancia de glucosa a 2h: 210 mg/dl, HbA1c: 6.8, HOMA: 5.6, Péptido C: 6.7 ng/ml.","Glucemia en ayunas: 168 mg/dl, Tolerancia de glucosa a 2h: 342 mg/dl, HbA1c: 8.5, HOMA: 2.2, Péptido C: 0.3 ng/ml.","Glucemia en ayunas: 102 mg/dl, Tolerancia de glucosa a 2h: 167 mg/dl, HbA1c: 6.1, HOMA: 4.3, Péptido C: 4.2 ng/ml.","Glucemia en ayunas: 99 mg/dl, Tolerancia de glucosa a 2h: 135 mg/dl, HbA1c: 5.4, HOMA: 1.9 Péptido C: 2.1 ng/ml."],"ans":[0],"fix":0},{"id":710,"page":273,"q":"Varón de 6 años es atendido en consulta externa por expulsión de gusano de 10 cm por la nariz, hace 72 horas. Hace 15 días cursó cuadro compatible con infección respiratoria que se resolvió espontáneamente. No tiene antecedentes médicos de importancia. Al examen físico sus signos vitales están normales y sus curvas de peso- talla están en el percentil 10. Coprológico: se identifican huevos de ascaris. ¿Qué tratamiento es el más apropiado para este paciente?","opts":["Albendazol","Metronidazol","Tinidazol","Secnidazol"],"ans":[0],"fix":0},{"id":711,"page":273,"q":"Se presenta el caso de una paciente de 32 años que es llevada a la consulta por su esposo, que está preocupado porque tiene “ideas extrañas”. La paciente, que tiene un diagnóstico de una enfermedad mental en tratamiento irregular con litio, se encuentra actualmente en un estado de expansión afectiva, ligeramente agitada y taquifasica. Constantemente hace referencias a que está bendita y que todas sus acciones están de acuerdo con “el señor de los cielos”, que la protege y la ha elegido como su mensajera. Esta idea se mantiene con convicción extrema y no tambalea ante cuestionamiento por parte de sus seres queridos. ¿Cuál es el diagnóstico de este paciente?","opts":["Enfermedad bipolar.","Depresión mayor.","Demencia vascular.","Ataque de pánico."],"ans":[0],"fix":0},{"id":712,"page":274,"q":"En el diagnóstico diferencial del tromboembolismo pulmonar (TEP) hay que tener en cuenta otras causas de disnea. ¿Cuál es la opción que refleja el cuadro clínico más compatible con un TEP?","opts":["Paciente femenino de 68 años, obesa, con prótesis de cadera derecha que presenta disnea de pequeños esfuerzos en las últimas 12h y taquicardia.","Paciente masculino de 45 años, normopeso, con insuficiencia venosa periférica, que presenta disnea de 48h acompañada de tos, expectoración, fiebre y escalofríos.","Paciente femenina de 29 años, delgada, con lupus eritematoso sistémico, que presenta disnea de 6h de evolución tras haber presentado discusión con su pareja.","Paciente masculino de 34 años, obeso, operado hace 12 días de la rodilla derecha, presenta disnea ligera de 3 días de evolución y sibilancias finas en ambos ápices."],"ans":[0],"fix":1},{"id":713,"page":274,"q":"Un escolar presenta hace 24 horas una lesión dérmica superficial en el brazo, dolorosa al tacto, con un aspecto rojo brillante. Los bordes de la lesión son bien definidos y un poco elevados. La superficie de la dermis tiene aspecto de cáscara de naranja. El comienzo de las lesiones fue súbito y estuvo acompañado de fiebre alta que persiste hasta el momento. El cultivo obtenido por aspirado con aguja del borde de avance de la lesión reportó colonias de Streeptococo del grupo A sensible a la meticilina. ¿Cuál es el diagnóstico más probable y el tratamiento antimicrobiano adecuado para este paciente?","opts":["Erisipela. Penicilina G / benzatina.","Escarlatina. Penicilina G benzatínica.","Fascitis necrotizante. Ampicilina intravenosa.","Impétigo. Mupirocina local + Amoxicilina oral."],"ans":[0],"fix":0},{"id":714,"page":274,"q":"El síndrome séptico en el embarazo se acompaña de gran variedad de manifestaciones clínicas y complementarias. Seleccione el conjunto de resultados de laboratorio esperados en este caso:","opts":["Leucocitosis, trombocitopenia, hiperglucemia, hiperbilirrubinemia.","Leucocitosis, trombocitopenia, hipoglucemia, hiperuricemia.","Leucocitosis, trombocitosis, hiperglucemia, bilirrubina normal.","Leucocitosis, trombocitosis, hipoglucemia, hiperbilirrubinemia."]," ácido úrico","Hemocultivo y urocultivo"],"ans":[0],"fix":0},{"id":718,"page":276,"q":"Hombre de 18 años, acude a emergencia por empeoramiento progresivo de disnea y tos seca en las últimas 2 semanas. Antecedentes: Asma bronquial desde la infancia en tratamiento con inhalador de Salmeterol. Examen físico: TA: 130/80 mmHg, FC: 125 lpm, FR: 26 rpm, Saturación: 85% aire ambiente (2850m). Paciente consciente, vigil, cianosis peribucal, mucosas orales secas. Tórax: expansibilidad disminuida, retracciones subcostales, a la percusión hipersonoridad pulmonar bilateral, a la auscultación murmullo vesicular disminuido, aisladas sibilancias espiratorias. Corazón: ruidos cardíacos rítmicos, no soplos. Resto de examen normal. Gasometría arterial: Ph 7,38, PCO2 28 mmHg, PO2 50 mmHg, HCO3 20 mEq/L. Se administra oxigenoterapia por mascara facial FIO2 35%. ¿Cuál es el tratamiento más adecuado?","opts":["Salbutamol.","Teofilina.","Anticolinérgico.","Corticoides sistémicos."],"ans":[0],"fix":0},{"id":719,"page":277,"q":"Usted es médico rural de un Centro de Salud, atiende a una paciente de 13 años, con FUM hace 10 días que desde hace 2 meses presenta aproximadamente 18 comedones abiertos negros y blanquecinos cerrados en la frente y en ambas mejillas, sin otros síntomas acompañantes. ¿Cuál es el tratamiento de primera línea en este tipo de acné?","opts":["Adapaleno gel tópico al 0.1 % una vez al día durante 12 semanas.","Tetrinoína gel tópico al 0.025 % una vez al día durante 8 semanas.","Ácido azelaico crema tópica al 20 % una vez al día durante 12 semanas.","Dapsona 100 mg vía oral una vez al día durante 8 semanas."],"ans":[0],"fix":0},{"id":720,"page":277,"q":"Se trata de una bacteria que es causa de más de la cuarta parte de todas las diarreas agudas acuosas en los niños y adultos en los países en desarrollo, especialmente durante las estaciones calientes y húmedas. Se transmite usualmente por alimentos y agua contaminados. Se reconocen 5 grupos. Uno de estos grupos es la causa más común de la diarrea de los viajeros. Estas son características del agente etiológico de la diarrea conocida como:","opts":["E. Coli.","Campylobacter Jejuni.","Rotavirus.","Giardia duodenalis."],"ans":[0],"fix":0},{"id":721,"page":277,"q":"La definición correcta de ruptura prematura de membranas lejos de término es:","opts":["Entre 24 - 34 semanas y 6 días de gestación.","Entre 35 - 36 semanas y 6 días de gestación.","Entre las 24 - 28 semanas de gestación.","Antes de las 24 semanas de gestación."],"ans":[0],"fix":0},{"id":722,"page":278,"q":"Paciente femenina de 58 años con 6 a 7 crisis diarias de dolor punzante intenso en la mejilla y barbilla, que duran 2 a 4 min y se desencadenan con el roce del viento en la cara o al tocársela. ¿Cuál de los siguientes, es el tratamiento de primera línea para este caso?","opts":["Carbamazepina 400 mg QD.","Fenitoína 100 mg QD.","Amitriptilina 25 mg QD.","Gabapetina 300 mg TID."],"ans":[0],"fix":0},{"id":723,"page":278,"q":"Niño de 8 años que presenta varias deposiciones diarreicas. Al examen físico se encuentra con mucosas orales secas, lágrimas disminuidas y llenado capilar de 4 segundos. En este caso, ¿Cuál es el grado de deshidratación que presenta?","opts":["Deshidratación moderada.","Deshidratación leve.","Deshidratación severo.","Deshidratación Indeterminada."],"ans":[0],"fix":0},{"id":724,"page":278,"q":"Paciente de 34 años, con traumatismo cerrado de tórax. Refiere dolor torácico intenso y disnea. A la exploración hay signos de distrés respiratorio agudo, enfisema subcutáneo e hiperresonancia a la percusión de hemitórax derecho. ¿Cuál es el manejo más adecuado?","opts":["Descompresión inmediata mediante la inserción de tubo torácico.","Descompresión con aguja previa radiografía urgente de tórax.","Radiografía diagnóstica de tórax y descompresión con tubo torácico.","Toracoscopia urgente y descompresión inmediata con aguja."],"ans":[0],"fix":0},{"id":725,"page":279,"q":"El patógeno bacteriano típico que ocasiona neumonía extrahospitalaria es:","opts":["Streptococcus neumoniae.","Mycoplasma pneumoniae.","Legionella pneumoniae.","Serratina marcenscens."],"ans":[0],"fix":0},{"id":726,"page":279,"q":"Se considera menopausia temprana con un fallo ovárico prematuro en una mujer que:","opts":["Tiene menos de 40 años.","Tiene menos de 45 años.","Presenta amenorrea durante 3 meses.","Presenta amenorrea durante 6 meses."],"ans":[0],"fix":0},{"id":727,"page":279,"q":"Mujer de 19 años, soltera con IVSA a los 17 años y una pareja sexual. Realiza a menudo duchas vaginales desde hace 1 año. Refiere que desde hace 3 días y justo después de la menstruación presenta leucorrea mucopurulenta, fiebre 38.6 °C, dispaurenia y dolor en hipogastrio. No síntomas miccionales, no vómitos. La BHCG sérica es negativa. ¿Qué espera encontrar en el examen físico como ayuda en el diagnóstico?","opts":["Dolor con la movilización del cuello uterino.","Puño percusión positiva en zona lumbar derecha.","Flujo vaginal mucoide en la especuloscopía.","Dolor anexial ausente en la exploración bimanual vaginal."],"ans":[0],"fix":0},{"id":728,"page":279,"q":"Varón de 8 años acude con resultados de chequeo coprológico de rutina. El examen reporta quistes de Giardia liamblia. Paciente se encuentra asintomático. No registra antecedentes médicos de importancia. Al examen físico los signos vitales están normales y las curvas de peso-talla son adecuadas para un crecimiento en el percentil 75. ¿Cuál es el medicamento de primera línea para el tratamiento de este parásito?","opts":["Metronidazol.","Albendazol.","Ivermectina.","Pamoato de pirantelo."],"ans":[0],"fix":0},{"id":729,"page":280,"q":"En el diagnóstico de enfermedad chagásica crónica, es importante tener un alto grado de sospecha. De los siguientes cuadros clínicos, seleccione aquel que menos sugiera una cardiopatía chagásica:","opts":["Femenina de 36 años, florista, antecedente de amigdalitis repetitivas, que presenta disnea de medianos esfuerzos y palpitaciones de 1 año de evolución. Soplo diastólico mitral grado III/VI y chasquido de apertura. EKG: Fibrilación auricular lenta. Examenes de laboratorio con ASTO elevado.","Hombre no fumador, 42 años, campesino, sin antecedentes médicos cardiovasculares. Lesiones dermatológicas en antebrazos desde hace 2 años. Disnea de medianos esfuerzos de 6 meses de evolución y edemas de miembros inferiores. Soplo sistólico mitral grado II /VI. EKG: Bloqueo AV de primer grado.","Hombre de 44 años, viajero frecuente, asintomático hasta que presenta un ictus isquémico, por lo cual se realiza ecocardiograma y se encuentra miocardiopatía dilatada con trombo auricular izquierdo. No tabaquismo ni drogas. No enfermedades cardiólogicas previas. EKG: Bloqueo AV Mobitz II.","Mujer de 50 años, bióloga, que en radiografía ocupacional encuentran cardiomegalia. Refiere disnea progresiva que ahora es de medianos esfuerzos, no reportada porque pensaba que era algo momentáneo. EKG: Bloqueo de rama derecha + fascicular anterior. Sin antecedentes cardiopulmonares previos."],"ans":[0],"fix":0},{"id":730,"page":280,"q":"Paciente femenina de 16 años, acude a consulta por no haber presentado su menstruación, refiere presencia de dolor pélvico tipo cólico de manera cíclica. Al examen físico evidencia desarrollo de caracteres sexuales secundarios y sus genitales externos son de características normales. La ecografía transabdominal es sugestiva de hematocolpos y hematometra. ¿Cuál es el diagnóstico?","opts":["Amenorrea primaria a causa de un himen imperforado.","Amenorrea primaria producida por un síndrome de Asherman.","Amenorrea secundaria debido a defectos en el desarrollo de los conductos de Müller.","Amenorrea secundaria relacionado a una insensibilidad androgénica."],"ans":[0],"fix":0},{"id":731,"page":281,"q":"Madre de 16 años, Peso: 59 kg; Talla: 148 cm. G1 P1 A0. Estudiante de colegio. Durante el embarazo, después de primer trimestre tomaba aspirina con frecuencia debido a que presentaba cefaleas constantes. Da a luz a un recién nacido masculino, de 39 semanas de gestación por cesárea. El RN tiene un Peso de 2 200 g; Talla: 45 cm; PC: 32 cm. APGAR 7 / 9. En consecuencia se diagnostica retardo de crecimiento intrauterino simétrico. Las siguientes situaciones producen retraso en el crecimiento intrauterino. EXCEPTO:","opts":["Uso de aspirina por parte de la madre.","La edad en la que se encuentra la madre.","Tabaquismo materno.","Talla corta y peso bajo de la madre."],"ans":[0],"fix":0},{"id":732,"page":281,"q":"Señale el medicamento que se usa como alternativa en el tratamiento sistémico del acné asociado al síndrome de ovario poliquístico:","opts":["Metformina.","Fenitoína.","Azatioprina.","Dexametasona."],"ans":[0],"fix":0},{"id":733,"page":281,"q":"Una niña de 12 meses de edad presenta desde hace 2 días rinorrea serosa, tos no productiva y temperatura de 37.5 °C. Al examen físico se encuentra normal, con secreción ocular bilateral, congestión nasal y eritema faríngeo. ¿Cuál es el tratamiento más adecuado en este caso?","opts":["Acetaminofén.","Loratadina.","Amoxicilina.","Ambroxol."],"ans":[0],"fix":0},{"id":734,"page":282,"q":"Un paciente de 4 años de edad presenta desde hace 2 días fiebre alta, vómito, diarrea y unas lesiones vesiculares dolorosas en los labios. Al examen oral se encuentran un enantema vesicular en la región anterior de la boca, ¿Cuál es el diagnóstico más probable?","opts":["Herpes.","Impétigo.","Muguet.","Escarlatina."],"ans":[0],"fix":0},{"id":735,"page":282,"q":"¿Cuál es la ganancia de peso durante la gestación para una mujer con un índice de masa corporal entre 25 a 29 kg/m2?","opts":["Entre 7 a 10 kg","Entre 12 a 18 kg","Entre 10 a 13 kg","Entre 6 a 7 kg"],"ans":[0],"fix":0},{"id":736,"page":282,"q":"Mujer de 58 años, acude a consulta por aumento de la consistencia fecal (heces Bristol tipo 1 - 2), frecuencia deposicional cada 72 horas, de 6 meses de evolución, para lo cual ha incrementado la ingesta de agua y fibra de origen natural, sin resultados favorables. Antecedentes: Hipotiroidismo. Examen físico: TA: 110/70 mmHg, FC: 74 lpm, FR: 27 rpm. Abdomen: depresible, no doloroso, no masas palpables. Región anorrectal: Esfínter anal tónico, ampolla rectal ocupada por heces semisólidas. Resto de examen físico normal. Se realiza Manometría anorrectal que registra tono en reposo medio del esfínter anal y presión de contracción en valores normales. ¿Cuál es el tratamiento más adecuado?","opts":["Laxantes osmóticos.","Laxantes estimulantes.","Biorretroalimentación.","Tratamiento quirúrgico."],"ans":[0],"fix":0},{"id":737,"page":283,"q":"Hombre de 68 años acude a emergencias porque desde hace 8 horas presenta dolor en hipogastrio e incapacidad para orinar. Niega otros síntomas del tracto urinario inferior. Antecedentes: neoplasia de vejiga en tratamiento con radioterapia, última sesión hace 24 horas. Al examen físico presenta: TA: 120/70 mmHg, FC: 74 lpm, FR: 18 rpm, T: 36ºC. Abdomen: RHA presentes, dolor a la palpación en región suprapúbica, con evidencia de plenitud y sensibilidad a la percusión. No signos de irritación peritoneal. Resto de la exploración normal. Se coloca de inmediato un catéter uretral sin presentar resistencia cercana al meato ni otra dificultad durante el procedimiento, donde se objetiva orina hematúrica con coágulos y se deja conectada sonda 20Fr de tres vías para irrigación vesical continua. ¿Cuál es la causa más probable del cuadro que presenta el paciente?","opts":["Hematuria macroscópica.","Hiperplasia prostática.","Medicamento narcótico.","Estenosis uretral."],"ans":[0],"fix":0},{"id":738,"page":283,"q":"Un varón de 28 años consulta por marcada falta de aire y palpitaciones al menor esfuerzo físico, de 3 años de duración, junto con permanente presencia de mareos y sensación de “caminar en las nubes” o de “tener la cabeza vacía”. Ha recurrido a varios especialistas sin resultados y en ese lapso se le realizaron estudios cardiológicos, neurológicos y neumonológicos, con resultados normales. Al examen aparece ansioso, con frecuentes suspiros y, frecuencia cardíaca regular de 110 lat/min. Al tomar la TA -120/80 mmHg, refiere hormigueos en la mano del brazo explorado, con contractura en forma de “mano de partero”. ¿Cuál es el diagnóstico etiológico más probable?","opts":["Ataque de pánico","Síndrome del túnel carpiano","Hipoparatiroidismo","Hiperpotasemia"],"ans":[0],"fix":0},{"id":739,"page":284,"q":"Gestante de 29 semanas por FUM, con IMC de 18.5 kg/m2 y antecedente de tabaquismo. La ecografía del primer trimestre correlaciona la edad gestacional con la FUM. La ecografía actual objetiva 25 semanas de edad gestacional e índice de líquido amniótico (AFI) 4 cm. A la exploración física 22 cm de altura uterina. ¿Qué criterio se relaciona con restricción del crecimiento intrauterino?","opts":["El cálculo del peso fetal en la ecografía es el método más frecuente para el diagnóstico.","La diferencia de la altura uterina es normal para la edad gestacional que se objetiva en la ecografía.","El índice del líquido amniótico está en valores superiores para la edad gestacional y sugiere el diagnóstico.","La medición de la altura del fondo uterino tiene baja especificidad para detectar la restricción del crecimiento intrauterino."],"ans":[0],"fix":0},{"id":740,"page":284,"q":"Paciente femenino quien presenta a nivel genital úlcera que inicia como pápula eritematosa, que se convierte en pústula y se ulcera en 48 horas, con bordes dolorosos, irregulares, eritematosos y no indurados. ¿Cuál es el diagnóstico clínico?","opts":["Chancroide.","Sífilis primaria.","Herpes genital.","Granuloma inguinal."],"ans":[0],"fix":0},{"id":741,"page":285,"q":"Niño de 8 meses de edad es llevado a consulta externa por su madre por presentar erupción rojiza en la piel, que evolucionó de arriba hacia abajo, desde la cara hacia la parte superior del cuello, el pecho, los brazos y las piernas, llegando hasta la palma de las manos y plantas de los pies. Días previos presentó fiebre 39 °C, tos intensa, catarro y congestión ocular. Antecedentes personales: esquema de vacunación completo para la edad. Al examen físico: frecuencia cardíaca 114 por minuto, frecuencia respiratoria 34 por minuto, temperatura 37.8 °C. Erupción maculopapulosa, rojiza, no vesicular en cara y cuerpo, de progresión cefalocaudal. No presenta adenopatías. ¿Cuál es el agente causal más probable?","opts":["Virus del sarampión.","Virus de la rubéola.","Estreptococo del grupo A.","Virus herpes 6 y 7."],"ans":[0],"fix":1},{"id":742,"page":285,"q":"Paciente de 8 años con criptorquidia derecha es llevado al hospital por dolor escrotal de inicio súbito sin traumatismo previo. No fiebre ni síntomas miccionales. La exploración física muestra edema escrotal doloroso con testículo derecho en posición alta; el reflejo cremastérico está ausente. ¿Qué es lo más común encontrar en la ecografía Doppler?","opts":["Flujo sanguíneo intratesticular izquierdo normal y disminuido en el derecho.","Aumento del flujo sanguíneo intratesticular izquierdo y disminución en el derecho.","Disminución del flujo sanguíneo intratesticular izquierdo y aumento en el derecho.","Flujo sanguíneo intratesticular derecho e izquierdo dentro de la normalidad."],"ans":[0],"fix":0},{"id":743,"page":286,"q":"Una mujer de 48 años es trasladada al servicio de emergencia a causa de dolor torácico que empezó unos 40 minutos antes, inmediatamente luego de cenar. El dolor se incrementó progresivamente en intensidad hasta llegar a ser 9/10, de carácter urente, asociado a un sabor ácido en su boca. Además, se acompaña de náusea, sudoración fría y sensación de muerte inminente. Ha experimentado eventos similares, pero nunca tan intensos como el actual. Está muy preocupada pues piensa que está teniendo un ataque cardíaco. Previamente, el dolor había aliviado con tabletas de carbonato de calcio. No tiene historial de enfermedades cardíacas ni otros problemas de salud. No toma medicamentos. No fuma, no ingiere alcohol ni usa drogas ilícitas. Al examen: TA: 125/70 mm Hg, FC: 78 x min, FR: 18 x min, SatO2: 93 %, el resto de la exploración física es normal. Sus exámenes de laboratorio iniciales son normales al igual que un ECG. Se administra nitroglicerina sublingual y sorpresivamente el dolor cesa. ¿Cuál de los siguientes diagnósticos diferenciales es el más probable en esta paciente?","opts":["Espasmo esofágico.","Angina inestable.","Miocarditis.","Embolismo pulmonar."],"ans":[0],"fix":0},{"id":744,"page":286,"q":"Los siguientes son factores de riesgo sociodemográficos para el suicidio consumado. EXCEPTO:","opts":["Sexo femenino.","Sexo masculino.","Divorcio.","Desempleo."],"ans":[0],"fix":0},{"id":745,"page":286,"q":"Señale la característica correcta con respecto al implante subdérmico que contiene etonogestrel:","opts":["Provoca amenorrea.","Tiene una duración de cinco años.","Se aplica trimestralmente.","Provoca sangrados abundantes."],"ans":[0],"fix":0},{"id":746,"page":287,"q":"La radiografía de caderas de una niña de 3 meses de edad presenta signos de displasia del desarrollo de la cadera izquierda. Identificar el literal que describe en mejor forma las características radiográficas de esta patología:","opts":["Hipoplasia del núcleo femoral izquierdo, ángulo acetabular izquierdo de 36 grados, línea de Perkins desplazada hacia afuera del techo acetabular izquierdo.","Presencia del núcleo femoral izquierdo, ángulo acetabular izquierdo inferior de 27 grados, línea de Perkins alineada desde el extremo lateral del techo acetabular izquierdo con la epífisis femoral.","Hipoplasia del núcleo femoral izquierdo, ángulo acetabular izquierdo de 26 grados, línea de Perkins alineada desde el extremo lateral del techo acetabular izquierdo con la epífisis femoral.","Presencia del núcleo femoral izquierdo, ángulo acetabular izquierdo de 28 grados, línea de Perkins desplazada hacia afuera del techo acetabular izquierdo."],"ans":[0],"fix":0},{"id":747,"page":287,"q":"Paciente de 22 años, con 9 semanas de gestación, sin antecedentes de interés. Refiere que desde hace 2 semanas presenta astenia sin otros síntomas acompañantes, en la analítica se objetiva: Hb 10.6 g/dL, Hto 31 %, VCM: 83 fL, leucocitos 13 250, neutrófilos 58 %, linfocitos 35 %, eosinófilos 3 %, monocitos 2 %, basófilos 2 %, plaquetas 135 000/ul, glucosa 91 mg/dL, creatinina 0.7 mg/dL. EMO: pH: 7.6, leucocitos ++, piocitos 12-15/campo, sangre++, nitritos +, bacterias ++, bacilos gram negativos 20/campo, proteínas +. Seleccione las conductas terapéuticas más adecuadas 1. Nitrofurantoína de liberación prolongada 50 mg/6 horas durante 1 semana. 2. Previa toma de urocultivo prescribir fosfomicina 3 gr vía oral dosis única. 3. Sulfato ferroso 30 mg/día por vía oral. 4. Hierro elemental 120 mg/día por vía oral. 5. Previa toma de urocultivo administrar cefoxitina 500 mg/ 12 horas vía oral. 6. Ácido fólico 400 ug/día por vía oral.","opts":["2, 4, 6","1, 3, 5","3, 5, 6","2, 3, 4"],"ans":[0],"fix":1},{"id":748,"page":288,"q":"Una mujer de 34 años, primigesta, de 37 semanas de gestación, es transferida a la emergencia del hospital por presentar en la consulta externa cifras tensionales de 140 /90 con proteinuria negativa. Al interrogatorio, sintomatología vasomotora y percibe movimientos fetales. Sin antecedentes personales de importancia. Su madre tuvo preeclampsia en su primera gestación. Al examen físico: TA 140/95 mmHg, FC: 96 latidos/min. Abdomen gestante, altura de fondo uterino acorde con edad gestacional, feto único, vivo, cefálico izquierdo FCF 140 latidos /min. Reflejo patelar 2/5. Exámenes: Hematocrito 37 %, Plaquetas 150 000, ALT 29 AST 32 mUI, bilirrubina total 1 g/dl, Creatinina 0.5mg/dl, índice proteinuria/creatininuria 0.1. Se decide terminar el embarazo por parto céfalo vaginal. En el puerperio inmediato las cifras tensionales persisten en 140/90. ¿En cuánto tiempo después del parto define el diagnóstico diferencial de este trastorno hipertensivo?","opts":["A las doce semanas.","A la semana.","A las cuatro semanas.","A las ocho semanas."],"ans":[0],"fix":0},{"id":749,"page":288,"q":"Mujer de 75 años es llevada al servicio de emergencia por intenso dolor abdominal difuso de 28 horas de evolución, acompañado de diarreas acuosas vinosas. Antecedentes: fibrilación auricular en tratamiento irregular. Al examen físico presenta: FC: 95/min, FR: 21/min, TA: 100/60 mmHg, temperatura: 36°C. Corazón: ruidos cardiacos arrítmicos, no soplos. Abdomen: ruidos hidroaéreos disminuidos, suave, depresible, dolor intenso de forma difusa, sin defensa muscular ni signos de irritación peritoneal. Se decide realizar laparotomía exploratoria. ¿Cuál es el hallazgo más probable que se encuentre en la paciente?","opts":["Necrosis de asas intestinales.","Apéndice cecal perforado.","Diverticulitis en sigma.","Colangitis."],"ans":[0],"fix":0},{"id":750,"page":289,"q":"Una mujer de 48 años, sin antecedentes patológicos de interés, presenta desde hace 1 mes sensación de pesadez en su región malar derecha. Se acompaña de obstrucción nasal y rinorrea amarillenta, fétida por la fosa nasal derecha. Fue evaluada por un médico, quien consideró que se trataría de un cuadro de sinusitis bacteriana aguda, prescribió amoxicilina- ácido clavulánico durante 15 días, sin alcanzar mejoría clínica. Se practica una TC de senos paranasales que evidencia una ocupación del seno maxilar derecho, el resto de senos paranasales y las fosas nasales se encuentran libres. La ocupación del seno maxilar es heterogénea con calcificaciones en su interior. El seno no se encuentra dilatado ni presenta erosiones óseas. Dada la descripción de este cuadro, ¿Cuál sería su diagnóstico más probable?","opts":["Bola fúngica.","Mucocele de seno maxilar.","Sinusitis bacteriana aguda.","Poliposis naso sinusal."],"ans":[0],"fix":0},{"id":751,"page":289,"q":"Lactante de 4 meses acude a la consulta por tos y rinorrea abundantes desde hace 3 días. Su madre indica que desde esta mañana respira más rápido y se le hunden más las costillas. No ha tenido fiebre. Se le realiza lavado nasal efectivo en la consulta, expulsa gran cantidad de mucosidad. A los 5 minutos se reevalúa: mantiene tiraje subcostal e intercostal moderados, auscultación pulmonar con buena ventilación bilateral con abundantes sibilancias espiratorias en ambos campos pulmonares, frecuencia respiratoria de 67 rpm y SO2 de 94%. ¿Cuál es la conducta integral más adecuada para el manejo de este paciente?","opts":["Remitir al servicio de Urgencias para su valoración y tratamiento.","Mantener una actitud expectante ya que a partir de ahora mejorará gradualmente.","Administrar tratamiento antibiótico con amoxicilina a 80 mg/kg/ día.","Realizar tratamiento con inhalaciones de adrenalina 1:1.000."],"ans":[0],"fix":0},{"id":752,"page":290,"q":"Una mujer embarazada se realiza un urocultivo en la semana 12 donde se aíslan más de 100 000 UFC/mL de un solo uropatógeno. Se puede iniciar tratamiento con uno de los siguientes antibióticos. EXCEPTO:","opts":["Trimetoprim sulfametoxasol 160 mg - 800 mg VO cada 12 horas por 7 días.","Nitrofurantoína 100 mg cada 12 horas por 7 días.","Fosfomicina 3 g VO dosis única.","Cefalosporinas de segunda generación 250 - 500 mg VO cada 6 horas por 7 días."],"ans":[0],"fix":0},{"id":753,"page":290,"q":"Un niño de 8 años presenta desde hace 5 días dolor abdominal tipo cólico, con aumento progresivo de intensidad. Además, tiene frecuencia aumentada de sus deposiciones en 5 - 6 al día, de cantidad variable, tienen consistencia líquida, con presencia de moco, sangre y sin material purulento o de otro tipo. Últimamente presenta pujo al deponer. Su estado de conciencia y sus signos vitales son normales; sus mucosas están semihúmedas, sus conjuntivas son algo pálidas. Presenta dolor abdominal moderado a la palpación, especialmente en el marco colónico. ¿Cuál de los siguientes parásitos produce el cuadro clínico descrito?","opts":["Entamoeba histolytica.","Ascaris lumbricoides.","Taenia solium.","Giardia lamblia."],"ans":[0],"fix":0},{"id":754,"page":290,"q":"Varón de 61 años acude a consulta externa para evaluación preoperatoria por hernia umbilical. Antecedente de cirrosis hepática en tratamiento clínico con espironolactona. Niega hábitos tabáquico y alcohólico actual. Encefalopatía estadio II. Examen físico: Tensión arterial 140/90 mmHg, frecuencia cardíaca 104 latidos por minuto, frecuencia respiratoria 24 por minuto, IMC 28 Kg/m2. Abdomen: onda ascítica. Hernia umbilical reducible. Telangiectasias periféricas. Laboratorio: Bilirrubina 2.5 mg/dL, Albumina 3 g/L, Tiempo de protrombina: 16 segundos. INR 1.2. ¿Cuál es el factor que predice menor riesgo quirúrgico en este paciente?","opts":["Índice internacional normalizado (INR).","Encefalopatía.","Bilirrubina.","Ascitis ligera."],"ans":[0],"fix":0},{"id":755,"page":291,"q":"Hombre de 35 años es llevado a emergencias por presentar traumatismo en muslo derecho luego de una colisión vehicular. Es transportado con todas las medidas de inmovilización. Al examen físico: FC:98/min, FR:22/min, TA: 100/65mmHg, Glasgow 15. En muslo derecho hay intenso dolor y deformidad. La radiografía de extremidad inferior pone de manifiesto una fractura por avulsión del trocanter mayor. ¿Qué músculo podría seguir funcionando?","opts":["Glúteo mayor","Piriforme","Obturador interno","Glúteo medio"],"ans":[0],"fix":0},{"id":756,"page":291,"q":"Un hombre de 25 años es llevado a Emergencias por personal paramédico, por presentar traumatismo penetrante de tórax hace 1 hora aproximadamente. Paciente se encuentra agitado, con dificultad respiratoria, y refiere dolor torácico. No se conocen antecedentes personales. Al examen físico FC: 110/min, FR: 30/min TA: 85 /55 mmHg temperatura: 36 °C, saturación de oxígeno: 80 % al aire ambiente. El tórax presenta herida penetrante de 1 cm a nivel de tercer espacio intercostal derecho en la línea medioclavicular, a la palpación presencia de enfisema subcutáneo perilesional, hemitórax derecho elevado, hiperresonancia a la percusión, con ausencia de murmullo vesicular; ruidos cardíacos rítmicos, taquicárdicos. El cuello presenta ingurgitación yugular. El hemograma muestra leucocitos de 12500/mm3 con 68 % de segmentados neutrófilos, hemoglobina de 12.5 g/dl. Tipificación sanguínea A Rh positivo. ¿Cuál es el procedimiento inmediato que se debe realizar en el paciente?","opts":["Toracostomía con aguja.","Radiografia posteroanterior de tórax.","Pericardiocentesis.","Toracotomía de emergencia."],"ans":[0],"fix":0},{"id":757,"page":292,"q":"Un niño de 6 semanas de vida presentó hace 2 días rinorrea y tos. Hoy presenta aleteo nasal y retracciones subcostales. En el examen se encuentra temperatura: 36.5 °C, frecuencia respiratoria de 70 rpm (respiraciones por minuto), frecuencias cardiaca 120 lpm (latidos por minuto). ¿Cuál sería la conducta más adecuada en este caso?","opts":["Referirlo a un hospital.","Antibioticoterapia ambulatoria.","Tratamiento sintomático.","Decidir en base a radiografía."],"ans":[0],"fix":0},{"id":758,"page":292,"q":"Según el esquema de control prenatal de las Guías de Práctica Clínica del MSP de Ecuador. ¿Cuáles son factores de riesgo para recomendar profilaxis antibiótica para el Streptococcus del grupo B (EGB) en el embarazo? 1. Antecedente de aborto séptico en el último año. 2. Ruptura prematura de membranas mayor a 18 horas. 3. Recién nacido previo con enfermedad invasiva por EGB. 4. Infección urinaria por EGB confirmada en el embarazo actual. 5. Aumento de la temperatura axilar mayor a 39 ºC.","opts":["2, 3, 4","1, 2, 3","1, 4, 5","1, 2, 4"],"ans":[0],"fix":1},{"id":759,"page":293,"q":"Paciente masculino de 3 días de vida traído a emergencias por ictericia. Es hijo de madre de 27 años, embarazo controlado normoevolutivo, nacido a término por parto eutócico, apgar 9-10, alta a las 24 horas. Al examen físico frecuencia cardiaca 120 /minuto, frecuencia respiratoria 45/minuto, temperatura axilar 37 °C, saturación de oxígeno 95 %, cefalohematoma en región parieto-occipital derecha, ictericia generalizada, no otras anomalías. Exámenes: leucocitos 17 000/mm3, neutrófilos 50 %, linfocitos 55 %, hematocrito 50%, plaquetas 180 000/mm3, proteína C reactiva 0 mg/l, bilirrubina total 17 mg/dl, bilirrubina indirecta 16 mg/dl, grupo sanguíneo materno A+, grupo sanguíneo neonato O+. ¿Cuál es la causa más probable de su ictericia?","opts":["Cefalohematoma.","Incompatibilidad ABO.","Sepsis","Ictericia fisiológica."],"ans":[0],"fix":0},{"id":760,"page":293,"q":"Un neonato pretérmino de 33 semanas presenta sepsis. El hemocultivo reporta un germen que tienen capacidad de producir infección transplacentaria. Seleccione el agente causal más probable:","opts":["Listeria monocytogenes.","Estreptococo del grupo B.","Escherichia coli.","Haemophilus influenzae."],"ans":[0],"fix":0},{"id":761,"page":294,"q":"Escolar con un proceso de fiebre, astenia, mialgias y cefalea, seguido una semana más tarde por exantema eritematoso en las mejillas, acompañado de palidez perioral y odinofagia e irritación ocular. Tres días después apareció un exantema eritematoso no descamativo, maculopapular, distribuido en forma simétrica en el tronco. Seleccione la afirmación correcta en relación a la patología descrita:","opts":["Es un eritema infeccioso producido por el parvovirus B19 y su tratamiento es sintomático.","Es una infección por Varicela zoster, contagiosidad superior a 90% y puede tratarse con aciclovir.","Es una roséola infantil, producida por el herpes virus humano tipo 6. Tratamiento sintomático.","Es un sarampión producido por un paramixovirus RNA monocatenario. Se utiliza vitamina A en desnutridos."],"ans":[0],"fix":0},{"id":762,"page":294,"q":"¿Cómo se realiza la profilaxis primaria de la hemorragia aguda por várices esofágicas?","opts":["A través de endoscopía para detección y tratamiento.","Se eliminan desencadenantes y se corrige desequilibrio hidroelectrolítico.","Se usa lactulosa que es la base del tratamiento.","Se debe abstener de la ingesta de alcohol que es lo esencial."],"ans":[0],"fix":0},{"id":763,"page":294,"q":"Un paciente de 40 años es evaluado en la consulta dermatológica por un lunar en su espalda, que según su esposa ha aumentado de tamaño en poco tiempo. Su piel es blanca y nunca ha usado protectores solares. Frecuentemente presenta lunares y arrugas en diferentes partes de su cuerpo. No hay historia familiar de cáncer de piel. Al examen físico se evidencia la lesión sospechosa que cumple con los ABCDEs. Pueden contarse otras 30 lesiones maculares pequeñas, redondeadas en sus brazos y en la espalda. Se toma una biopsia y se determina una profundidad significativa de la lesión. Bajo este contexto clínico, ¿cuál de los siguientes hallazgos sería el mayor factor de mal pronóstico en este paciente?","opts":["Espesor del tumor","Forma asimétrica","Diámetro mayor de 6 mm","Bordes irregulares"],"ans":[0],"fix":0},{"id":764,"page":295,"q":"Una mujer de 50 años acude a consulta médica por presentar dificultad para la deglución desde hace 2 años; la dificultad es igual para alimentos sólidos y líquidos, está acompañada de ardores retroesternales y regurgitación de saliva y alimentos, en especial en la noche cuando se recuesta. Además, refiere pérdida de peso. Sus antecedentes personales incluyen gastritis diagnosticada, sólo por síntomas y sin endoscopía, hace 1 mes toma omeprazol 40mg al día; a pesar de este tratamiento no ha sentido ninguna mejoría. Al examen físico FC: 60/min, FR: 18/min, TA: 120/75 mmHg, temperatura: 36.6 °C, no se evidencian hallazgos significativos. La endoscopia muestra dilatación del cuerpo esofágico y el cardias puntiforme que ofrece una moderada dificultad al paso del fibroscopio. No se observan cambios inflamatorios ni lesiones en la mucosa esofágica. El hemograma muestra leucocitos de 7500/mm3 con 68 % de segmentados neutrófilos. La química sanguínea muestra glucosa de 70 mg/dl y creatinina de 1.1 mg/dl. La paciente presenta un cuadro clínico compatible con:","opts":["Acalasia.","Enfermedad por reflujo gastroesofágico.","Esofagitis.","Pseudoacalasia."],"ans":[0],"fix":0},{"id":765,"page":295,"q":"Un escolar de 11 años, pesa 36 kg. Desde hace 24 horas presenta fiebre alta, odinofagia, malestar general y anorexia. T: 39.3 °C; FC: 96 x 1´; TA: 110/70 mmHg; Facies febril con mejillas enrojecidas y palidez perioral. Adenomegalias submaxilares dolorosas; hipertrofia y congestión amigdalina con exudado blanquecino, purulento. Algunas petequias diseminadas en el paladar blando. Determine el diagnóstico y tratamiento de primera elección:","opts":["Amigdalitis estreptocócica aguda, penicilina G benzatínica 1 200 000 UI IM, una sola vez + Paracetamol 500 mg PO cada 6 horas, 3 días.","Amigdalitis estreptocócica aguda, penicilina G benzatínica 600 000 UI IM, una sola vez + Paracetamol 500 mg PO cada 6 horas, 3 días.","Faringoamigdalitis aguda, Amoxicilina 500 mg por vía oral c / 8 horas, durante 7 días + Paracetamol 500 mg PO cada 6 horas, 3 días.","Amigdalitis estreptocócica aguda, azitromicina 200 mg PO QD, por 3 días seguidos + Paracetamol 500 mg PO cada 6 horas, 3 días."],"ans":[0],"fix":0},{"id":766,"page":296,"q":"Una adolescente cuya menarquia se presentó hace 2 años, consulta por palidez, cansancio y anorexia. Al examen se aprecia palidez palmar y un soplo sistólico en mesocardio grado 2/6. La biometría hemática revela un recuento eritrocitario disminuido y glóbulos rojos hipocrómicos y microcíticos. El recuento leucocitario y el plaquetario son normales, ¿Qué prueba de laboratorio solicitaría para establecer el origen de esta anemia?","opts":["Determinación de metabolismo de hierro.","Aspirado medular.","Recuento de reticulocitos.","Electroforesis de hemoglobina."],"ans":[0],"fix":0},{"id":767,"page":296,"q":"Paciente de 1 año, febril, con movimientos tónicos generalizados de más de 10 minutos de duración, cianosis distal y relajación de esfínteres. Indique el fármaco que debe administrar:","opts":["Diazepam rectal.","Fenitoína intravenosa.","Fenobarbital intravenoso.","Ácido valproico intravenoso."],"ans":[0],"fix":0},{"id":768,"page":296,"q":"Mujer de 58 años, evaluada en urgencias por dolor abdominal. Refiere 18 horas de dolor abdominal que se ubica en cuadrante superior derecho desencadenado por la ingesta de grasa, ha tenido episodios similares previos en los últimos 3 años. Antecedentes de diabetes mellitus tipo II en tratamiento formal con metformina. Examen físico: Tensión arterial 140/90 mmHg, frecuencia cardíaca 110 latidos por minuto, frecuencia respiratoria 16 por minuto, T: 38 °C, IMC 31 Kg/m2. Abdomen: Murphy positivo. Ruidos hidroaéreos disminuidos. Laboratorio: Hemoglobina glicosilada: 5.9 %. Ecografía: colecistitis aguda sin dilatación de la vía biliar. ¿Cuál es el riesgo quirúrgico de ASA (American Society of Anesthesiologists) para esta paciente?","opts":["ASA II.","ASA I.","ASA III.","ASA IV."],"ans":[0],"fix":0},{"id":769,"page":297,"q":"¿Qué drogas producen transformación en la percepción y dependencia psíquica?","opts":["Cannabicos: marihuana, hashish.","Depresores del SNC: opio, morfina.","Estimulantes del SNC: cocaína, anfetaminas.","Inhalables volátiles: cemento de contacto, gasolina."],"ans":[0],"fix":0},{"id":770,"page":297,"q":"Una mujer de 45 años consulta por presentar dolor abdominal en hipogastrio de cuatro meses de evolución, es persistente a lo largo del ciclo y no mejora con la menstruación. Sin antecedentes personales de importancia. Antecedentes gíneco obstétricos: menarquia a los 11 años, ciclos menstruales cada 28 días por 5 días, FUM: hace 15 días, dismenorrea primaria, planificación familiar preservativo. G1 P1 hace 4 años. Al examen físico: TA: 110/67 mmHg , FC: 68/min, FR: 18/min, T: 37 °C. El abdomen es doloroso a la palpación en hipogastrio y fosas ilíacas, Blumberg negativo. Región genital: flujo vaginal normal. Al tacto vaginal: útero en retroversoflexión, fijo, anexo izquierdo doloroso y aumentado de tamaño, con dificultad para su delimitación por dolor. Anexo derecho no palpable. La ecografía reporta un quiste de ovario izquierdo de 7 cm de diámetro con contenido finamente particulado (imagen de vidrio esmerilado). ¿Cuál es el diagnóstico más probable de la paciente?","opts":["Endometrioma.","Quiste folicular.","Quiste hemorrágico.","Tecoma."],"ans":[0],"fix":0},{"id":771,"page":298,"q":"Paciente masculino de 2 años, sin antecedentes de importancia, acude a emergencias por presentar fiebre de 3 días de evolución, rinorrea, tos. Desde hace 12 horas presenta somnolencia, irritabilidad, vómitos en proyectil. Al examen tiene 39 °C, mal estado general, taquicárdico, taquipnea, rigidez nucal, signos de Kernig y Brudzinski positivos. Biometría hemática: leucocitos 4000/mm3, neutrófilos 50 %, linfocitos 40 %, monocitos 10%, hemoglobina 12 gr/dl, hematocrito 36%, plaquetas 60.000/mm3, procalcitonina 5 ug/ml. Líquido cefalorraquídeo: leucocitos 1000/mm3, neutrófilos 70 %, mononucleares 30 %, proteínas 200 mg/dl, glucosa 35 mg/dl, glucemia 100 mg/dl. ¿Cuál es la antibioticoterapia inicial para este paciente?","opts":["Ceftriaxona + vancomicina.","Ceftriaxona + aciclovir.","Ceftriaxona + penicilina G.","Cefotaxima + ampicilina."],"ans":[0],"fix":0},{"id":772,"page":298,"q":"Lactante de 1 año con letargia, náusea, disfonía, aversión a las tomas, crecimiento retardado, estridor, episodios de otitis media, sinusitis ocasional. Al examen no se observan lesiones bucales ni orofaríngeas. No refiere dolor retroesternal, se ha suspendido medicación oral desde hace 6 meses, no refiere alergias cutáneas o alimentarias. ¿Cuál es el diagnóstico?","opts":["Reflujo gastroesofágico.","Esofagitis eosinofílica.","Esofagitis infecciosa.","Esofagitis por píldora."],"ans":[0],"fix":0},{"id":773,"page":299,"q":"Hombre de 55 años, acude a consulta externa por urgencia miccional y disminución en el calibre del flujo de orina, 4 meses de evolución. Antecedentes: prostatitis aguda a los 40 años. En el examen físico: TA: 110/70 mmHg, FC: 68 LPM, FR: 16 RPM. Tacto rectal se palpa próstata sin anomalías. Resto de la exploración normal. Se revisa complementarios de 6 meses atrás: PSA total 15 ng/ml, ecografía pélvica con próstata peso 70 gr. Complementarios actuales: Densidad de PSA aumentada, Velocidad de PSA 0.3 ng/ml/año, ecografía transrectal con próstata 75 gr. ¿Cuál de las siguientes opciones justifica la indicación de biopsia prostática?","opts":["PSA Total.","Tacto rectal.","Densidad de PSA.","Velocidad de PSA."],"ans":[0],"fix":0},{"id":774,"page":299,"q":"Mujer de 16 años acude a consulta, en donde refiere que realiza ayuno voluntario e intermitente desde hace 8 meses. Aclara no haber tomado laxantes, ni estimulado al vómito. Adicionalmente, confiesa temor permanente a subir de peso y considera que debería ser inferior al que presenta en el momento de la consulta. Antecedentes personales: no ha presentado trastorno mental. Al examen físico: IMC 19 kg/m2. ¿Cuál es el diagnóstico más probable?","opts":["Trastorno del comportamiento alimentario.","Síndrome de pica.","Trastorno de ansiedad.","Anorexia nerviosa con peso corporal significativamente bajo."],"ans":[0],"fix":0},{"id":775,"page":300,"q":"Una mujer de 32 años junto a su esposo, acude a su consulta consternada por presentar 3 abortos espontáneos, cada uno antes de llegar a las 12 semanas de gestación. La paciente refiere que hace 5 meses ha intentado concebir sin éxito, en ese tiempo nota que no tolera las temperaturas bajas, presenta un estado de ánimo depresivo y refiere fatigada todo el tiempo. El mes pasado el ginecólogo le diagnostica hipotiroidismo subclínico. En su familia su madre y abuela materna padecen de enfermedades autoinmunes. Al examen físico encuentra una temperatura de 36.8 °C, TA: 100/60 mmHg, FR: 16/min, FC: 79/min, Sat O2: 95%, peso: 48 kilos, talla: 1.53 cm. La paciente se encuentra consciente orientada, sin alteraciones al examen físico. Los exámenes de laboratorio presentan: Hemograma: leucocitos 9.300 /mm cúbico, hemoglobina: 16 g/dL. Glucosa: 86.2 mg/dL, creatinina 0.74 mg/dL, colesterol total 172.7 g/dL. ¿Cómo esperaría encontrar el perfil tiroideo de esta paciente?","opts":["TSH elevada o normal, T4 normal.","TSH elevada, T4 baja.","TSH baja, T4 elevada.","TSH normal, T4 normal."],"ans":[0],"fix":0},{"id":776,"page":300,"q":"Un paciente de 14 años es llevado a la emergencia por sus padres, quienes lo encontraron inconsciente en el piso de su dormitorio hace menos de una hora. Al momento del interrogatorio el paciente se encuentra consciente pero no recuerda su nombre ni reconoce a sus padres, pero recuerda vagamente eventos del día anterior. Al examen físico no se encuentran hallazgos de importancia. Cómo único antecedente importante los padres refieren que el paciente tuvo una riña con su pareja días antes, lo que le generó mucha ansiedad. ¿Qué trastorno parecería presentar este paciente?","opts":["Trastorno disociativo","Simulación","Trastorno conversivo","Trastorno de síntomas somáticos"],"ans":[0],"fix":0},{"id":777,"page":301,"q":"El signo de Chvostek se presenta habitualmente en:","opts":["Hipocalcemia.","Hiponatremia.","Hipofosfatemia.","Hipopotasemia."],"ans":[0],"fix":0},{"id":778,"page":301,"q":"Mientras usted realiza su rotación de Neumología, se le encarga el cuidado de un paciente de 72 años que fue internado por presentar: disnea, dolor de tipo pleurítico, fiebre y baja de peso. El examen físico realizado por el residente muestra una FR de 24/min, disminución de entrada de aire en el lóbulo pulmonar inferior izquierdo acompañado de un sonido mate a la percusión. Se solicita una placa PA y lateral de tórax que da muestra de un derrame pleural, se realiza una toracocentesis obteniéndose un fluido pleural de tipo hemorrágico. El residente antes de terminar su turno ordena los siguientes análisis. LDH sérico 110 U/L (N: 45-90), proteínas totales 8 g/dl (6.0-7.8 g/dL), LDH fluido pleural 230 U/L, proteínas en fluido pleural 14 g/dL. Elija el diagnóstico más probable de este caso:","opts":["Derrame pleural de tipo exudado por malignidad.","Derrame pleural de tipo trasudado por falla cardiaca.","Derrame pleural de tipo trasudado por embolia pulmonar.","Derrame pleural de tipo exudado por neumonía."],"ans":[0],"fix":0},{"id":779,"page":302,"q":"Una paciente de 20 años acude a la consulta por presentar una masa en su seno izquierdo. La paciente descubrió dicha masa al bañarse y ha estado presente por seis meses. La masa no es dolorosa, no le genera molestias y no hay antecedente de trauma. Su menarquia ocurrió a los 13 años y sus ciclos menstruales son regulares. Nunca ha estado embarazada y toma contraceptivos orales. Su historia familiar es positiva por cáncer de mama en una tía materna a la edad de 55 años. Al examen físico, sus signos vitales son normales. El examen mamario muestra mamas simétricas. En la unión de los cuadrantes externos de la mama izquierda se palpa una masa firme, móvil, de aproximadamente 3 cm. de diámetro. No se palpa nódulos axilares. Un ultrasonido mamario revela una masa ovoide, sólida, horizontal, hipoecogénica, de bordes regulares, de mediana dureza, con mínima vascularización. ¿Cuál es el diagnóstico más probable?","opts":["Fibroadenoma.","Quiste mamario.","Necrosis grasa.","Tumor filodes."],"ans":[0],"fix":0},{"id":780,"page":302,"q":"De las siguientes patologías que están relacionadas con el diagnóstico diferencial del delirium, señale la que presenta entre sus características: inicio subagudo, infrecuente asociación con problemas médicos, rara vez presenta delirios y nunca presenta alucinaciones visuales:","opts":["Depresión.","Esquizofrenia.","Demencia.","Psicosis."],"ans":[0],"fix":0},{"id":781,"page":303,"q":"Paciente de 60 años y 60 kg de peso, hipertenso en tratamiento con losartan 50/día. Sufre caída casual con esguince de tobillo derecho grado I, está con vendaje desde hace 10 días y con tratamiento de: ibuprofeno, paracetamol alternados cada 8 horas y omeprazol 20 mg/día. Acude a urgencias por disnea súbita y dolor torácico derecho en punta de dedo, no irradiado, sin cortejo vegetativo. EF: Consciente, orientado. Glasgow 15/15. TA: 118/77 FC: 116 lpm. SatO2: 93 % aire ambiente. T: 36.2. AC: RCR no soplos. AP: MV conservado, sin ruidos sobreañadidos. MMII: Homans dudoso en pierna derecha. Resto sin alteraciones significativas. ECG: taquicardia sinusal a 112 lpm sin alteraciones de la repolarización. Plaquetas 78 000, Hb 14 g/dL Hto: 45 %, Creatinina 1 mg/dL, coagulación normal. Dímero D: 610 ng /ml (N: <500 ng/ml). Gaso arterial pH: 7,49 PCO2: 30 mm Hg, PaO2: 62 mm Hg, HCO3: 14 meq/lt, SatO2: 93%. Rx tórax: normal. ¿Cuál es el tratamiento inicial de elección para este paciente?","opts":["Oxígeno en gafas nasales a 2 lpm y fondaparinux 7.5 mg al día por vía subcutánea sin necesidad de vigilancia por técnicas de laboratorio.","Ventilación mecánica y heparina sódica 5 000 unidades por vía intravenosa en bolo y venoclisis continua con control de INR en rango de 2 a 3.","Oxígeno en gafas nasales a 2 lpm y heparina de bajo peso molecular 60 unidades por vía subcutánea al día y control de INR en rango entre 2 a 3.","Oxígeno en máscara Venturi al 26 % a 6 lpm y enoxaparina 1 mg/kg peso por vía subcutánea cada 24 horas con control mediante antifactor Xa."],"ans":[0],"fix":0},{"id":782,"page":303,"q":"¿En qué clase de anemia está contraindicada la administración de hierro durante el embarazo?","opts":["Talasemia.","Anemia perniciosa.","Anemia por déficit de ácido fólico.","Anemia crónica."],"ans":[0],"fix":0},{"id":783,"page":303,"q":"¿Cuándo el choque cardiógeno produce el pulmón húmedo (EAP)?","opts":["Hipoperfusión periférica.","Hipotensión compensada.","Irreversible.","Inflamatoria (SRIS)."],"ans":[0],"fix":0},{"id":784,"page":304,"q":"Varón de 18 años, evaluado en urgencias por dolor abdominal. Niega antecedentes médicos de importancia. Refiere 18 horas de dolor abdominal que inicio en región periumbilical y se localizó en cuadrante inferior derecho. Examen físico: Tensión arterial 120/80 ":[0],"fix":0},{"id":811,"page":313,"q":"Paciente mujer de 55 años nota cansancio y debilidad desde hace algunas semanas. Acude a consulta médica. El facultativo palpa un pequeño bocio que la paciente no ha notado. En la anamnesis dirigida, el médico se percata que la paciente ha aumentado de peso y presenta estreñimiento. Decide realizar una biopsia de tiroides que reporta infiltración linfocítica marcada. Elija los resultados de laboratorio que tengan relación con el caso clínico descrito: 1. TSH elevada. 2. TSH baja. 3. T4 libre elevada. 4. T4 libre baja.","opts":["1, 4","1, 3","2, 3","2, 4"],"ans":[0],"fix":1},{"id":812,"page":314,"q":"Una niña de 12 meses de edad pesa 7.3 kg, su talla es de 69 cm. Presenta anorexia, gatea un poco, no intenta caminar; dice mamá y papá. Se solicitan exámenes de sangre, orina y heces. El examen de sangre presenta los siguientes valores: Leucocitos 9 500; Hematíes 3 850 000; Hemoglobina 10.3 g/dl; Hematocrito 34 %; Volumen Corpuscular Medio 73 fL; Hemoglobina Corpuscular Media 23 pc; Reticulocitos 0.5 %. Plaquetas 220 000/mm3. El frotis de sangre periférica indica la presencia de microcitosis, hipocromía central de los eritrocitos. Los exámenes de orina y heces son normales. ¿Cuál es el diagnóstico más probable?","opts":["Anemia ferropénica.","Anemia megaloblástica.","Anemia aplásica por los niveles bajos de eritrocitos, hemoglobina, hematocrito y la presencia de reticulocitos.","Anemia fisiológica de los lactantes, por los valores hematológicos encontrados."],"ans":[0],"fix":0},{"id":813,"page":314,"q":"Lactante menor de 4 meses, sin antecedentes respiratorios, presenta hace 4 días rinorrea y tos moderada. En la actualidad tiene fiebre de 37.9 °C hace 24 horas, tos intensa, acompañado de dificultad respiratoria y no quiere lactar. Al examen físico se encuentra decaído, T: 38 °C; FR: 40 x minuto; FC: 104 x minuto. Se observa tiraje intercostal, retracción supraesternal, sibilancias difusas y estertores a lo largo del ciclo respirat pts":["Grado IV.","Grado I.","Grado II.","Grado III."],"ans":[0],"fix":0},{"id":856,"page":330,"q":"La profilaxis ocular de Credé previene la oftalmía del recién nacido. ¿Cuál es agente relacionado con este procedimiento?","opts":["Neisseria gonorrheae.","Stafilococcus aureus.","Herpes simple tipo I.","Trichomona hominis."],"ans":[0],"fix":0},{"id":857,"page":330,"q":"¿Qué dato de espirometría se interpreta como obstrucción muy intensa (del flujo de aire) Etapa (IV) de GOLD en la EPOC?","opts":["FEV (Volumen Espiratorio Forzado) 1 <30 % de la cifra prevista.","FEV (Volumen Espiratorio Forzado) 1 >80 % de la cifra prevista.","FEV (Volumen Espiratorio Forzado) 1 >30 % pero <50 % de la cifra prevista.","FEV (Volumen Espiratorio Forzado) 1 >50 % pero <80 % de la cifra prevista."],"ans":[0],"fix":0},{"id":858,"page":331,"q":"Gestante de 30 años, con 34 semanas de embarazo, fumadora habitual desde los 24 años de 10 unidades a la semana, hace 4 meses ha disminuido a 3 unidades a la semana, sin otros antecedentes de interés. Refiere que hace 4 días realizó vuelo transatlántico de 10 horas, desde entonces nota edema y dolor en la región posterior de la pierna derecha que ha ido en aumento y empeora con la deambulación. Desde hace 1 día presenta además disnea de moderada intensidad que aumenta con el esfuerzo físico. En el control prenatal hace 1 semana le indicaron que estaba todo normal y recomendaron abandonar el tabaco. No antecedente traumático, no fiebre, no dolor torácico ni tos. Examen físico: Consciente, orientada. Glasgow 15/15. TA: 118/74 FC: 122 lpm. SatO2: 93% aire ambiente. T: 36.2. AC: RCR, soplo pansistólico grado II/VI. AP: MV conservado, sin ruidos sobreañadidos. Pierna derecha: Edema con fóvea +, aumento del perímetro respecto a contralateral, tibial anterior disminuido, Homans dudoso. No eritema ni aumento de temperatura local. Resto sin alteraciones significativas. Hemograma, bioquímica y coagulación normales. PCR 2. Dímero D: 572 ng/ml (N: <500 ng/ml). Ecocardiografía transtorácica: derrame pericárdico benigno y signo de McConnell. Señale lo correcto respecto a la patología de la paciente:","opts":["El Dímero D es menos sensible para detectar trombosis venosa profunda que para identificar tromboembolismo pulmonar.","El electrocardiograma tiene alta sensibilidad, es típico la taquicardia sinusal con onda S en III, T invertida en I, onda Q en III.","La presencia de derrame pericárdico benigno al estar embarazada es un criterio de mal pronóstico que precisa ingreso hospitalario inmediato.","El ecocardiograma es un método diagnóstico de primera elección antes del enzimoinmunoanálisis de adsorción con dímero D."],"ans":[0],"fix":0},{"id":859,"page":331,"q":"En una Clave Azul obstétrica que sobrepasa la capacidad de resolución del establecimiento, la persona encargada de activar la red para la transferencia de la paciente es:","opts":["Circulante.","Coordinador.","Asistente 1.","Asistente 2."],"ans":[0],"fix":0},{"id":860,"page":332,"q":"Paciente femenina de un año, sin antecedentes patológicos, presenta movimientos tónico – clónicos generalizados durante 4 a 5 min, cianosis peribucal y temperatura de 38 ºC. ¿Cuál es el diagnóstico?","opts":["Crisis febril simple.","Crisis febril compleja.","Estatus epiléptico febril.","Epilepsia con crisis febril."],"ans":[0],"fix":0},{"id":861,"page":332,"q":"Una mujer de 28 años cursando su primer embarazo de 39 semanas acudió al servicio de emergencia porque refiere presencia de contracciones uterinas. Comunica que las contracciones iniciaron hace 8 horas pero que cada vez son más frecuentes e intensas, los movimientos fetales se encuentran presentes. No ha presentado sangrado ni salida de líquido por vía vaginal. Sus antecedentes obstétricos incluyen primera gesta, con controles prenatales mensuales y ecografías dentro de la normalidad. Al examen físico FC: 84/min, FR: 21/min, temperatura 36 °C, TA: 115/75 mmHg. FCF: 155/min. Abdomen gestante con fondo uterino a término, feto único
